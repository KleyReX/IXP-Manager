externalDocs:
  description: Prose documentation for this API (docs/provisioning-api.md)
  url: https://github.com/inex/IXP-Manager/blob/master/docs/provisioning-api.md

servers:
  - url: https://{host}/admin/api/v4/provisioning
    description: An IXP Manager installation with the provisioning API switched on.
    variables:
      host:
        default: manager.example.net
        description: |
          Hostname of the IXP Manager installation, for example `manager.kleyrex.net`.

security:
  - ApiKeyAuth: []

tags:
  - name: Members
    description: |
      Listing, creating, reading and changing members (customers), and their registered company
      and billing details.
  - name: Contacts
    description: A member's contact persons and their roles (contact groups).
  - name: Users
    description: |
      Creating, finding, changing and deleting portal users, and the links which give them
      access to members, each with its own privilege.
  - name: Connections
    description: |
      A member's connections to the exchange - its virtual interfaces - and their physical
      interfaces: creating, listing, reading, changing, moving and removing them.
  - name: VLAN interfaces and MAC addresses
    description: |
      A connection's presence in one VLAN - addresses, hostnames, route server and other
      sessions - and the MAC addresses configured for it.
  - name: Reference data
    description: |
      What an ordering system looks up to place an order and to keep its own records in step:
      switches, free ports, infrastructures, VLANs and their address pools, IRRDB sources,
      facilities, racks and vendors - and `ping`, which checks the key. Everything reads,
      except the IRRDB source find-or-create.
  - name: Onboarding
    description: A member, an optional user and an optional connection in one transaction.

paths:

  /member:
    get:
      tags: [ Members ]
      operationId: listMembers
      summary: List members
      description: |
        Every member matching the filters, ordered by `id`, in the representation
        `GET /member/{cust}` returns. `total` counts every match, not just the page.

        The filters are the admin member list's - status, type, current only, tag - plus the
        lookups an external system needs to map its records: AS number, shortname, a name
        search, reseller and `updated_since`. Validated by `ListCustomers`; the web list reads
        its filters unvalidated and ignores what it does not recognise, which an unattended
        caller cannot notice. Here an unknown id, a value outside the allowed set and **any
        parameter not listed below** are `422` - a misspelt `shortname` would otherwise return
        the first page of all members, and its first entry would look like the match.

        **`updated_since` is a convenience, not a change feed.** It compares with
        `cust.updated_at`, inclusively; an offset in the value is honoured. Writes which bypass
        Eloquent do not touch `updated_at` - the daily `ixp-manager:update-in-manrs` and
        `ixp-manager:update-in-peeringdb` jobs reset the flags of every member that way, so a
        member dropping out of MANRS or PeeringDB is never reported, while every current member
        listed there is reported after every run (the jobs set the flag again through the
        model). A NULL `updated_at` never matches, and changes to the billing and registration
        details do not touch `cust.updated_at`.
      parameters:
        - name: status
          in: query
          required: false
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
          schema:
            type: integer
            enum: [ 1, 2, 3 ]
          example: 3
        - name: type
          in: query
          required: false
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
          schema:
            type: integer
            enum: [ 1, 2, 3, 4 ]
          example: 1
        - name: current
          in: query
          required: false
          description: |
            `1` or `true`: members whose `is_current` is true - `Customer::SQL_CUST_CURRENT`,
            current through the leave date itself. `0` or `false`: every other member, one
            without a join date included. The two partition the members.
          schema:
            type: string
            enum: [ '1', '0', 'true', 'false' ]
          example: '1'
        - name: autsys
          in: query
          required: false
          description: AS number.
          schema:
            type: integer
            minimum: 1
          example: 12586
        - name: shortname
          in: query
          required: false
          description: |
            Exact shortname - not a substring. The column's collation compares
            case-insensitively, and shortnames are unique in that sense.
          schema:
            type: string
            maxLength: 255
          example: examplenet
        - name: q
          in: query
          required: false
          description: |
            A substring of the name or the shortname, case-insensitive. `%` and `_` are taken
            literally.
          schema:
            type: string
            maxLength: 255
          example: example
        - name: reseller
          in: query
          required: false
          description: Members resold by this member. Must exist in `cust.id`.
          schema:
            type: integer
            minimum: 1
          example: 42
        - name: tag
          in: query
          required: false
          description: Members carrying this tag. Must exist in `cust_tag.id`.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: updated_since
          in: query
          required: false
          description: |
            Members whose `updated_at` is at or after this point in time. Anything Laravel's
            `date` rule accepts; ISO 8601 with an offset is the sane choice. Feed back the
            greatest `updated_at` seen and expect those members again. See the operation's
            description for what this does not see.
          schema:
            type: string
            format: date-time
          example: '2026-11-01T00:00:00Z'
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 500
        - name: offset
          in: query
          required: false
          description: Members to skip, in `id` order.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 500
      responses:
        '200':
          description: The page of matching members, and how many match in all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
              example:
                members:
                  - id: 97
                    name: Example Networks GmbH
                    shortname: examplenet
                    abbreviatedName: EXAMPLE
                    type: 1
                    status: 1
                    autsys: 12586
                    maxprefixes: 500
                    maxprefixesv6: 500
                    peeringemail: peering@example.net
                    peeringmacro: AS-EXAMPLE
                    peeringmacrov6: null
                    peeringpolicy: open
                    irrdb: 1
                    datejoin: '2026-08-01'
                    dateleave: null
                    reseller: null
                    isReseller: false
                    corpwww: https://www.example.net
                    nocphone: '+49 69 1234567'
                    noc24hphone: null
                    nocemail: noc@example.net
                    nochours: 24x7
                    nocwww: null
                    MD5Support: 'YES'
                    activepeeringmatrix: true
                    peeringdb_oauth: true
                    in_manrs: false
                    in_peeringdb: true
                    is_current: true
                    has_left: false
                    creator: '3'
                    lastupdatedby: 3
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
                total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            A parameter failed validation - a value outside its set, a `limit` outside
            1..1000, a `reseller` or `tag` which does not exist, an unparseable
            `updated_since` - or the request carries a parameter this endpoint does not know.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                unknownParameter:
                  summary: a misspelt filter
                  value:
                    message: "Unknown parameter 'short_name'. This endpoint accepts: status, type, current, autsys, shortname, q, reseller, tag, updated_since, limit, offset."
                    errors:
                      short_name:
                        - "Unknown parameter 'short_name'. This endpoint accepts: status, type, current, autsys, shortname, q, reseller, tag, updated_since, limit, offset."
                unknownTag:
                  summary: a tag which does not exist
                  value:
                    message: The selected tag is invalid.
                    errors:
                      tag:
                        - The selected tag is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Members ]
      operationId: createMember
      summary: Create a member
      description: |
        Mirrors `CustomerController@store`, including the `CompanyBillingDetail` and
        `CompanyRegisteredDetail` records it creates alongside the customer — but wraps all
        three inserts in a transaction, which the web path does not, so a failure here cannot
        leave orphaned detail rows behind.

        Validation uses `IXP\Http\Requests\Api\V4\Provisioning\StoreCustomer`, which extends the
        web form request `IXP\Http\Requests\Customer\Store` and adds a declared delta.
        `RulesParityTest` subtracts that delta and asserts the remainder is identical to
        upstream, so a rule changed upstream applies here automatically rather than drifting.

        Two notes on the payload:

        - **`type: 2` (Associate) validates far less.** `Customer\Store::rules()` returns only
          the common fields for an associate member; the AS number, prefix limits, peering and
          NOC fields are then not validated at all.
        - **`dateleft` and `md5support` are accepted but do nothing.** The upstream rules use
          those names, while the columns are `dateleave` and `MD5Support`. Both spellings pass
          validation; only the correctly-cased ones are fillable and reach the database. The
          web rules are left alone — that is upstream's call — and the delta adds rules for the
          names the schema actually uses.

        `isResold` is not a column. It selects whether the `reseller` value is written or
        `null` is written instead. A `cust` or `id` key in the body is removed before
        validation: the inherited rules read the member being edited as `$this->cust`, which
        such a key would otherwise replace - it used to end the request in a `500`.

        The response is the member as stored, read back after the insert, so a field left to
        its database default is reported with that default - `peeringdb_oauth` as `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
            examples:
              full:
                summary: A full member at KleyReX
                value:
                  name: Example Networks GmbH
                  shortname: examplenet
                  abbreviatedName: EXAMPLE
                  type: 1
                  status: 1
                  datejoin: '2026-08-01'
                  autsys: 12586
                  maxprefixes: 500
                  maxprefixesv6: 500
                  peeringemail: peering@example.net
                  peeringmacro: AS-EXAMPLE
                  peeringmacrov6: AS-EXAMPLE
                  peeringpolicy: open
                  irrdb: 1
                  MD5Support: 'NO'
                  nocemail: noc@example.net
                  nocphone: '+49 69 1234567'
                  nochours: 24x7
                  nocwww: https://www.example.net/noc
                  corpwww: https://www.example.net/
                  activepeeringmatrix: true
              associate:
                summary: An associate member — only the common fields are validated
                value:
                  name: Example Association e.V.
                  shortname: exampleassoc
                  abbreviatedName: EXAMPLEA
                  type: 2
                  status: 1
                  datejoin: '2026-08-01'
              resold:
                summary: A member resold by another member
                value:
                  name: Example Reseller Customer GmbH
                  shortname: examplersld
                  abbreviatedName: EXRSLD
                  type: 1
                  status: 1
                  datejoin: '2026-08-01'
                  autsys: 65551
                  isResold: true
                  reseller: 42
      responses:
        '201':
          description: The member was created.
          content:
            application/json:
              schema:
                type: object
                required: [ member ]
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
              example:
                member:
                  id: 97
                  name: Example Networks GmbH
                  shortname: examplenet
                  abbreviatedName: EXAMPLE
                  type: 1
                  status: 1
                  autsys: 12586
                  maxprefixes: 500
                  maxprefixesv6: 500
                  peeringemail: peering@example.net
                  peeringmacro: AS-EXAMPLE
                  peeringmacrov6: AS-EXAMPLE
                  peeringpolicy: open
                  irrdb: 1
                  datejoin: '2026-08-01'
                  dateleave: null
                  reseller: null
                  isReseller: false
                  corpwww: https://www.example.net/
                  nocphone: '+49 69 1234567'
                  noc24hphone: null
                  nocemail: noc@example.net
                  nochours: 24x7
                  nocwww: https://www.example.net/noc
                  MD5Support: 'NO'
                  activepeeringmatrix: true
                  peeringdb_oauth: true
                  in_manrs: false
                  in_peeringdb: false
                  is_current: true
                  has_left: false
                  creator: '1'
                  lastupdatedby: null
                  created_at: '2026-08-01T10:00:00+02:00'
                  updated_at: '2026-08-01T10:00:00+02:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            The payload failed validation — most commonly a `shortname` which is already taken
            (`unique:cust,shortname`), a missing required field, or a resold member with no
            reseller named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                duplicateShortname:
                  summary: shortname already in use
                  value:
                    message: The shortname has already been taken.
                    errors:
                      shortname:
                        - The shortname has already been taken.
                resoldWithoutReseller:
                  summary: isResold set with no reseller
                  value:
                    message: Please choose a reseller
                    errors:
                      reseller:
                        - Please choose a reseller
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /member/{cust}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [ Members ]
      operationId: showMember
      summary: Read a member
      description: |
        Returns the same representation every member endpoint produces - `MemberPresenter`'s.
        The field list is deliberate rather than the model's `toArray()`: the response shape is
        a contract with the caller and should not change because a column was added.

        `datejoin` and `dateleave` are normalised to `Y-m-d`. `Customer` declares them in
        `$dates`, which Laravel no longer honours, so they arrive as raw strings; the presenter
        accepts either form so this keeps working if upstream moves them to `$casts`.
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [ member ]
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
              example:
                member:
                  id: 97
                  name: Example Networks GmbH
                  shortname: examplenet
                  abbreviatedName: EXAMPLE
                  type: 1
                  status: 1
                  autsys: 12586
                  maxprefixes: 500
                  maxprefixesv6: 500
                  peeringemail: peering@example.net
                  peeringmacro: AS-EXAMPLE
                  peeringmacrov6: AS-EXAMPLE
                  peeringpolicy: open
                  irrdb: 1
                  datejoin: '2026-08-01'
                  dateleave: null
                  reseller: null
                  isReseller: false
                  corpwww: https://www.example.net/
                  nocphone: '+49 69 1234567'
                  noc24hphone: null
                  nocemail: noc@example.net
                  nochours: 24x7
                  nocwww: https://www.example.net/noc
                  MD5Support: 'NO'
                  activepeeringmatrix: true
                  peeringdb_oauth: true
                  in_manrs: false
                  in_peeringdb: true
                  is_current: true
                  has_left: false
                  creator: '1'
                  lastupdatedby: null
                  created_at: '2026-08-01T10:00:00+02:00'
                  updated_at: '2026-08-02T03:15:00+02:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Members ]
      operationId: updateMember
      summary: Change a member
      description: |
        Changes any subset of the member's fields - the ones `POST /member` takes. A field that
        is left out keeps its value; a field sent as `null` is cleared. Setting a leave date is
        just `{"dateleave": "2026-11-01"}`.

        The change is validated as the web edit form validates it: `UpdateCustomer` completes
        the request with the member's current values and runs the result through the rules
        `POST /member` uses - the web rules plus the declared delta, held to them by
        `RulesParityTest`. One deliberate leniency: a field which is empty today and not sent
        is not filled in, so a member whose `nocemail` or `peeringpolicy` was never set - which
        the web form would insist on - can still be given a leave date. A value that is sent,
        or already stored, is validated in full.

        Fields outside the edit form (`id`, `creator`, the company detail ids, ...) are
        ignored; a `cust` or `id` key is removed before validation, as at `POST /member`. The
        change is attributed to the key's owner (`lastupdatedby`).

        **The member of the key's own user cannot be deactivated here.** `ApiAuthenticate`
        refuses the key of a user whose default member is suspended or has left, so a change
        which sets that member's `status` to *Suspended*, or a leave date which has passed,
        would lock the caller out with its own request. It is refused with `409`. The check is
        `ApiAuthenticate`'s own query, asked inside the transaction, so it judges the change as
        the next request would, and the rollback takes the change back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
            examples:
              leaveDate:
                summary: set the leave date
                value:
                  dateleave: '2026-11-01'
              clearLeaveDate:
                summary: clear it again
                value:
                  dateleave: null
      responses:
        '200':
          description: The member after the change, and the attributes which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberUpdateResult'
              example:
                member:
                  id: 97
                  name: Example Networks GmbH
                  shortname: examplenet
                  abbreviatedName: EXAMPLE
                  type: 1
                  status: 1
                  autsys: 12586
                  maxprefixes: 500
                  maxprefixesv6: 500
                  peeringemail: peering@example.net
                  peeringmacro: AS-EXAMPLE
                  peeringmacrov6: null
                  peeringpolicy: open
                  irrdb: 1
