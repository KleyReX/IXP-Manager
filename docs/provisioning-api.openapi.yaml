openapi: 3.1.0

info:
  title: IXP Manager Provisioning API
  version: 1.0.0
  summary: Machine-to-machine endpoints for managing members, contacts, portal users and connections.
  description: |
    A stateless, machine-to-machine API through which an external system such as an ordering or
    billing platform creates, reads, changes and removes members, their contacts and portal
    users, and their connections to the exchange in IXP Manager - instead of writing to its
    database.

    It exists because API v4 is otherwise a read and export surface: it publishes switch
    configuration, route server configuration, Nagios targets and DNS data, but has no endpoint
    which creates a member, a user or a port. Those live only in the web controllers, whose
    route group carries the `web` middleware — and `VerifyCsrfToken` excepts only `login`, so
    those POST endpoints cannot be called from outside a browser at all. This API sits in its
    own route group without `web`, authenticated by API key alone.

    ## The API is OFF by default

    The routes are registered by `IXP\Providers\ProvisioningRouteServiceProvider`, which returns
    immediately unless `ixp_api.provisioning.enabled` is true:

    ```
    IXP_API_PROVISIONING_ENABLED=true
    ```

    Until that is set the routes are never registered at all — every path in this document
    responds `404`, and there is nothing to secure. An upgrade cannot quietly expose an IXP to
    endpoints it did not ask for.

    ## Middleware chain

    In the order it runs (`ProvisioningRouteServiceProvider::middleware()`):

    1. `ForceJsonResponse` — sets `Accept: application/json` on the request, so that framework
       errors render as JSON and a `ValidationException` becomes a `422` rather than a `302`.
       Callers do not have to send the header themselves.
    2. `RequireApiKey` — refuses a request with no `X-IXP-Manager-API-Key` header with `401`,
       even when a superuser browser session is present. On a request which has the header
       it discards all cookies and forgets any user already resolved, so the key is the only
       credential `ApiAuthenticate` can see: a session can neither stand in for a key nor
       vouch for an invalid one. Disableable with `IXP_API_PROVISIONING_REQUIRE_KEY=false`,
       which is not recommended.
    3. `api/v4` (`apibase` + `apiauth`) — resolves the key and logs its owner in via
       `Auth::onceUsingId()`.
    4. `assert.privilege:3` — the key's user must be a superuser (`AUTH_SUPERUSER`), else `403`.
    5. `RestrictSourceAddress` — `403` when the source address is covered by neither
       `ixp_api.provisioning.allowed_ips` nor, if set, the `allowed_ips` column of the API key
       presented — modern (`ixpm_…`) and legacy keys alike. An empty list at a layer means
       "no restriction at this layer", not "deny". The address checked is the one Laravel
       reports for the request; IXP Manager configures no trusted proxies, so behind a reverse
       proxy on another host every request appears to come from the proxy.
    6. `throttle:{rate_limit},1` — added only when `ixp_api.provisioning.rate_limit` is greater
       than zero. Default 60 requests per minute **per user** — the owner of the key, so
       several keys of one user share the limit; `0` disables throttling entirely.

    ## Configuration

    | env | default | meaning |
    | --- | --- | --- |
    | `IXP_API_PROVISIONING_ENABLED` | `false` | master switch; nothing is registered when false |
    | `IXP_API_PROVISIONING_REQUIRE_KEY` | `true` | refuse ambient browser credentials |
    | `IXP_API_PROVISIONING_ALLOWED_IPS` | `""` | comma-separated addresses / CIDR, IPv4 and IPv6 |
    | `IXP_API_PROVISIONING_RATE_LIMIT` | `60` | requests per minute per user (the key's owner); `0` disables |

    ## Conventions

    - Base path `/admin/api/v4/provisioning`. Anything which creates, changes or removes state
      uses `POST`, `PATCH` or `DELETE` — never `GET`. There is no `PUT`.
    - **`PATCH` changes only what it is given.** A field left out keeps its value; a field sent
      as `null` is cleared, or refused where the web form requires it. The request is completed
      with the stored values and validated as the web edit form would validate the whole
      record; the response carries `changed`, the fields which actually changed - empty when
      the PATCH matched what was stored.
    - `201` for something created, `200` for a read, a change, a delete or an idempotent no-op
      (including a `POST` which found what it would have created: `POST /irrdb-source`), `404`
      for an unknown id, `409` for a conflict which is not a validation problem - the state of a
      record refuses the change, or another request won a race - and `422` for validation and
      for resource conflicts detected before anything was written. A refused request writes
      nothing.
    - Validation failures carry `message` and an `errors` object keyed by field. Errors raised
      by the controllers themselves (an address outside the pool, an unusable switch port) are
      also `422` but carry `message` only.
    - **Ids in a path are digits only.** Every route parameter is constrained to `[0-9]+`, so
      `member/2abc` matches no route and is a `404` without a lookup. Route model binding used
      to hand such a value to MySQL, which casts `2abc` to `2`.
    - **Ids come from the path, never from the body.** A `cust` or `id` key in a request body is
      ignored: where the inherited web rules read the record being changed through such a name
      (members, billing details, new users, the sections of an onboarding order) it is removed
      before validation, and the user and member link endpoints remove every key named like one
      of their route parameters (`u`, `cust`). A body value would otherwise take the route's
      place - which ended in a `500`, or exempted another user's username from the uniqueness
      check.
    - Booleans in a query string are `1` or `0`: Laravel's `boolean` rule refuses the words
      `true` and `false` there. `current` on `GET /member` takes both forms.
    - Responses are explicit field lists built by the presenters in
      `IXP\Support\Provisioning\Presenters`, not `Model::toArray()`. A column added to the
      schema does not appear here on its own, and no secret ever does: no password hash,
      remember-me token, SNMP community or BGP MD5 secret (write-only, reported as `*_set`).

    ## Special behaviours

    - **`"auto"` addresses.** `ipv4address` / `ipv6address` accept the literal string `auto`,
      which allocates the numerically next free address of that family from the VLAN's pool
      under a row lock inside the request's transaction. The web wizard has no equivalent: an
      operator picks from a list rendered in the browser, an unattended caller has no list.
    - **Explicit addresses must already be in the pool.** `IpAllocator::claim()` is consulted
      before `setIp()`, which would otherwise create the address record on the fly — for an
      unattended caller that turns a typo into a stray address record nothing will clean up.
    - **`reference` makes onboarding retries safe.** Passing the caller's own order identifier
      makes `POST /onboarding` idempotent: the first call returns `201` with `created: true`,
      any repeat of the same reference returns `200` with `created: false` and what the first
      call produced — the member, and the user and connection where it created them. Without a
      reference a retry creates a second member.
    - **No address reservation endpoint.** An address held by nothing but a promise leaks when
      the caller then fails. Allocation happens inside the connection transaction, where it
      either sticks or is rolled back with everything else.
    - **The key cannot lock itself out.** IXP Manager refuses the key of a disabled user or of a
      user whose default member is not active, and these endpoints refuse a user who is not a
      superuser on that member. Closing or suspending the key owner's own member
      (`PATCH /member/{cust}`), disabling, renaming or deleting the owner, and lowering its
      privilege on its default member are therefore refused with `409`.

