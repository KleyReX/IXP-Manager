          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Members ]
      operationId: updateMemberBillingRegistration
      summary: Change a member's registered company and billing details
      description: |
        Mirrors `CustomerController::storeBillingAndRegDetails()`. Validation uses
        `UpdateBillingRegistration`, which extends the web form request
        `IXP\Http\Requests\Customer\BillingInformation` with a delta of `purchaseOrderRequired`
        (boolean) - the web form posts it but no web rule validates it. `MemberRulesParityTest`
        holds the rest to the web rules.

        PATCH semantics as for `PATCH /member/{cust}`: a field left out keeps its value, a field
        sent as `null` is cleared, and the request is completed with the stored values so that it
        is validated like the web form, which always posts everything. A field empty today and
        not sent stays absent. Two refinements, both following the web form: a stored `country`
        / `billingCountry` which is not an ISO 3166 code is neither validated nor cleared unless
        it is sent (the form shows it empty), and the billing fields of a member whose billing
        its reseller manages are not filled in at all (the form has no billing section for it).
        Any other stored value is validated in full.

        Both records change in one transaction. A record the member lacks is created first, as
        `POST /member` would have created it, when the request has something to store in it.

        Departures from the web, all deliberate: only validated fields are written (the web
        passes `$r->all()`); `IXP\Events\Customer\BillingDetailsChanged` fires only when the
        billing record actually changed, after the commit (the web fires it on every save, and
        its listener mails `ixp_fe.customer.billing_updates_notify` each time - never for a
        resold member); and a billing change for a member whose billing its reseller manages is
        refused with `409` instead of being skipped in silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingRegistrationUpdate'
            examples:
              billingContact:
                summary: change the billing e-mail and the VAT number
                value:
                  billingEmail: billing@example.net
                  vatNumber: DE123456789
              registration:
                summary: fill in the registered company details
                value:
                  registeredName: Example Networks GmbH
                  companyNumber: HRB 12345
                  jurisdiction: Frankfurt am Main
                  address1: Hanauer Landstrasse 1
                  townCity: Frankfurt
                  postcode: '60314'
                  country: DE
              clear:
                summary: clear a field
                value:
                  purchaseOrderNumber: null
      responses:
        '200':
          description: The details after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRegistrationUpdateResult'
              example:
                billing_registration:
                  member_id: 97
                  billing_managed_by_reseller: false
                  registration:
                    registeredName: Example Networks GmbH
                    companyNumber: HRB 12345
                    jurisdiction: Frankfurt am Main
                    address1: Hanauer Landstrasse 1
                    address2: null
                    address3: null
                    townCity: Frankfurt
                    postcode: '60314'
                    country: DE
                    notes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                  billing:
                    billingContactName: Accounts Payable
                    billingFrequency: QUARTERLY
                    billingAddress1: Postfach 100
                    billingAddress2: null
                    billingAddress3: null
                    billingTownCity: Offenbach
                    billingPostcode: '63065'
                    billingCountry: DE
                    billingEmail: billing@example.net
                    billingTelephone: '+49 69 1234567'
                    purchaseOrderRequired: false
                    purchaseOrderNumber: null
                    invoiceMethod: EMAIL
                    invoiceEmail: invoices@example.net
                    vatRate: '19'
                    vatNumber: DE123456789
                    billingNotes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
                changed: [ billingEmail, vatNumber ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Reseller mode is on (`IXP_RESELLER_ENABLED`), the member is resold, and the request
            would change a billing field. The member's billing is its reseller's business; the
            web form does not offer it either. Nothing was written - registration fields in the
            same request included. Billing fields sent with the values already stored are no
            change and do not cause this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  The billing details of this customer are managed by its reseller: reseller
                  mode is enabled and the customer is resold, so IXP Manager does not change
                  them - its own form does not offer them either. Nothing was changed. Fields
                  which would have changed: billingEmail, vatNumber.
        '422':
          description: |
            The completed record failed validation - a value the web form would refuse, such as
            a country outside the ISO 3166 list, an invalid `billingEmail` (sent, or already
            stored and not corrected in the same request), an unknown `billingFrequency` or
            `invoiceMethod`, or a `purchaseOrderRequired` which is not a boolean. Nothing is
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected billing country is invalid.
                errors:
                  billingCountry:
                    - The selected billing country is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /contact-group:
    get:
      tags: [ Contacts ]
      operationId: listContactGroups
      summary: List the contact groups a contact can be given
      description: |
        The contact groups - roles such as Billing or Technical, and any further configured
        group type - so that a caller can map names to the ids `roles` takes.

        Contact groups are optional, configured in `config/contact_group.php`, which a stock
        installation does not have. As on the web contact pages they are on only when that file
        defines the `ROLE` type. Then the groups of the configured types are listed, as the web
        contact group list lists them, and `enabled` is true; otherwise the list is empty and
        `enabled` is false, so that "no groups" can be told from "groups are off".

        A contact can be given an *active* group of a listed type. Built by
        `ContactController::groups()` and `ContactGroupPresenter`.
      parameters:
        - name: type
          in: query
          required: false
          description: Restrict to one group type. A type with no groups gives an empty list.
          schema:
            type: string
          example: ROLE
        - name: active
          in: query
          required: false
          description: |
            `1` for active groups only, `0` for inactive ones. Laravel's `boolean` rule: the words
            `true` and `false` are refused in a query string.
          schema:
            type: integer
            enum: [ 0, 1 ]
          example: 1
      responses:
        '200':
          description: The contact groups, ordered by type and name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactGroupList'
              examples:
                configured:
                  summary: groups configured with the ROLE type
                  value:
                    enabled: true
                    contact_groups:
                      - id: 3
                        name: Admin
                        description: Contact role for admin matters
                        type: ROLE
                        active: true
                        limited_to: 0
                        created_at: '2014-01-06T12:54:22+00:00'
                        updated_at: null
                      - id: 1
                        name: Billing
                        description: Contact role for billing matters
                        type: ROLE
                        active: true
                        limited_to: 1
                        created_at: '2014-01-06T12:54:22+00:00'
                        updated_at: '2026-11-24T20:03:34+00:00'
                notConfigured:
                  summary: no config/contact_group.php, or one without the ROLE type
                  value:
                    enabled: false
                    contact_groups: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: A filter is malformed, for example `active=yes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The active field must be true or false.
                errors:
                  active:
                    - The active field must be true or false.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /member/{cust}/contact:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [ Contacts ]
      operationId: listMemberContacts
      summary: List a member's contacts
      description: |
        The member's contacts with their roles, ordered by name. An empty array for a member
        without contacts - not a `404`.

        `role` restricts the list to the contacts in one contact group. It reads the stored
        group links, whether or not groups are configured today. An id which names no group is
        `422`: the web list ignores a filter it does not recognise and shows every contact,
        which here would hand a caller asking for its billing contacts all of them.
      parameters:
        - name: role
          in: query
          required: false
          description: A `contact_group.id`, as `GET /contact-group` lists them.
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: The member's contacts.
          content:
            application/json:
              schema:
                type: object
                required: [ contacts ]
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
              example:
                contacts:
                  - id: 42
                    custid: 97
                    name: Erika Mustermann
                    position: Head of Network Operations
                    email: erika@example.net
                    phone: '+49 69 1234567'
                    mobile: '+49 170 1234567'
                    notes: Prefers email.
                    roles:
                      - id: 1
                        name: Billing
                        type: ROLE
                    created_at: '2026-11-24T20:15:02+00:00'
                    updated_at: '2026-11-24T20:15:02+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`role` is not an integer, or names no contact group.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected role is invalid.
                errors:
                  role:
                    - The selected role is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Contacts ]
      operationId: createMemberContact
      summary: Create a contact for a member
      description: |
        Mirrors `ContactController::doStore()`: `creator` is the username and `lastupdatedby`
        the id of the key's owner, and each role becomes a `contact_to_group` row with
        timestamps. Contact and group links are written in one transaction.

        **Group limits are checked before anything is written**, inside that transaction and
        under a row lock on the member. The web saves the contact first and finds a full group
        afterwards, leaving a contact without its roles; here a full group is `422` and nothing
        is saved, and two requests cannot both take the last place in a group.

        The member comes from the route: a `custid` in the body is overwritten with it.

        **Not idempotent.** A retry after a timeout creates a second contact; list the member's
        contacts before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
            example:
              name: Erika Mustermann
              position: Head of Network Operations
              email: erika@example.net
              phone: '+49 69 1234567'
              mobile: '+49 170 1234567'
              notes: Prefers email.
              roles: [ 1, 2 ]
      responses:
        '201':
          description: The contact was created.
          content:
            application/json:
              schema:
                type: object
                required: [ contact ]
                properties:
                  contact:
                    $ref: '#/components/schemas/Contact'
              example:
                contact:
                  id: 42
                  custid: 97
                  name: Erika Mustermann
                  position: Head of Network Operations
                  email: erika@example.net
                  phone: '+49 69 1234567'
                  mobile: '+49 170 1234567'
                  notes: Prefers email.
                  roles:
                    - id: 1
                      name: Billing
                      type: ROLE
                    - id: 2
                      name: Technical
                      type: ROLE
                  created_at: '2026-11-24T20:15:02+00:00'
                  updated_at: '2026-11-24T20:15:02+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            A group link collided with one written by another request at the same moment. Not
            expected for a new contact, whose id nothing else knows yet; answered rather than
            left to become a `500`. Nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  Another request linked the same contact group while this contact was being
                  created. Nothing was created. Retry.
        '422':
          description: |
            The payload failed validation, or a role cannot be given: it names no group, the
            group is inactive or of a type that is not configured, contact groups are off, or
            the group is full for this member. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidEmail:
                  summary: a value the web form would refuse
                  value:
                    message: The email must be a valid email address.
                    errors:
                      email:
                        - The email must be a valid email address.
                groupFull:
                  summary: a limited group with no room left for this member
                  value:
                    message: >-
                      Contact group ROLE: Billing has a limited membership and is full (1 of 1
                      for this member). Nothing was changed.
                    errors:
                      roles:
                        - >-
                          Contact group ROLE: Billing has a limited membership and is full (1 of
                          1 for this member). Nothing was changed.
                groupsOff:
                  summary: roles sent while contact groups are not configured
                  value:
                    message: >-
                      Contact groups are not configured in this IXP Manager
                      (config/contact_group.php with the ROLE type), so a contact cannot be
                      given roles.
                    errors:
                      roles:
                        - >-
                          Contact groups are not configured in this IXP Manager
                          (config/contact_group.php with the ROLE type), so a contact cannot be
                          given roles.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /contact/{contact}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [ Contacts ]
      operationId: showContact
      summary: Read a contact
      description: The same representation the list and the write endpoints produce.
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema:
                type: object
                required: [ contact ]
                properties:
                  contact:
                    $ref: '#/components/schemas/Contact'
              example:
                contact:
                  id: 42
                  custid: 97
                  name: Erika Mustermann
                  position: Head of Network Operations
                  email: erika@example.net
                  phone: '+49 69 1234567'
                  mobile: '+49 170 1234567'
                  notes: Prefers email.
                  roles:
                    - id: 1
                      name: Billing
                      type: ROLE
                  created_at: '2026-11-24T20:15:02+00:00'
                  updated_at: '2026-11-24T20:15:02+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Contacts ]
      operationId: updateContact
      summary: Change a contact
      description: |
        Changes any subset of the contact's fields, its roles, and the member it belongs to. A
        field that is left out keeps its value; a field sent as `null` is cleared - except
        `name`, which the web rules require. `UpdateContact` completes the request with the
        contact's current values and runs the result through the rules `POST` uses, so the
        change is validated as the web edit form validates it; only the fields actually sent
        are written.

        - **`roles` is only touched when it is sent.** The web edit form always posts the
          complete form and detaches every active group missing from `roles[]`. Sent, `roles`
          is the complete set; `[]` or `null` removes every group the API can give.
        - **Groups the API cannot give are never taken away** - inactive ones, or of a type
          that is not configured - and may be sent back as they are, so a `GET` can be PATCHed
          back unchanged.
        - **`custid` moves the contact** to another member, as the web edit form does for
          superusers. The contact takes its groups along and needs room in each limited one at
          the new member, otherwise `422` under `custid`; the web checks only groups an edit
          adds.
        - `creator` is kept; the editor is recorded in `lastupdatedby`. The web overwrites
          `creator` with the editor's username on every edit.
        - A change of roles alone moves `updated_at` and sets `lastupdatedby`; the web leaves the
          contact row alone then. A PATCH which matches what is stored writes nothing.

        The contact and the member it ends up with are locked for the transaction, so that
        group limits hold against concurrent requests through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
            examples:
              phone:
                summary: change the phone number, nothing else - roles included
                value:
                  phone: '+49 69 7654321'
              roles:
                summary: replace the roles
                value:
                  roles: [ 2, 3 ]
              move:
                summary: move the contact to another member
                value:
                  custid: 98
      responses:
        '200':
          description: The contact after the change, and what actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactUpdateResult'
              example:
                contact:
                  id: 42
                  custid: 97
                  name: Erika Mustermann
                  position: Head of Network Operations
                  email: erika@example.net
                  phone: '+49 69 7654321'
                  mobile: '+49 170 1234567'
                  notes: Prefers email.
                  roles:
                    - id: 1
                      name: Billing
                      type: ROLE
                  created_at: '2026-11-24T20:15:02+00:00'
                  updated_at: '2026-11-24T21:40:11+00:00'
                changed: [ phone ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            A group link this request adds was written by a change made in the web UI at the
            same moment - the API serialises its own changes of a contact, the web takes no
            lock. The transaction was rolled back; read the contact again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  Another request changed the roles of this contact at the same time. Nothing was
                  changed. Read the contact again and retry.
        '422':
          description: |
            The completed record failed validation, a role cannot be given (see `POST`), a group
            the contact would join is full, or the contact cannot move because a group it takes
            along is full at the new member. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                nameCleared:
                  summary: the name cannot be cleared
                  value:
                    message: The name field is required.
                    errors:
                      name:
                        - The name field is required.
                moveIntoFullGroup:
                  summary: a moved contact's group is full at the new member
                  value:
                    message: >-
                      Contact group ROLE: Billing has a limited membership and is full (1 of 1
                      for this member). Nothing was changed.
                    errors:
                      custid:
                        - >-
                          Contact group ROLE: Billing has a limited membership and is full (1 of
                          1 for this member). Nothing was changed.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Contacts ]
      operationId: deleteContact
      summary: Delete a contact
      description: |
        Deletes the contact's group links and the contact in one transaction, under the
        contact's row lock. The links have to go first: `contact_to_group` references the
        contact without `ON DELETE CASCADE`. The groups themselves are not touched.

        Not itself idempotent: deleting the same contact twice gives `200` and then `404`.
      responses:
        '200':
          description: The contact was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user:
    get:
      tags: [ Users ]
      operationId: listUsers
      summary: Find portal users
      description: |
        Above all the lookup by email. IXP Manager does not require a unique address, and
        `POST /member/{cust}/user` does not look for an existing account, so before creating a
        user ask whether the person has one already - and if so, link that user to the member
        with `POST /member/{cust}/user/{u}` instead. This is the "check email" step of the web
        UI's create wizard (`UserController::createCheckEmail()`).

        All filters are optional and combined with AND. A filter which is present but empty is
        `422`, not ignored: `?email=` must not answer a duplicate check with a list of everybody.

        Ordered by username. Each user carries all of their member links.
      parameters:
        - name: email
          in: query
          required: false
          description: |
            Exact address, case-insensitive - the web edit stores an address as typed, so the
            same person's may be cased either way. Validated as the web's check-email step
            validates it (`email|max:255`).
          schema:
            type: string
            format: email
            maxLength: 255
          example: noc@example.net
        - name: username
          in: query
          required: false
          description: Exact username.
          schema:
            type: string
            maxLength: 255
          example: examplenet-noc
        - name: q
          in: query
          required: false
          description: |
            Substring of the username, the name or the email. `%` and `_` are matched literally,
            not as wildcards.
          schema:
            type: string
            minLength: 2
            maxLength: 255
          example: mustermann
        - name: member
          in: query
          required: false
          description: Only users linked to this member (`cust.id`). An unknown id finds nobody.
          schema:
            type: integer
            minimum: 1
          example: 97
        - name: privs
          in: query
          required: false
          description: |
            Only users with a link of this privilege. Together with `member` it applies to the
            link to that member: `?member=97&privs=2` is "the custadmins of member 97", not
            "users of member 97 who are custadmin somewhere".
          schema:
            type: integer
            enum: [ 0, 1, 2, 3 ]
          example: 2
        - name: enabled
          in: query
          required: false
          description: '`1` for enabled users, `0` for disabled ones. A legacy `NULL` in `disabled` counts as enabled.'
          schema:
            type: integer
            enum: [ 0, 1 ]
          example: 1
        - name: limit
          in: query
          required: false
          description: Cap the number of users returned.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 50
      responses:
        '200':
          description: The matching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUserList'
              example:
                users:
                  - id: 314
                    username: examplenet-noc
                    name: Erika Mustermann
                    email: noc@example.net
                    authorisedMobile: null
                    enabled: true
                    custid: 97
                    peeringdb_id: null
                    creator: provisioning
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                    links:
                      - id: 1201
                        custid: 97
                        user_id: 314
                        privs: 2
                        created_by:
                          type: api
                          user_id: 1
                        last_login_date: '2026-11-20T08:14:03+01:00'
                        last_login_from: 192.0.2.10
                        last_login_via: Login
                        created_at: '2026-08-01T10:00:00+02:00'
                        updated_at: '2026-11-20T08:14:03+01:00'
                count: 1
                truncated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: A filter is malformed, or present but empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The email field must have a value.
                errors:
                  email:
                    - The email field must have a value.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/{u}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [ Users ]
      operationId: showUser
      summary: Read a portal user, with all of their member links
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/PortalUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Users ]
      operationId: updateUser
      summary: Change a portal user
      description: |
        Mirrors the superuser path of `UserController@update`. Takes any subset of the web edit
        form's fields; a field left out keeps its value, a field sent as `null` is cleared - or
        refused where the web form requires it. `UpdateUser` completes the request with the
        user's current values and validates it with the web rules (`User\Update`) plus
        `enabled`, held to them by `UserRulesParityTest`.

        - A field which is empty today and not sent is not part of the change: its rules are
          dropped, so a legacy user without a `name` can still be disabled.
        - A stored value is validated in full: a username from before the current rule makes
          every PATCH a `422` until the same PATCH sends a valid one - as in the web form.
        - A sent `email` is lowercased, as on creation; one merely carried along is not.
        - Disabling ends the user's remember-me sessions, as the web edit does. API keys and
          app passwords stay; IXP Manager refuses the keys of a disabled user.
        - A PATCH which matches what is stored writes nothing, not even `lastupdatedby`.

        Fields outside the form (`custid`, `creator`, `password`, the web's `disabled`, `privs`)
        are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUserUpdate'
            examples:
              disable:
                summary: disable the user
                value:
                  enabled: false
              rename:
                summary: change the name and the address
                value:
                  name: Erika Musterfrau
                  email: erika@example.net
      responses:
        '200':
          description: The user after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUserUpdateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, nothing written:

            - the user owns the API key making the request, and the change would disable it
              (every key of a disabled user is refused with `401`) or rename it (the API's
              actions are logged and recorded under its username);
            - another request took the username between validation and write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user owns the API key making this request. Disabling it would lock the
                  provisioning API out: ApiAuthenticate refuses every key of a disabled user.
                  Disable it in the web UI, or with another superuser's key.
        '422':
          description: The completed record failed validation. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The username has already been taken.
                errors:
                  username:
                    - The username has already been taken.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Users ]
      operationId: deleteUser
      summary: Delete a portal user, everywhere
      description: |
        Mirrors `UserController@delete`, in one transaction. Removed with the user: their member
        links and the login history of each, API keys, app passwords (their login records
        cascade), remember-me tokens and 2FA enrolment. The log rows the user wrote are copied
        into the application log and removed, as the web does, because `log.user_id` has a
        foreign key without `ON DELETE`.

        The web also deletes app password login records itself, by the wrong column
        (`UserController.php:480`), which can hit another password's record. Not reproduced.

        To end one member's access only, use `DELETE /member/{cust}/user/{u}`. Not idempotent:
        a second call is `404`.
      responses:
        '200':
          description: The user was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user owns the API key making the request; the key would be deleted with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user owns the API key making this request, and the key would be deleted
                  with it. Delete the user in the web UI, or with another superuser's key.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/{u}/welcome-email:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [ Users ]
      operationId: sendWelcomeEmail
      summary: Send the welcome email again
      description: |
        Sends the mail user creation sends (`UserCreated`), in its "resent" wording, with a fresh
        link to set a password - as the web UI's resend button does
        (`UserController::resendWelcomeEmail()`). Welcome links expire after 7 days. Building
        the mail issues a new password reset token, so the link of any earlier welcome email
        stops working.

        Every call mails a third party, so it is limited to **5 sends per user per hour**,
        counting only mails which actually went out. No request body.
      responses:
        '200':
          description: The mail was handed to the mail server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeEmailResult'
              example:
                sent: true
                email: noc@example.net
                remaining: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, nothing sent: the user is disabled (the link would lead to an account which
            cannot log in), or has no email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user is disabled, so the link in the welcome email would lead to an
                  account which cannot log in. Enable the user first.
        '429':
          description: |
            Either the per-user limit of this endpoint - 5 sends per user per hour, with
            `Retry-After` in seconds - or the global rate limit of the API (see
            `TooManyRequests`).
          headers:
            Retry-After:
              description: Seconds until another send is allowed.
              schema:
                type: integer
              example: 2841
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  The welcome email has been sent to this user 5 times within the last hour
                  already. Try again in 2841 seconds.
        '503':
          description: |
            The mail server refused the mail. Nothing was sent - but the token had been issued
            already, so the link of any earlier welcome email no longer works. Retry later; the
            failure does not count against the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /member/{cust}/offboard:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [ Members ]
      operationId: offboardMember
      summary: Take a member off the exchange - tear down its connections and close it
      description: |
        In one transaction:

        - **every connection of the member is torn down**, each exactly as
          `DELETE /connection/{vi}` removes one - the same code (`TearsDownConnections`): the
          physical interfaces through the inherited, fanout-aware `deletePi()`, the VLAN
          interfaces with their configured MACs, the discovered MACs, the sflow receivers and
          the virtual interface. Switch ports, IP addresses and MAC addresses become free; the
          address records stay in their VLAN's pool;
        - **the member is closed**: `dateleave` (given, or today) and `status` 2, Not Connected,
          with `lastupdatedby`, as `PATCH /member/{cust}` writes them;
        - **the member, its portal users and its contacts stay**, as history. Nothing else is
          changed; what stays behind is listed in `warnings`.

        IXP Manager has no such action: the web closes a member by setting the leave date, which
        releases nothing. `PATCH /member/{cust}` plus `DELETE /connection/{vi}` per connection
        reach the same end, but not atomically.

        **The leave date.** `Customer::scopeNotDeleted()` - which decides logins and API keys -
        compares it with the current date and time, so **a leave date of today already counts
        as left**. `Customer::SQL_CUST_CURRENT` - the configuration exports, `is_current` - keeps
        the member current through the leave date itself. A future leave date postpones nothing:
        the connections go now. Not given, the leave date is today - unless the member already
        has one of today or earlier, which is kept, so that a retry on a later day does not move
        it; one in the future is brought forward to today.

        **Idempotent.** A member without connections whose leave date and status already are
        what the request asks for is not written: `200`, nothing removed, `changed` empty.

        **Dry run.** `dry_run: true` performs every step inside the transaction and rolls it all
        back: the answer - including a `409` - is what the real request would give, short of
        `dry_run` and the member's `updated_at`. Nothing is written, logged or uncached.

        Logged when not a dry run and something changed: one line per removed connection, worded
        as `DELETE /connection/{vi}` words it and marked "(offboarding)", and one line for the
        member naming what changed and the `reason`.

        Not done: nothing on switches or route servers (they follow at their next configuration
        pull); no `Layer2Address\Deleted` event per MAC (bulk delete, as
        `DELETE /connection/{vi}`); nothing stops a new connection being ordered for the member
        afterwards.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberOffboardInput'
            examples:
              defaults:
                summary: today, for real
                value: {}
              preview:
                summary: preview an offboarding with a given leave date
                value:
                  dateleave: '2026-11-30'
                  dry_run: true
                  reason: Contract 4711 terminated
      responses:
        '200':
          description: |
            The member was offboarded - or, with `dry_run`, would be, exactly so. Also the answer
            for a member which had nothing left to offboard: `changed` empty, nothing removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOffboardResult'
              example:
                member:
                  id: 2
                  name: HEAnet
                  shortname: heanet
                  abbreviatedName: HEAnet
                  type: 1
                  status: 2
                  autsys: 1213
                  maxprefixes: 1000
                  maxprefixesv6: 200
                  peeringemail: peering@example.com
                  peeringmacro: AS-HEANET
                  peeringmacrov6: null
                  peeringpolicy: open
                  irrdb: 1
                  datejoin: '2014-01-06'
                  dateleave: '2026-11-24'
                  reseller: null
                  isReseller: false
                  corpwww: http://www.example.com/
                  nocphone: null
                  noc24hphone: null
                  nocemail: noc@example.com
                  nochours: '0'
                  nocwww: null
                  MD5Support: UNKNOWN
                  activepeeringmatrix: true
                  peeringdb_oauth: true
                  in_manrs: false
                  in_peeringdb: false
                  is_current: true
                  has_left: true
                  creator: travis
                  lastupdatedby: 1
                  created_at: '2014-01-06T00:00:00+00:00'
                  updated_at: '2026-11-24T21:42:17+00:00'
                changed: [ dateleave, status ]
                removed:
                  connections:
                    - id: 1
                      custid: 2
                      name: Port-Channel
                      trunk: false
                      lag_framing: true
                      channelgroup: 1
                      physical_interfaces:
                        - id: 1
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 3
                          switchport_name: GigabitEthernet3
                          switch: 1
                          switch_name: switch1
                        - id: 2
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 4
                          switchport_name: GigabitEthernet4
                          switch: 1
                          switch_name: switch1
                      vlan_interfaces:
                        - id: 1
                          vlan: 1
                          ipv4enabled: true
                          ipv4address: 10.1.0.10
                          ipv4hostname: a.heanet.ie
                          ipv6enabled: true
                          ipv6address: '2001:db8:1::10'
                          ipv6hostname: a.heanet.ie
                          rsclient: true
                          irrdbfilter: true
                          as112client: true
                          maxbgpprefix: { ipv4: 900, ipv6: null }
                    - id: 2
                      custid: 2
                      name: Port-Channel
                      trunk: true
                      lag_framing: true
                      channelgroup: 2
                      physical_interfaces:
                        - id: 3
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 25
                          switchport_name: GigabitEthernet1
                          switch: 2
                          switch_name: switch2
                      vlan_interfaces:
                        - id: 2
                          vlan: 2
                          ipv4enabled: true
                          ipv4address: 10.2.0.11
                          ipv4hostname: b.heanet.ie
                          ipv6enabled: true
                          ipv6address: '2001:db8:2::11'
                          ipv6hostname: b.heanet.ie
                          rsclient: true
                          irrdbfilter: true
                          as112client: true
                          maxbgpprefix: { ipv4: null, ipv6: 300 }
                  physical_interfaces: 3
                  vlan_interfaces: 2
                  mac_addresses: 0
                  discovered_mac_addresses: 0
                  sflow_receivers: 0
                  ip_addresses:
                    - { id: 10, vlan: 1, protocol: 4, address: 10.1.0.10 }
                    - { id: 16, vlan: 1, protocol: 6, address: '2001:db8:1::10' }
                    - { id: 137, vlan: 2, protocol: 4, address: 10.2.0.11 }
                    - { id: 417, vlan: 2, protocol: 6, address: '2001:db8:2::11' }
                warnings:
                  - 'This member has 6 staged and 6 production route server filter rule(s). They stay: with no route server session left they have no effect, and IXP Manager removes them only with the member itself.'
                  - '1 portal user(s) have no active member besides this one: hecustadmin (id 5). They are neither disabled nor deleted, but from 2026-11-24 on IXP Manager refuses their login ("Your user account is not associated with any active members."), ends a session of theirs at its next request and refuses their API keys. DELETE user/{u} removes a user for good.'
                  - '1 portal user(s) have this member as their default member but belong to another active member as well: hecustuser (id 4). From 2026-11-24 on IXP Manager ends a session of theirs at its next request and makes an active member the default at their next login; until then it refuses their API keys.'
                dry_run: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, and nothing was changed - a dry run answers the same:

            - a connection of the member belongs to a core bundle, which
              `DELETE /connection/{vi}` refuses as well;
            - the member is the default member of the API key's own user and the offboarding
              would deactivate it - a leave date of today or earlier - after which
              `ApiAuthenticate` would refuse the key. Refused exactly as `PATCH /member/{cust}`
              refuses it; a later leave date passes, with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coreBundle:
                  summary: a connection in a core bundle
                  value:
                    message: "Connection(s) 8, 9 of this member belong to a core bundle - the exchange's own backbone, which DELETE connection/{vi} refuses as well. Remove the core bundle in the web interface first. Nothing was changed."
                selfLockout:
                  summary: the API key owner's default member
                  value:
                    message: "Offboarding this member would deactivate the default member of the API key's own user, after which IXP Manager refuses the key. Nothing was changed. Offboard it with a key whose user has another default member."
        '422':
          description: |
            The body failed validation: a `dateleave` which is not a `Y-m-d` calendar date, a
            `dry_run` which is not a boolean, a `reason` which is not a string of at most 255
            characters - or a key this endpoint does not know. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The dateleave does not match the format Y-m-d. (and 1 more error)
                errors:
                  dateleave:
                    - The dateleave does not match the format Y-m-d.
                  dryrun:
                    - "Unknown parameter 'dryrun'. This endpoint accepts: dateleave, dry_run, reason. Nothing was changed."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /member/{cust}/user:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [ Users ]
      operationId: listMemberUsers
      summary: List a member's users
      description: |
        Every user linked to the member, ordered by username, each with its privilege on and
        link to this member - the list to reconcile against. Other members of the same users
        do not appear; `GET /user/{u}` shows those.
      responses:
        '200':
          description: The member's users. Empty when it has none.
          content:
            application/json:
              schema:
                type: object
                required: [ users ]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberUser'
              example:
                users:
                  - id: 314
                    username: examplenet-noc
                    name: Erika Mustermann
                    email: noc@example.net
                    authorisedMobile: null
                    enabled: true
                    custid: 97
                    peeringdb_id: null
                    creator: provisioning
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                    privs: 2
                    link:
                      id: 1201
                      custid: 97
                      user_id: 314
                      privs: 2
                      created_by:
                        type: api
                        user_id: 1
                      last_login_date: '2026-11-20T08:14:03+01:00'
                      last_login_from: 192.0.2.10
                      last_login_via: Login
                      created_at: '2026-08-01T10:00:00+02:00'
                      updated_at: '2026-11-20T08:14:03+01:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Users ]
      operationId: createMemberUser
      summary: Create a portal user for a member
      description: |
        Mirrors `UserController@store`, in one transaction, and then fires `UserCreated`.

        **The password is random and is never returned.** The account is activated by the
        welcome email, which carries a password reset token — firing the event is therefore not
        optional, since without it the user has no way in. The event is fired only after the
        transaction has committed, so a later failure cannot leave a welcome email sent for a
        user which was rolled back.

        The customer comes from the route: `StoreUser::prepareForValidation()` overwrites any
        `custid` in the body with the route's customer, and removes any `id` from the body - a
        form body and a JSON body alike. An `id` would only serve to exempt somebody else's
        username from the uniqueness check, turning a `422` into a database-constraint `500`.

        The API takes **`enabled`** (default `true`); the web form's inverted `disabled` field
        is not reproduced. Superuser privileges (`privs: 3`) are refused unless the member is an
        internal customer (`type: 3`), which the inherited `User\Store::withValidator()` enforces.

        `username` and `email` are lowercased before being stored.

        The response is the member's view of the new user - `MemberUser`, as
        `GET /member/{cust}/user/{u}` returns it. It is a superset of the fields this endpoint
        has always returned (`id`, `name`, `username`, `email`, `custid`, `privs`, `enabled`).

        IXP Manager does not require a unique email address and this endpoint does not look for
        an existing account: ask `GET /user?email=` first, and give a person who already has one
        a further member link (`POST /member/{cust}/user/{u}`) rather than a second user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            example:
              name: Erika Mustermann
              username: examplenet-noc
              email: noc@example.net
              authorisedMobile: '+491701234567'
              privs: 2
              enabled: true
      responses:
        '201':
          description: |
            The user was created and the welcome email dispatched.
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/MemberUser'
              example:
                user:
                  id: 314
                  username: examplenet-noc
                  name: Erika Mustermann
                  email: noc@example.net
