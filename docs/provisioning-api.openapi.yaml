                    export_to_ixf: true
                    peering_matrix: true
                    peering_manager: true
                  - id: 3
                    name: Quarantine LAN
                    number: 901
                    infrastructure: 1
                    private: false
                    config_name: quarantine
                    export_to_ixf: false
                    peering_matrix: false
                    peering_manager: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            A query parameter failed validation - an `infrastructure` id which does not exist,
