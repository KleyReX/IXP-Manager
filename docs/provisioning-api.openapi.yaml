  /vlan/{vlan}/address:
    get:
      tags: [ Reference data ]
      operationId: listVlanAddresses
      summary: List a VLAN's address pool - free or in use, and by whom
      description: |
        Lists the addresses which exist in the VLAN's pool, ordered numerically
        (`INET_ATON` / `INET6_ATON`, so `.10` does not sort before `.9`), each flagged with
        whether a VLAN interface points at it. An address in use names its holder in
        `assigned_to` - member, connection, VLAN interface and hostname, the columns the web
        address list shows - and `assigned_to` is `null` for a free one.

        Addresses are added to a pool ahead of time, in the web UI. This endpoint never creates
        one, and there is deliberately no endpoint which reserves one - a caller which simply
        wants the next free address asks for `"auto"` when creating the connection.

        `network` restricts the listing to one network, given as `address/length` or as a bare
        address (that one address - "who holds it?" in one call):

        - It implies the protocol: the other family is left out of the response, just as
          `protocol` leaves it out. A `protocol` which contradicts it is `422`.
        - It has to start at its first address. `10.0.0.5/24` is refused, and the message names
          `10.0.0.0/24` - the web UI's delete-by-network form insists on the same.
        - Any prefix length is accepted, unlike that form's /24 (IPv6: /120): a filter
          enumerates nothing, it compares the numeric forms, so the notation of a stored IPv6
          address does not matter either.

        `total` counts the whole matching set, after `free` and `network`; `truncated` says
        whether `limit` cut it short. Everything since the first release - `assigned_to`,
        `network`, the VLAN flags in the header - is additive.
      parameters:
        - $ref: '#/components/parameters/VlanId'
        - name: protocol
          in: query
          required: false
          description: |
            Restrict to one address family. Omitted, both `ipv4` and `ipv6` are returned -
            unless `network` names one.
          schema:
            type: integer
            enum: [ 4, 6 ]
          example: 4
        - name: free
          in: query
          required: false
          description: |
            `1` to list only the addresses no VLAN interface points at, `0` (the default) for
            all of them. Laravel's `boolean` rule: the words `true` and `false` are refused in a
            query string (`422`).
          schema:
            type: integer
            enum: [ 0, 1 ]
            default: 0
          example: 1
        - name: limit
          in: query
          required: false
          description: Cap the number of addresses returned **per protocol**.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
          example: 5
        - name: network
          in: query
          required: false
          description: |
            Only the addresses inside this network: `address/length`, or a bare address. Must
            start at its first address.
          schema:
            type: string
            maxLength: 255
          examples:
            ipv4:
              value: 193.189.82.0/26
            ipv6:
              value: '2001:7f8:33::/120'
            single:
              value: 193.189.82.102
      responses:
        '200':
          description: |
            The VLAN and its addresses. `ipv4` is absent when `protocol=6` was requested or
            `network` is an IPv6 network, `ipv6` when `protocol=4` was or `network` is IPv4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlanAddressListing'
              example:
                vlan:
                  id: 1
                  name: Peering LAN
                  number: 900
                  infrastructure: 1
                  private: false
                  config_name: peering
                  export_to_ixf: true
                  peering_matrix: true
                  peering_manager: true
                ipv4:
                  addresses:
                    - id: 341
                      address: 193.189.82.101
                      free: true
                      assigned_to: null
                    - id: 342
                      address: 193.189.82.102
                      free: false
                      assigned_to:
                        custid: 97
                        member_name: Example Networks GmbH
                        connection: 501
                        vlan_interface: 733
                        hostname: example.peering.kleyrex.net
                  total: 2
                  truncated: false
                ipv6:
                  addresses:
                    - id: 902
                      address: '2001:7f8:33::a101:2586:1'
                      free: true
                      assigned_to: null
                  total: 1
                  truncated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            A query parameter failed validation: a `protocol` other than 4 or 6, a `limit`
            outside 1..2000, a `network` which is not one or does not start at its first
            address, or a `network` of the other family than `protocol`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The network does not start at its first address. Did you mean 193.189.82.0/24?
                errors:
                  network:
                    - The network does not start at its first address. Did you mean 193.189.82.0/24?
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /irrdb-source:
    get:
      tags: [ Reference data ]
      operationId: listIrrdbSources
      summary: List the IRRDB sources
      description: |
        A member refers to its IRRDB source by id - `irrdb` in the member payload - while
        PeeringDB names it in its `irr_as_set`, as in `RIPE::AS-EXAMPLE`. This is how a caller
        turns the one into the other. Ordered by host, as the web list is, then by source.
      responses:
        '200':
          description: The IRRDB sources.
          content:
            application/json:
              schema:
                type: object
                required: [ irrdb_sources ]
                properties:
                  irrdb_sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/IrrdbSource'
              example:
                irrdb_sources:
                  - id: 2
                    host: whois.radb.net
                    source: RADB
                    notes: RADB Query from RADB Database
                    member_count: 31
                    created_at: null
                    updated_at: null
                  - id: 1
                    host: whois.radb.net
                    source: RIPE
                    notes: RIPE Query from RIPE Database
                    member_count: 187
                    created_at: null
                    updated_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Reference data ]
      operationId: findOrCreateIrrdbSource
      summary: Find or create an IRRDB source
      description: |
        **A find-or-create, not a plain insert.** When a source with the same `host` and the
        same `source` exists already, it is returned with `200` and `created: false` -
        unchanged; `notes` in the request is not applied to it. Otherwise it is created and
        returned with `201` and `created: true`. A caller can send this whenever it needs a
        source id, without looking first, and retry it freely.

        - The match ignores case - host names are case-insensitive, and so are IRR source names
          to bgpq3/bgpq4 - but is otherwise literal: `RADB,RIPE` and `RIPE,RADB` are different
          sources, since the order of a source list is the order of preference.
        - There is no `protocol`: the column was dropped in 2021
          (`2021_09_17_144421_modernise_irrdb_conf_table`).
        - Neither the web UI nor the schema keeps sources unique. The look-up is a locking read
          in the same transaction as the insert, so two simultaneous requests for the same new
          source do not both create it: under MySQL's default isolation level (REPEATABLE READ)
          the second waits for the first and finds its row. Where duplicates exist already, the
          oldest is returned.

        Validated as the web form `IrrdbConfigController@store` validates - inline in its
        controller, so `StoreIrrdbSource` reproduces the rules and a behavioural test holds it
        to the web form. Two deliberate differences: `notes` is validated (the web form stores
        it unchecked), and a non-string `host` is `422` where the web form fails with a 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IrrdbSourceInput'
            example:
              host: whois.radb.net
              source: ALTDB
              notes: for AS-EXAMPLE
      responses:
        '201':
          description: The source did not exist and has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrdbSourceResult'
              example:
                irrdb_source:
                  id: 14
                  host: whois.radb.net
                  source: ALTDB
                  notes: for AS-EXAMPLE
                  member_count: 0
                  created_at: '2026-11-24T10:00:00+00:00'
                  updated_at: '2026-11-24T10:00:00+00:00'
                created: true
        '200':
          description: |
            A source with this host and source list existed already. It is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrdbSourceResult'
              example:
                irrdb_source:
                  id: 1
                  host: whois.radb.net
                  source: RIPE
                  notes: RIPE Query from RIPE Database
                  member_count: 187
                  created_at: null
                  updated_at: null
                created: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The payload failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The host is not valid.
                errors:
                  host:
                    - The host is not valid.
        '429':
          $ref: '#/components/responses/TooManyRequests'

