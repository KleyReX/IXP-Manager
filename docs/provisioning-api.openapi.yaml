                        duplex: full
                        rate_limit: null
                        autoneg: true
                        switchport: 412
                        switchport_name: xe-0/0/9
                        switch: 13
                        switch_name: vc513
                        connection: 501
                        switchport_type: 1
                        notes: cross-connect ordered
                    vlan_interfaces:
                      - id: 688
                        vlan: 1
                        ipv4enabled: true
                        ipv4address: 193.189.82.101
                        ipv4hostname: examplenet.kleyrex.net
                        ipv6enabled: true
                        ipv6address: '2001:7f8:33::a101:2586:1'
                        ipv6hostname: examplenet.kleyrex.net
                        rsclient: true
                        irrdbfilter: true
                        as112client: false
                        maxbgpprefix:
                          ipv4: 500
                          ipv6: 500
                count: 1
                total: 1
                limit: 50
                offset: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: A filter is malformed or names something which does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected member is invalid.
                errors:
                  member:
                    - The selected member is invalid.
