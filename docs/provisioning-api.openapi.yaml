                        ipv4: 500
                        ipv6: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Connections ]
      operationId: updateConnection
      summary: Change a connection's settings
      description: |
        Changes any subset of `name`, `description`, `mtu`, `trunk`, `channelgroup`,
        `lag_framing` and `fastlacp`. A field that is left out keeps its value; a field sent as
        `null` is cleared. Only the fields sent are written.

        Validated as the web edit form of a virtual interface validates it: `UpdateConnection`
        extends `StoreVirtualInterface`, completes the request with the connection's current
        values and adds `trunk`, `lag_framing` and `fastlacp` - which the web form posts but
        never validates - as a delta, held to the web rules by `InterfaceParityTest`. Then the
        rules `VirtualInterfaceController@update` applies inline, in its order:

        - surrounding double quotes are stripped from `name`, which is how the web form keeps
          trailing whitespace through TrimStrings;
        - a channel group cannot be removed from a connection with more than one physical
          interface (`409`);
        - `setBundleDetails()` - switching LAG framing on assigns a channel group no other
          connection on the switch uses, and the vendor's bundle name when the connection has
          none - then the channel group is validated as unique on the switch (`409`, rolled
          back). A null channel group is not validated: the web's validator throws on one.

        Stricter than the web, each `409`: LAG framing cannot be switched off while the
        connection has more than one physical interface - the switch configuration export
        renders only the first port of a connection without it - and a connection of a core
        bundle is not changed here.

        `custid` and every field not listed above are ignored. The transaction locks the rows
        of the connection's switches and then the connection, so two requests cannot pick the
        same channel group on one switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
            examples:
              lagFraming:
                summary: make a single port a LAG, ready for a second member
                value:
                  lag_framing: true
                  fastlacp: true
              description:
                summary: change the description only
                value:
                  description: Example Networks GmbH primary
              trailingSpace:
                summary: a name with trailing whitespace, quoted as the web form does it
                value:
                  name: '"ae0 "'
      responses:
        '200':
          description: The connection after the change, and the attributes which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionUpdateResult'
              example:
                connection:
                  id: 501
                  custid: 97
                  name: null
                  description: null
                  mtu: null
                  trunk: false
                  lag_framing: true
                  fastlacp: true
                  channelgroup: 4
                  physical_interfaces:
                    - id: 733
                      status: 1
                      speed: 10000
                      duplex: full
                      rate_limit: null
                      autoneg: true
                      switchport: 412
                      switchport_name: xe-0/0/9
                      switch: 13
                      switch_name: vc513
                      connection: 501
                      switchport_type: 1
                      notes: null
                  vlan_interfaces: []
                changed: [ channelgroup, lag_framing, fastlacp ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The connection's state refuses the change. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                channelGroupInUse:
                  summary: another connection on the switch uses the channel group
                  value:
                    message: Channel group 1 is already used by another connection on the same switch. Nothing was changed.
                channelGroupRemoved:
                  summary: removing the channel group of a LAG with several ports
                  value:
                    message: A channel group cannot be removed from a connection with more than one physical interface. Nothing was changed.
                lagFramingOff:
                  summary: switching LAG framing off with several ports
                  value:
                    message: >-
                      LAG framing cannot be switched off while the connection has more than one
                      physical interface: the switch configuration would carry only the first of
                      them. Remove the other physical interfaces first. Nothing was changed.
                coreBundle:
                  summary: a connection of a core bundle
                  value:
                    message: This connection belongs to a core bundle. Change it through the core bundle, which keeps both ends alike.
        '422':
          description: The completed record failed validation. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The mtu must be at least 1.
                errors:
                  mtu:
                    - The mtu must be at least 1.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Connections ]
      operationId: deleteConnection
      summary: Remove a connection
      description: |
        Deletes the virtual interface, its physical interfaces, its VLAN interfaces and their
        layer 2 addresses and MAC addresses, in one transaction. Freed IP addresses return to
        the VLAN's pool; the address records themselves are not deleted. The configured MACs
        (layer 2 addresses) go in bulk, without the `Layer2Address\Deleted` event
        `DELETE /vlan-interface/{vli}` raises for each of them.

        Teardown uses the inherited `deletePi()`, which handles the fanout and reseller cases.
        That method is not idempotent — it dereferences `$pi->switchPort` after having set
        `switchportid` to null — so a physical interface which is already detached is deleted
        directly rather than passed to it.

        Note the endpoint takes a **virtual interface id**, not a customer id, and is not itself
        idempotent: deleting the same connection twice gives `200` and then `404`, because route
        model binding no longer finds it.
      responses:
        '200':
          description: The connection was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The virtual interface belongs to a core bundle. Nothing was deleted — remove the
            core bundle first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This connection belongs to a core bundle. Delete the core bundle first.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /connection/{vi}/physical-interface:
    parameters:
      - $ref: '#/components/parameters/VirtualInterfaceId'
    post:
      tags: [ Connections ]
      operationId: addPhysicalInterface
      summary: Add a physical interface to a connection
      description: |
        Adds a port to an existing connection - in practice a further LAG member. Validated by
        `StorePhysicalInterface`, which extends the web request of the same name with `autoneg`
        as its delta. `status` defaults to connected and `duplex` to full; `speed` is required.

        Refused where the web accepts:

        - the switch port does not exist, belongs to another switch than `switch`, already has a
          physical interface, is on an inactive switch, or is not of type unset or peering -
          `422`, as for `POST /member/{cust}/connection`;
        - the port is on another switch than the connection's other ports - `422`, a LAG cannot
          span switches;
        - the connection already has a port and is not LAG framed - `409`: the switch
          configuration of a connection without LAG framing carries only its first port. Switch
          LAG framing on with `PATCH /connection/{vi}` first;
        - the connection belongs to a core bundle - `409`.

        The LAG settings are worked out after the new port exists, in the same transaction - the
        web does it before. The port's type becomes peering, or reseller if the connection's
        first port is a reseller port. The reseller fanout fields (`fanout`, `switch-fanout`,
        `switch-port-fanout`) are not supported and are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalInterfaceInput'
            example:
              switch: 13
              switchportid: 413
              speed: 10000
      responses:
        '201':
          description: The physical interface was added.
          content:
            application/json:
              schema:
                type: object
                required: [ physical_interface ]
                properties:
                  physical_interface:
                    $ref: '#/components/schemas/PhysicalInterface'
              example:
                physical_interface:
                  id: 734
                  status: 1
                  speed: 10000
                  duplex: full
                  rate_limit: null
                  autoneg: true
                  switchport: 413
                  switchport_name: xe-0/0/10
                  switch: 13
                  switch_name: vc513
                  connection: 501
                  switchport_type: 1
                  notes: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The connection's state refuses another port, or another request took the switch port
            between the check and the insert. Nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notLagFramed:
                  summary: a second port on a connection without LAG framing
                  value:
                    message: >-
                      This connection is not LAG framed, and the switch configuration carries only
                      the first port of a connection without LAG framing. Switch LAG framing on with
                      PATCH connection/501 first. Nothing was created.
                raced:
                  summary: the port was taken by a concurrent request
                  value:
                    message: Another request took switch port xe-0/0/10 while this one was being processed. Nothing was created.
        '422':
          description: |
            Either the payload failed validation (`message` and `errors`), or the switch port
            cannot be used (`message` only). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                speedMissing:
                  summary: no speed - validation
                  value:
                    message: The speed field is required.
                    errors:
                      speed:
                        - The speed field is required.
                otherSwitch:
                  summary: a port on another switch than the LAG's
                  value:
                    message: Switch port xe-0/0/10 is on another switch than the other physical interfaces of this connection. A LAG cannot span switches.
                portTaken:
                  summary: switch port already assigned
                  value:
                    message: Switch port xe-0/0/10 is already assigned to another connection.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /physical-interface/{pi}:
    parameters:
      - $ref: '#/components/parameters/PhysicalInterfaceId'
    get:
      tags: [ Connections ]
      operationId: showPhysicalInterface
      summary: Read a physical interface
      responses:
        '200':
          description: The physical interface.
          content:
            application/json:
              schema:
                type: object
                required: [ physical_interface ]
                properties:
                  physical_interface:
                    $ref: '#/components/schemas/PhysicalInterface'
              example:
                physical_interface:
                  id: 733
                  status: 1
                  speed: 10000
                  duplex: full
                  rate_limit: null
                  autoneg: true
                  switchport: 412
                  switchport_name: xe-0/0/9
                  switch: 13
                  switch_name: vc513
                  connection: 501
                  switchport_type: 1
                  notes: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Connections ]
      operationId: updatePhysicalInterface
      summary: Change a physical interface
      description: |
        Changes any subset of `status`, `speed`, `duplex`, `rate_limit`, `autoneg` and `notes`,
        with the semantics of `PATCH /connection/{vi}`: left out keeps, `null` clears, only the
        fields sent are written. A `rate_limit` of `0` is stored as none, as on the web. A
        physical interface has no description - its free text is `notes`.

        Validated by `UpdatePhysicalInterface` with the web form's rules. The switch, the port
        and the connection are filled in from the record and never changed here, whatever the
        body says - that is `/move`.

        `processFanoutPhysicalInterface()` is never called: the web edit calls it on every save
        and, without a `fanout` field, it deletes the related reseller fanout interface (and the
        reseller's fanout connection, with its VLAN interfaces and MAC addresses, when that was
        its only port). A fanout link survives here, and the fanout port follows a new speed,
        status or duplex, as on the web. Interfaces on fanout ports and in core links are
        refused with `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalInterfaceUpdate'
            examples:
              disable:
                summary: take the port down
                value:
                  status: 2
              rateLimit:
                summary: rate limit the port, and note why
                value:
                  rate_limit: 1000
                  notes: 1G committed on a 10G port
      responses:
        '200':
          description: The physical interface after the change, and the attributes which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalInterfaceUpdateResult'
              example:
                physical_interface:
                  id: 733
                  status: 2
                  speed: 10000
                  duplex: full
                  rate_limit: null
                  autoneg: true
                  switchport: 412
                  switchport_name: xe-0/0/9
                  switch: 13
                  switch_name: vc513
                  connection: 501
                  switchport_type: 1
                  notes: null
                changed: [ status ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The interface is on a fanout port or in a core link. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fanout:
                  summary: an interface on a reseller fanout port
                  value:
                    message: This physical interface is on a reseller fanout port. Change the peering interface it belongs to; the fanout port follows it.
                coreLink:
                  summary: an interface in a core link
                  value:
                    message: This physical interface belongs to a core link. Change it through its core bundle.
        '422':
          description: The completed record failed validation. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected speed is invalid.
                errors:
                  speed:
                    - The selected speed is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Connections ]
      operationId: deletePhysicalInterface
      summary: Remove a physical interface from a connection
      description: |
        Removes one port of a connection - never the last one: a connection without a physical
        interface keeps its addresses but appears in no switch configuration. The web allows it;
        here it is a `409`, and `DELETE /connection/{vi}` removes the whole connection. The count
        is taken with the connection locked, so two requests cannot each remove one of the last
        two.

        The removal is the inherited `deletePi()`, fanout-aware and without the web's `related`
        option: a reseller's fanout interface is unlinked and its port returned to peering, not
        deleted. The connection's LAG settings are saved afterwards - `deletePi()` works them out
        but never saves them. An interface in a core link is refused with `409`, as on the web.

        Not idempotent: removing the same interface twice gives `200`, then `404`.
      responses:
        '200':
          description: The physical interface was removed.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The last physical interface of its connection, or one in a core link. Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                last:
                  summary: the connection's last physical interface
                  value:
                    message: This is the last physical interface of connection 501. Delete the connection instead (DELETE connection/501). Nothing was deleted.
                coreLink:
                  summary: an interface in a core link
                  value:
                    message: This physical interface belongs to a core link. Remove it through its core bundle.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /physical-interface/{pi}/move:
    parameters:
      - $ref: '#/components/parameters/PhysicalInterfaceId'
    post:
      tags: [ Connections ]
      operationId: movePhysicalInterface
      summary: Move a physical interface to another switch port
      description: |
        Moves the interface to the port named by `switch` and `switchportid`, and changes any
        field `PATCH` changes in the same step - moving to a port of another speed is the usual
        reason to move, and doing both at once means no configuration is ever generated for a
        10G setting on a 100G port.

        On the web a move is a side effect of the edit form, which checks nothing about the
        target: a taken port ends in a `500` on the unique index. Here the target passes the
        gate of `POST /member/{cust}/connection` (`422`), a LAG member stays on the switch of the
        LAG's other members (`422`), and the connection's channel group is validated again on the
        new switch, which may already use it (`409`, rolled back). Asking for the port the
        interface is already on moves nothing.

        The new port becomes a peering port, or a reseller port if the old one was. The old port
        keeps its type, as on the web, and is free for the next order. Interfaces on fanout ports
        and in core links are refused with `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalInterfaceMove'
            examples:
              move:
                summary: another port on the same switch
                value:
                  switch: 13
                  switchportid: 414
              upgrade:
                summary: a faster port, and the speed with it
                value:
                  switch: 13
                  switchportid: 420
                  speed: 100000
      responses:
        '200':
          description: |
            The physical interface after the move, and the attributes which actually changed -
            `switchportid` and whatever else changed, or nothing for its own port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalInterfaceUpdateResult'
              example:
                physical_interface:
                  id: 733
                  status: 1
                  speed: 100000
                  duplex: full
                  rate_limit: null
                  autoneg: true
                  switchport: 420
                  switchport_name: et-0/0/20
                  switch: 13
                  switch_name: vc513
                  connection: 501
                  switchport_type: 1
                  notes: null
                changed: [ switchportid, speed ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The channel group is in use on the new switch, the port was taken by a concurrent
            request, or the interface is on a fanout port or in a core link. Nothing was moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                channelGroup:
                  summary: the new switch already uses the connection's channel group
                  value:
                    message: Channel group 2 is already used by another connection on the same switch. Nothing was changed.
                raced:
                  summary: the port was taken by a concurrent request
                  value:
                    message: Another request took switch port et-0/0/20 while this one was being processed. Nothing was moved.
        '422':
          description: |
            Either the payload failed validation (`message` and `errors`), or the target port
            cannot be used (`message` only). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                noTarget:
                  summary: no switch port named - validation
                  value:
                    message: The switch field is required. (and 1 more error)
                    errors:
                      switch:
                        - The switch field is required.
                      switchportid:
                        - The switchportid field is required.
                otherSwitch:
                  summary: a LAG member to another switch
                  value:
                    message: Switch port et-0/0/20 is on another switch than the other physical interfaces of this connection. A LAG cannot span switches.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /connection/{vi}/vlan-interface:
    parameters:
      - $ref: '#/components/parameters/VirtualInterfaceId'
    post:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: createVlanInterface
      summary: Add a VLAN to an existing connection
      description: |
        Creates a VLAN interface on the connection - the member joins one more VLAN on the same
        port. The equivalent of the web UI's "add VLAN interface" form.

        Addresses are handled as by `POST /member/{cust}/connection`, inside one transaction:
        `"auto"` takes the numerically next free address of the VLAN's pool under a row lock, an
        explicit address must already be in the pool and be free, and an enabled family must
        have an address. Fields left out take what that endpoint gives them: the column defaults
        (IRRDB filtering on, the other flags off) and `busyhost` false.

        **Max prefixes are not copied from the member**, although the web form pre-fills them.
        Left out they stay null, and the router configuration falls back to the member's
        `maxprefixes` / `maxprefixesv6` when it is generated - so the limits follow later
        changes to the member instead of being frozen on the interface.

        Stricter than the web: **a connection has one VLAN interface per VLAN.** The `422` names
        the interface which exists, so that a create retried after a timeout can be reconciled.
        A connection which belongs to a core bundle is refused with `409`.

        `warnings` carries what the web UI would have shown without refusing: IRRDB filtering
        on a route server client whose member has no IRRDB source, and a second VLAN on a
        connection without 802.1q framing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VlanInterfaceInput'
            examples:
              secondVlan:
                summary: Dual stack in a second VLAN, automatic addressing
                value:
                  vlanid: 2
                  ipv4enabled: true
                  ipv4address: auto
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret: s3cret-handed-to-the-member
                  ipv6bgpmd5secret: s3cret-handed-to-the-member
                  rsclient: true
                  irrdbfilter: true
              explicitIpv4Only:
                summary: IPv4 only, an explicit address, a frozen prefix limit
                value:
                  vlanid: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4maxbgpprefix: 500
                  ipv6enabled: false
                  rsclient: true
      responses:
        '201':
          description: The VLAN interface was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlanInterfaceCreateResult'
              example:
                vlan_interface:
                  id: 812
                  connection: 501
                  custid: 97
                  vlan: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret_set: true
                  ipv4canping: false
                  ipv4monitorrcbgp: false
                  ipv4maxbgpprefix: null
                  ipv6enabled: true
                  ipv6address: '2001:db8:2::4d'
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv6bgpmd5secret_set: true
                  ipv6canping: false
                  ipv6monitorrcbgp: false
                  ipv6maxbgpprefix: null
                  mcastenabled: false
                  irrdbfilter: true
                  rsclient: true
                  rsmorespecifics: false
                  as112client: false
                  busyhost: false
                  maxbgpprefix:
                    ipv4: null
                    ipv6: null
                  mac_addresses: []
                  created_at: '2026-11-24T20:03:34+00:00'
                  updated_at: '2026-11-24T20:03:34+00:00'
                warnings:
                  - 802.1q framing is not set on connection 501 but it has more than one VLAN interface. Without it the port can carry one VLAN only.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The connection belongs to a core bundle; or another request won a race - it added a
            VLAN interface in the same VLAN to this connection, or took an address of this one,
            between the checks and the insert. **Nothing was created.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coreBundle:
                  summary: a core bundle's virtual interface
                  value:
                    message: Connection 9 belongs to a core bundle. VLAN interfaces belong on member connections.
                addressRaced:
                  summary: an address taken by a concurrent request
                  value:
                    message: >-
                      Another request took an address of this VLAN interface while it was being
                      created. Nothing was created. Check the addresses and retry.
        '422':
          description: |
            Either the payload failed validation (`message` **and** `errors`) - the web form's
            rules, an address which is neither an address nor `"auto"`, a second VLAN interface
            in the same VLAN - or an address could not be used (`message` only, raised by
            `IpAllocator`). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                sameVlanTwice:
                  summary: the connection is in this VLAN already - validation
                  value:
                    message: >-
                      Connection 501 already has a VLAN interface in VLAN Peering LAN 1 (id 1):
                      VLAN interface 688. A connection has one VLAN interface per VLAN.
                    errors:
                      vlanid:
                        - >-
                          Connection 501 already has a VLAN interface in VLAN Peering LAN 1 (id 1):
                          VLAN interface 688. A connection has one VLAN interface per VLAN.
                enabledFamilyWithoutAddress:
                  summary: ipv6enabled with no address - validation
                  value:
                    message: The ipv6address field is required.
                    errors:
                      ipv6address:
                        - The ipv6address field is required.
                addressNotInPool:
                  summary: explicit address which is not in this VLAN's pool
                  value:
                    message: IPv4 address 203.0.113.251 is not in the address pool of VLAN Peering LAN 2 (id 2).
                poolExhausted:
                  summary: '"auto" with nothing left to allocate'
                  value:
                    message: No free IPv4 address left in VLAN Quarantine LAN 1 (id 3).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /vlan-interface/{vli}:
    parameters:
      - $ref: '#/components/parameters/VlanInterfaceId'
    get:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: showVlanInterface
      summary: Read a VLAN interface
      description: |
        Every field the web edit form can change, under the names `PATCH` takes, plus the
        configured MACs. **MD5 secrets are never returned** - `ipv4bgpmd5secret_set` /
        `ipv6bgpmd5secret_set` say whether one is configured.

        A strict superset of the VLAN interfaces `GET /member/{cust}/connection` embeds: every
        field there is here, with the same name and type.
      responses:
        '200':
          description: The VLAN interface.
          content:
            application/json:
              schema:
                type: object
                required: [ vlan_interface ]
                properties:
                  vlan_interface:
                    $ref: '#/components/schemas/VlanInterface'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: updateVlanInterface
      summary: Change a VLAN interface
      description: |
        Changes any subset of the edit form's fields. A field left out keeps its value; a field
        sent as `null` is cleared (the flags are true or false - null is refused).

        The change is validated as the web edit form validates it: `UpdateVlanInterface`
        completes the request with the interface's current values and runs the whole record
        through the rules, so that `{"ipv4address": null}` on an interface with IPv4 enabled,
        or `{"ipv6enabled": true}` without an address, is refused - an enabled family keeps an
        address. Only the fields sent are written, onto the interface as it stands under a row
        lock.

        Addresses: the current address, or `"auto"` for a family which has one, changes nothing;
        another explicit address renumbers and returns the old one to the pool. Disabling a
        family keeps its address reserved, as the web does - send the address as `null` as well
        to release it.

        Moving to another VLAN (`vlanid`): every family holding an address must be sent a new
        one, `"auto"` or `null`; the interface's MACs must not be configured on another
        interface of the new VLAN; the connection must not have an interface there already.
        `virtualinterfaceid` cannot change and is ignored, like every field outside the form.

        `changed` lists the fields whose value changed, under the request's names
        (`ipv4address`, not the column `ipv4addressid`), never with a value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VlanInterfaceUpdate'
            examples:
              rotateSecrets:
                summary: rotate the MD5 secrets
                value:
                  ipv4bgpmd5secret: n3w-s3cret
                  ipv6bgpmd5secret: n3w-s3cret
              enableIpv6:
                summary: enable IPv6 with an automatic address
                value:
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet.kleyrex.net
              leaveQuarantine:
                summary: move from the quarantine VLAN to the peering LAN
                value:
                  vlanid: 1
                  ipv4address: auto
                  ipv6address: auto
      responses:
        '200':
          description: The VLAN interface after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlanInterfaceUpdateResult'
              example:
                vlan_interface:
                  id: 812
                  connection: 501
                  custid: 97
                  vlan: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret_set: true
                  ipv4canping: false
                  ipv4monitorrcbgp: false
                  ipv4maxbgpprefix: null
                  ipv6enabled: true
                  ipv6address: '2001:db8:2::4d'
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv6bgpmd5secret_set: true
                  ipv6canping: false
                  ipv6monitorrcbgp: false
                  ipv6maxbgpprefix: null
                  mcastenabled: false
                  irrdbfilter: true
                  rsclient: true
                  rsmorespecifics: false
                  as112client: false
                  busyhost: false
                  maxbgpprefix:
                    ipv4: null
                    ipv6: null
                  mac_addresses: []
                  created_at: '2026-11-24T20:03:34+00:00'
                  updated_at: '2026-11-24T21:15:02+00:00'
                changed: [ ipv4bgpmd5secret, ipv6bgpmd5secret ]
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request changed the interface, or took an address this change asked for,
            between the validation and the write, so that the change would now break an
            invariant (an enabled family without an address, an address outside the interface's
            VLAN, a duplicate MAC in the VLAN, two interfaces of the connection in one VLAN).
            **Nothing was changed.** Read the interface again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  VLAN interface 812 was changed by another request while this one was being
                  processed, and this change would now leave it with IPv6 enabled but no address,
                  or with an address outside its VLAN. Nothing was changed. Read the interface
                  again and retry.
        '422':
          description: |
            The completed record failed validation (`message` and `errors`), or an address could
            not be used (`message` only). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                clearingAnEnabledFamilysAddress:
                  summary: '{"ipv4address": null} with IPv4 enabled - validation'
                  value:
                    message: The ipv4address field is required.
                    errors:
                      ipv4address:
                        - The ipv4address field is required.
                moveWithoutNewAddress:
                  summary: vlanid changed, the old VLAN's address left in place - validation
                  value:
                    message: >-
                      VLAN interface 812 moves to VLAN Peering LAN 1 (id 1), and its IPv4 address
                      10.3.0.5 belongs to VLAN Quarantine LAN 1 (id 3). Send ipv4address as well:
                      an address of the new VLAN, "auto", or null.
                    errors:
                      ipv4address:
                        - >-
                          VLAN interface 812 moves to VLAN Peering LAN 1 (id 1), and its IPv4
                          address 10.3.0.5 belongs to VLAN Quarantine LAN 1 (id 3). Send
                          ipv4address as well: an address of the new VLAN, "auto", or null.
                addressTaken:
                  summary: an explicit address of another interface
                  value:
                    message: IPv4 address 10.2.0.12 is already assigned to another VLAN interface.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: deleteVlanInterface
      summary: Remove a VLAN interface
      description: |
        Removes the interface and the MACs configured for it, in one transaction; its addresses
        return to the VLAN's pool (the address records stay). Every MAC removed raises the
        `Layer2Address\Deleted` event once the deletion has committed, as `DELETE /mac/{l2a}`
        does - the web's own delete removes them in bulk without one.

        **Not the last VLAN interface of a connection**: that is `409`, because a connection
        without one is a port in no VLAN which the switch configuration silently drops. Remove
        the whole connection with `DELETE /connection/{vi}` instead.

        Deleting twice gives `200`, then `404`.
      responses:
        '200':
          description: The VLAN interface was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The interface is the connection's only one. Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  VLAN interface 688 is the only VLAN interface of connection 501. A connection
                  needs at least one; to take the member off this port altogether, delete the
                  connection (DELETE connection/501).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /vlan-interface/{vli}/mac:
    parameters:
      - $ref: '#/components/parameters/VlanInterfaceId'
    get:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: listVlanInterfaceMacs
      summary: List the configured MAC addresses of a VLAN interface
      responses:
        '200':
          description: The configured MACs, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacAddressList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ VLAN interfaces and MAC addresses ]
      operationId: addVlanInterfaceMac
      summary: Add a configured MAC address to a VLAN interface
      description: |
        The checks of the web controller (`Api\V4\Layer2AddressController::store()`), as
        validation rules - `MacAddressRulesParityTest` holds the two to the same verdicts:

        - any usual notation is accepted - case, colons, dashes, dots - and the MAC is stored
          as twelve lowercase hex digits;
        - the MAC must not be configured on any VLAN interface of the same VLAN, this one
          included. The same MAC in another VLAN is accepted.

        Raises `Layer2Address\Added` once the MAC has committed, which sends the change
        notification e-mail when `ixp_fe.layer2-addresses.email_on_superuser_change` is set.
        The customer limits on the number of MACs apply to members editing their own, not to
        superusers, and so not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacAddressInput'
            example:
              mac: '00:1A:2B:3C:4D:5E'
      responses:
        '201':
          description: The MAC was added.
          content:
            application/json:
              schema:
                type: object
                required: [ mac_address ]
                properties:
                  mac_address:
                    $ref: '#/components/schemas/MacAddress'
              example:
                mac_address:
                  id: 4711
                  mac: '001a2b3c4d5e'
                  mac_colon: '00:1a:2b:3c:4d:5e'
                  vlan_interface: 812
                  connection: 501
                  vlan: 2
                  custid: 97
                  member_name: Example Networks GmbH
                  created_at: '2026-11-24T20:03:34+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request added the same MAC to the VLAN, or deleted the VLAN interface,
            between the validation and the insert. Nothing was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  Another request added this MAC address while this one was being processed.
                  MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2 (id 2),
                  on VLAN interface 790. A MAC address is unique within a VLAN.
        '422':
          description: |
            Not a MAC address, or configured in this VLAN already - the message names the VLAN
            interface which has it, so that a caller whose earlier attempt timed out can tell its
            own MAC from somebody else's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                malformed:
                  summary: not twelve hex digits
                  value:
                    message: 'The mac must be a MAC address: 12 hexadecimal digits, with or without separators.'
                    errors:
                      mac:
                        - 'The mac must be a MAC address: 12 hexadecimal digits, with or without separators.'
                taken:
                  summary: configured on an interface of the same VLAN
                  value:
                    message: >-
                      MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2
                      (id 2), on VLAN interface 790. A MAC address is unique within a VLAN.
                    errors:
                      mac:
                        - >-
                          MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2
                          (id 2), on VLAN interface 790. A MAC address is unique within a VLAN.
        '429':
          $ref: '#/components/responses/TooManyRequests'

