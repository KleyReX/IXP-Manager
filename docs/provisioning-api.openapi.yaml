  /onboarding:
    post:
      tags: [ Onboarding ]
      operationId: onboard
      summary: Create a member, an optional user and an optional connection in one transaction
      description: |
        The three dedicated endpoints - `POST /member`, `POST /member/{cust}/user` and
        `POST /member/{cust}/connection` - can be called in sequence, but that sequence is not
        atomic: a caller whose second request fails is left with a half-provisioned member and
        no clean way back. Here either the whole order lands or none of it does.

        It does not orchestrate anything beyond the database. Rolling configuration out to
        switches, regenerating route server configuration and updating reverse DNS remain the
        caller's business; this endpoint only makes the IXP Manager side of an order indivisible.

        ## Sections

        The three sections are **nested rather than flattened**, because `name` means something
        different for a member, a user and a virtual interface. Each section is validated with
        exactly the rules of its own endpoint, re-keyed under its prefix — so a rule added
        upstream reaches this endpoint too without anybody remembering to copy it. Validation
        errors are therefore keyed `member.shortname`, `user.privs`, `connection.ipv4address`
        and so on.

        `member` is required. `user` and `connection` are optional. `custid` is dropped from the
        user and connection rule sets: it comes from the member this very request is creating.
        A `cust` or `id` key in any section is removed before validation, as the dedicated
        endpoints remove it - the requests whose rules are reused here never run their own
        `prepareForValidation()`.

        Two checks which live in `withValidator()` hooks rather than rules are restated here,
        evaluated against the member being created rather than one already in the database —
        without them an order could create a full IXP Manager administrator attached to an
        arbitrary member, and the welcome email would hand over the password-reset link:

        - superuser privileges (`user.privs: 3`) require `member.type: 3` (internal);
        - `member.isResold` requires an existing `member.reseller`.

        ## Idempotency

        `reference` is the caller's own order identifier and makes retries safe:

        - First call with a new reference: `201`, `created: true`, plus the ids created.
        - Any later call with the same reference: **`200`**, `created: false`, the member the
          first call produced, and `user` and `connection` when the first call created them and
          they still exist. A caller which timed out never saw the first response; the replay
          is the quickest way to learn those ids (`GET /member/{cust}/user` and
          `GET /member/{cust}/connection` list them too). References recorded by earlier
          versions of this API carry the member only.
        - The payload of a repeat is **not** compared with the original: a reference always
          answers with what its first call created, whatever the repeat asks for.

        The check runs twice. `ShortCircuitKnownReference` middleware answers before validation
        even runs, because by the time a caller retries, the `shortname` it asks for exists and
        validation would otherwise reject the retry with "that name is taken" — technically true
        and useless in practice. The controller keeps its own check for the window between two
        simultaneous retries, where both pass the middleware before either commits.

        **Without a reference, a retry creates a second member.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingInput'
            examples:
              fullOrder:
                summary: Member, user and connection in one order
                value:
                  reference: ORD-2026-04711
                  member:
                    name: Example Networks GmbH
                    shortname: examplenet
                    abbreviatedName: EXAMPLE
                    type: 1
                    status: 1
                    datejoin: '2026-08-01'
                    autsys: 12586
                    maxprefixes: 500
                    maxprefixesv6: 500
                    peeringemail: peering@example.net
                    peeringmacro: AS-EXAMPLE
                    peeringpolicy: open
                    nocemail: noc@example.net
                  user:
                    name: Erika Mustermann
                    username: examplenet-noc
                    email: noc@example.net
                    privs: 2
                    enabled: true
                  connection:
                    vlanid: 1
                    switch: 13
                    switchportid: 412
                    speed: 10000
                    ipv4enabled: true
                    ipv4address: auto
                    ipv4hostname: examplenet.kleyrex.net
                    ipv6enabled: true
                    ipv6address: '2001:7f8:33::a101:2586:1'
                    ipv6hostname: examplenet.kleyrex.net
                    rsclient: true
                    irrdbfilter: true
              memberOnly:
                summary: Member only, no reference — a retry would create a second member
                value:
                  member:
                    name: Example Association e.V.
                    shortname: exampleassoc
                    abbreviatedName: EXAMPLEA
                    type: 2
                    status: 1
                    datejoin: '2026-08-01'
      responses:
        '200':
          description: |
            This reference has been seen before. Nothing was created; what the original call
            produced is returned — the member always, `user` and `connection` when the original
            call created them and they still exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingReplay'
              example:
                created: false
                reference: ORD-2026-04711
                member:
                  id: 97
                  shortname: examplenet
                user:
                  id: 314
                  username: examplenet-noc
                connection:
                  id: 501
        '201':
          description: |
            The order landed in full. `user` and `connection` are `null` when those sections
            were not supplied. The welcome email is dispatched after the commit, never inside it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
              examples:
                full:
                  summary: Member, user and connection created
                  value:
                    created: true
                    reference: ORD-2026-04711
                    member:
                      id: 97
                      shortname: examplenet
                    user:
                      id: 314
                      username: examplenet-noc
                    connection:
                      id: 501
                memberOnly:
                  summary: Member only, no reference
                  value:
                    created: true
                    reference: null
                    member:
                      id: 98
                      shortname: exampleassoc
                    user: null
                    connection: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            A unique index was violated and the reference could not be resolved to an existing
            member. **Nothing was created** — the whole transaction was rolled back.

            Which index was hit matters, and the two cases need opposite responses. Telling a
            caller whose switch port was taken to "use a new reference" would be actively
            harmful: it would burn an order number and retry onto the same occupied port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                referenceReused:
                  summary: the reference is taken but its member was deleted afterwards
                  value:
                    message: >-
                      This reference has been used before and the member it created no longer
                      exists. Use a new reference.
                resourceRaced:
                  summary: another order took the switch port first — retry with the same reference
                  value:
                    message: >-
                      Another request took one of the resources for this order while it was
                      being processed - most likely the switch port. Nothing was created. Choose
                      a different port and retry with the same reference.
        '422':
          description: |
            Validation failed, or the connection section could not be provisioned. **The whole
            order was rolled back** — a connection failure leaves no member behind.

            Validation errors are keyed by section (`member.shortname`, `user.privs`,
            `connection.ipv4address`). Errors raised by `IpAllocator` or by the switch port gate
            carry `message` only.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                nestedValidation:
                  summary: the member section failed validation
                  value:
                    message: The member.shortname field is required.
                    errors:
                      member.shortname:
                        - The member.shortname field is required.
                missingMember:
                  summary: no member section at all
                  value:
                    message: The member field is required.
                    errors:
                      member:
                        - The member field is required.
                superuserOnNonInternal:
                  summary: superuser privileges on a member which is not internal
                  value:
                    message: >-
                      You are not allowed to set this user as a super user: the member being
                      created is not an internal customer.
                    errors:
                      user.privs:
                        - >-
                          You are not allowed to set this user as a super user: the member being
                          created is not an internal customer.
                resoldWithoutReseller:
                  summary: isResold with no reseller named
                  value:
                    message: Please choose a reseller.
                    errors:
                      member.reseller:
                        - Please choose a reseller.
                portTaken:
                  summary: the switch port could not be used — order rolled back
                  value:
                    message: Switch port xe-0/0/9 is already assigned to another connection.
                poolExhausted:
                  summary: '"auto" with nothing left to allocate — order rolled back'
                  value:
                    message: No free IPv4 address left in VLAN Peering LAN (id 1).
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:

  securitySchemes:

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-IXP-Manager-API-Key
      description: |
        A **superuser** API key, 56 characters, in the form
        `ixpm_{identifier}_{secret}{checksum}` — for example
        `ixpm_ident1234567_sec876543210...`.

        The key's owner must have `AUTH_SUPERUSER` (privilege `3`); anything less is `403`.
        A browser session is not accepted in place of a key, nor alongside one: `RequireApiKey`
        rejects a request without the header, and discards the cookies of a request with it,
        before `ApiAuthenticate` ever sees a session. The key alone decides who is calling.

        **Keys expire after at most 12 months** (`ixp_fe.api_keys.max_expires_duration`), so an
        unattended service fails with `401 API key expired` exactly once a year unless the key
        is rotated.

        The `allowed_ips` column of the key **is** enforced on these endpoints by
        `RestrictSourceAddress`, for modern and legacy keys alike — this is the only place in
        IXP Manager that reads it. A source address outside it, or outside the global
        `ixp_api.provisioning.allowed_ips` list, gets `403`.

  parameters:

    CustomerId:
      name: cust
      in: path
      required: true
      description: |
        The member's `cust.id`. Digits only; resolved by route model binding, so an unknown id
        is `404`.
      schema:
        type: integer
        minimum: 1
      example: 97

    VirtualInterfaceId:
      name: vi
      in: path
      required: true
      description: |
        The connection's `virtualinterface.id` — **not** a customer id. Digits only; resolved by
        route model binding, so an unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 501

    VlanId:
      name: vlan
      in: path
      required: true
      description: |
        The VLAN's `vlan.id` — the database id, not the 802.1Q tag. At KleyReX the peering VLAN
        carries tag 900 and has id 1. Digits only; resolved by route model binding, so an unknown
        id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 1

    ContactId:
      name: contact
      in: path
      required: true
      description: |
        The contact's `contact.id`. Digits only; resolved by route model binding, so an unknown
        id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 42

    UserId:
      name: u
      in: path
      required: true
      description: |
        The user's `user.id`. Digits only; resolved by route model binding, so an unknown id is
        `404` - and under `/member/{cust}/user/{u}` so is a user which exists but is not linked
        to the member, except for `POST`, which creates that link. Named `u` because the
        inherited web rules read the user as `$this->u`; a body or query key `u` is removed
        before validation so that it cannot stand in for it.
      schema:
        type: integer
        minimum: 1
      example: 314

    PhysicalInterfaceId:
      name: pi
      in: path
      required: true
      description: |
        The `physicalinterface.id`, as listed in a connection's `physical_interfaces`. Digits
        only; resolved by route model binding, so an unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 733

    VlanInterfaceId:
      name: vli
      in: path
      required: true
      description: |
        The VLAN interface's `vlaninterface.id` - `vlan_interfaces[].id` of a connection. Digits
        only; resolved by route model binding, so an unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 812

    MacAddressId:
      name: l2a
      in: path
      required: true
      description: |
        The configured MAC's `l2address.id` - `mac_address.id`. Digits only; resolved by route
        model binding, so an unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 4711

    IrrdbSourceId:
      name: irrdbconfig
      in: path
      required: true
      description: |
        The source's `irrdbconfig.id` - the value of a member's `irrdb`. Digits only; resolved
        by route model binding, so an unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 1

    FacilityId:
      name: location
      in: path
      required: true
      description: |
        The facility's `location.id`. Digits only; resolved by route model binding, so an
        unknown id is `404`.
      schema:
        type: integer
        minimum: 1
      example: 2

    RackId:
      name: cabinet
      in: path
      required: true
      description: |
        The rack's `cabinet.id`. Digits only; resolved by route model binding, so an unknown id
        is `404`.
      schema:
        type: integer
        minimum: 1
      example: 3

  responses:

    Unauthorized:
      description: |
        Authentication failed. Two shapes are possible:

        - **JSON**, from `RequireApiKey`, when the `X-IXP-Manager-API-Key` header is absent.
        - **Plain text**, from `ApiAuthenticate` / `ApiKeyAggregator::authenticate()`, for a key
          which is malformed (`Malformed API key structure`), fails its checksum
          (`Invalid API key checksum`), does not match a stored key (`Invalid credentials`),
          has expired (`API key expired`), whose user is disabled (`User is disabled`), or whose
          customer is disabled.

        Note that an **expired key** is the failure mode an unattended service will actually
        meet: keys are capped at 12 months.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: >-
              These endpoints require an API key in the X-IXP-Manager-API-Key header. A browser
              session is not accepted here.
        text/html:
          schema:
            type: string
            examples:
              - API key expired
              - Invalid credentials
              - Malformed API key structure
              - Unauthorized.

    Forbidden:
      description: |
        The request authenticated but is not permitted. Two shapes:

        - **Plain text `Insufficient permissions`**, from `assert.privilege:3`, when the key's
          user is not a superuser.
        - **JSON**, from `RestrictSourceAddress`, when the source address is covered by neither
          the global allow-list nor the allow-list of the key presented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This source address is not permitted to use the provisioning API.
        text/html:
          schema:
            type: string
            examples:
              - Insufficient permissions

    NotFound:
      description: |
        No such record. Raised by route model binding when an id in the path names no row:

        | parameter | model |
        | --- | --- |
        | `cust` | `IXP\Models\Customer` (a member) |
        | `contact` | `IXP\Models\Contact` |
        | `u` | `IXP\Models\User` |
        | `vi` | `IXP\Models\VirtualInterface` (a connection) |
        | `pi` | `IXP\Models\PhysicalInterface` |
        | `vli` | `IXP\Models\VlanInterface` |
        | `l2a` | `IXP\Models\Layer2Address` (a configured MAC address) |
        | `vlan` | `IXP\Models\Vlan` |
        | `irrdbconfig` | `IXP\Models\IrrdbConfig` (an IRRDB source) |
        | `location` | `IXP\Models\Location` (a facility) |
        | `cabinet` | `IXP\Models\Cabinet` (a rack) |

        Under `/member/{cust}/user/{u}` it is also the answer for a user which exists but is not
        linked to the member (`POST`, which creates the link, excepted).

        Every id in a path is digits only (`[0-9]+`): anything else - `member/2abc` - matches no
        route and is a `404` without a lookup, rather than reaching the record MySQL would cast it
        to. And `404` is what every path in this document returns when the provisioning API has
        not been enabled, since the routes are then never registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unknownId:
              summary: no row with this id
              value:
                message: No query results for model [IXP\Models\Customer] 99999
            notAnId:
              summary: an id which is not digits - no route matches
              value:
                message: The route admin/api/v4/provisioning/member/2abc could not be found.
            notLinked:
              summary: a user which is not linked to the member in the path
              value:
                message: This user is not linked to this customer.

    TooManyRequests:
      description: |
        The rate limit was exceeded. It counts per user — the owner of the key, so several keys
        of one user share it — and defaults to 60 requests a minute
        (`ixp_api.provisioning.rate_limit`); setting it to `0` removes the throttle middleware
        from the stack entirely.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
          example: 42
        X-RateLimit-Limit:
          description: Requests permitted per minute.
          schema:
            type: integer
          example: 60
        X-RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
          example: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  schemas:

    Error:
      type: object
      title: Error
      description: |
        The shape of every error the provisioning code itself produces: a single human-readable
        `message` and nothing else. Errors raised by the Laravel validator add `errors` — see
        `ValidationError`.
      required: [ message ]
      properties:
        message:
          type: string
          description: A human-readable explanation. Not a stable identifier — do not match on it.
      examples:
        - message: This connection belongs to a core bundle. Delete the core bundle first.

    ValidationError:
      type: object
      title: ValidationError
      description: |
        A Laravel validation failure. `errors` is keyed by field name, each value an array of
        messages for that field. For the onboarding endpoint the keys are section-qualified —
        `member.shortname`, `user.privs`, `connection.ipv4address`.
      required: [ message, errors ]
      properties:
        message:
          type: string
          description: The first validation message, repeated for convenience.
        errors:
          type: object
          description: Field name to the list of messages for that field.
          additionalProperties:
            type: array
            items:
              type: string
      examples:
        - message: The shortname has already been taken.
          errors:
            shortname:
              - The shortname has already been taken.

    Member:
      type: object
      title: Member
      description: |
        A member as this API reports it - the explicit field list of
        `IXP\Support\Provisioning\Presenters\MemberPresenter`, not the model's `toArray()`.
        Every member endpoint returns it: create, read, change and list. Every field
        `PATCH /member/{cust}` can change is included, so that a change can be read back.

        `is_current` and `has_left` are computed and disagree for a member whose leave date is
        today or in the future: it has left in the sense of `has_left` and is still current.
      required:
        - id
        - name
        - shortname
        - abbreviatedName
        - type
        - status
        - autsys
        - maxprefixes
        - maxprefixesv6
        - peeringemail
        - peeringmacro
        - peeringmacrov6
        - peeringpolicy
        - irrdb
        - datejoin
        - dateleave
        - reseller
        - isReseller
        - corpwww
        - nocphone
        - noc24hphone
        - nocemail
        - nochours
        - nocwww
        - MD5Support
        - activepeeringmatrix
        - peeringdb_oauth
        - in_manrs
        - in_peeringdb
        - is_current
        - has_left
        - creator
        - lastupdatedby
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        shortname:
          type: string
        abbreviatedName:
          type: [ string, 'null' ]
        type:
          type: integer
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
          enum: [ 1, 2, 3, 4 ]
        status:
          type: integer
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
          enum: [ 1, 2, 3 ]
        autsys:
          type: [ integer, 'null' ]
        maxprefixes:
          type: [ integer, 'null' ]
        maxprefixesv6:
          type: [ integer, 'null' ]
        peeringemail:
          type: [ string, 'null' ]
        peeringmacro:
          type: [ string, 'null' ]
        peeringmacrov6:
          type: [ string, 'null' ]
        peeringpolicy:
          type: [ string, 'null' ]
          enum: [ open, selective, mandatory, closed, null ]
        irrdb:
          type: [ integer, 'null' ]
          description: '`irrdbconfig.id`.'
        datejoin:
          type: [ string, 'null' ]
          format: date
          description: Normalised to `Y-m-d`.
        dateleave:
          type: [ string, 'null' ]
          format: date
          description: Normalised to `Y-m-d`. Note the column is `dateleave`, not `dateleft`.
        reseller:
          type: [ integer, 'null' ]
          description: '`cust.id` of the reseller, or null when the member is not resold.'
        isReseller:
          type: boolean
        corpwww:
          type: [ string, 'null' ]
        nocphone:
          type: [ string, 'null' ]
        noc24hphone:
          type: [ string, 'null' ]
        nocemail:
          type: [ string, 'null' ]
        nochours:
          type: [ string, 'null' ]
          enum: [ 24x7, 8x5, 8x7, 12x5, 12x7, null ]
        nocwww:
          type: [ string, 'null' ]
        MD5Support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
        activepeeringmatrix:
          type: boolean
        peeringdb_oauth:
          type: boolean
          description: Whether the member's users may log in with their PeeringDB account.
        in_manrs:
          type: boolean
          description: |
            Listed in MANRS, as the daily `ixp-manager:update-in-manrs` job last found.
            Read-only.
        in_peeringdb:
          type: boolean
          description: |
            Has a PeeringDB record, as the daily `ixp-manager:update-in-peeringdb` job last
            found. Read-only.
        is_current:
          type: boolean
          description: |
            `Customer::SQL_CUST_CURRENT`, the definition the switch, route server, IRRDB and
            IX-F exports use: joined on or before today, and the leave date, if any, not yet
            passed - **true through the leave date itself**. Evaluated by MySQL with
            `CURRENT_DATE()`, as the exports evaluate it. False without a join date.
        has_left:
          type: boolean
          description: |
            `Customer::hasLeft()`: true as soon as any leave date is set, a future one
            included. PeeringDB OAuth logins, for one, are refused on that basis.
        creator:
          type: [ string, 'null' ]
          description: |
            Who created the member. The column is a string: the creating user's id for members
            created through the web UI or this API, a username on older rows.
        lastupdatedby:
          type: [ integer, 'null' ]
          description: |
            User id of the last change through the web edit form or `PATCH /member/{cust}`;
            null when there was none.
        created_at:
          type: [ string, 'null' ]
          format: date-time
          description: When the member was created - ISO 8601.
        updated_at:
          type: [ string, 'null' ]
          format: date-time
          description: |
            When the member was last changed through Eloquent - ISO 8601. Writes which bypass
            Eloquent, such as the bulk reset of the MANRS and PeeringDB jobs, do not touch it.

    MemberList:
      type: object
      title: MemberList
      required: [ members, total ]
      properties:
        members:
          type: array
          description: The page of matching members, ordered by `id`.
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          description: How many members match in all - not just this page.

    MemberInput:
      type: object
      title: MemberInput
      description: |
        The body of `POST /member`, and the `member` section of `POST /onboarding`.

        Validated by `StoreCustomer`, which is `IXP\Http\Requests\Customer\Store` plus a delta
        of `dateleave`, `MD5Support`, `isReseller`, `isResold`, `activepeeringmatrix` and
        `peeringdb_oauth`.

        **When `type` is `2` (Associate) only the common fields below are validated at all** -
        `autsys` through `reseller` have no rules in that case and are passed straight to
        `Customer::create()`, where only fillable columns survive.

        Unknown fields are dropped: the controller passes `$r->validated()`, never `$r->all()`.
        A `cust` or `id` key is removed before validation - the inherited rules read the member
        being edited as `$this->cust`, which such a key would otherwise replace.
      required: [ name, type, shortname, datejoin, status, abbreviatedName ]
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Also written verbatim to the `CompanyRegisteredDetail.registeredName` created
            alongside the member.
        type:
          type: integer
          enum: [ 1, 2, 3, 4 ]
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
        shortname:
          type: string
          maxLength: 30
          pattern: '[a-z0-9]+'
          description: Must be unique across `cust.shortname`; a clash is `422`.
        status:
          type: integer
          enum: [ 1, 2, 3 ]
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
        abbreviatedName:
          type: string
          maxLength: 30
        datejoin:
          type: string
          format: date
          description: Any string Laravel's `date` rule accepts; `Y-m-d` is the sane choice.
        dateleave:
          type: [ string, 'null' ]
          format: date
          description: |
            The column the schema actually has. Validated by the API delta and persisted.
        dateleft:
          type: [ string, 'null' ]
          format: date
          description: |
            **Accepted but ignored.** The upstream web rules use this spelling, which matches no
            column and is not fillable. Use `dateleave`. Documented only so a caller which has
            been sending it knows it has never had an effect.
          deprecated: true
        corpwww:
          type: [ string, 'null' ]
          format: uri
          maxLength: 255
        MD5Support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
          description: The correctly-cased column name. Validated by the API delta and persisted.
        md5support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
          description: |
            **Accepted but ignored** - the upstream spelling, which is not a fillable column.
            Use `MD5Support`.
          deprecated: true
        autsys:
          type: integer
          minimum: 1
          description: 'AS number. Not validated when `type` is `2`.'
        maxprefixes:
          type: [ integer, 'null' ]
          minimum: 0
        maxprefixesv6:
          type: [ integer, 'null' ]
          minimum: 0
        peeringemail:
          type: string
          format: email
        peeringmacro:
          type: [ string, 'null' ]
          maxLength: 255
          pattern: '^(AS-[A-Z0-9]+(?:-[A-Z0-9]+)*|AS[1-9]\d*(?::AS-[A-Z0-9]+(?:-[A-Z0-9]+)*)?)$'
          description: 'Case-insensitive, for example `AS-EXAMPLE` or `AS12586:AS-CUSTOMERS`.'
        peeringmacrov6:
          type: [ string, 'null' ]
          maxLength: 255
          pattern: '^(AS-[A-Z0-9]+(?:-[A-Z0-9]+)*|AS[1-9]\d*(?::AS-[A-Z0-9]+(?:-[A-Z0-9]+)*)?)$'
        peeringpolicy:
          type: string
          enum: [ open, selective, mandatory, closed ]
        irrdb:
          type: [ integer, 'null' ]
          description: '`irrdbconfig.id`. Must exist.'
        nocphone:
          type: [ string, 'null' ]
          maxLength: 255
        noc24hphone:
          type: [ string, 'null' ]
          maxLength: 255
        nocemail:
          type: string
          format: email
          maxLength: 255
        nochours:
          type: [ string, 'null' ]
          enum: [ 24x7, 8x5, 8x7, 12x5, 12x7, null ]
        nocwww:
          type: [ string, 'null' ]
          format: uri
          maxLength: 255
        reseller:
          type: [ integer, 'null' ]
          description: '`cust.id` of the reseller. Must exist. Only written when `isResold` is true.'
        isResold:
          type: boolean
          description: |
            Not a column. When true, `reseller` is written to the member and must name an
            existing customer, else `422`. When false or absent, `reseller` is forced to null.
        isReseller:
          type: boolean
          description: Whether this member is itself a reseller.
        activepeeringmatrix:
          type: boolean
        peeringdb_oauth:
          type: boolean
          description: |
            Whether the member's users may log in with their PeeringDB account. Left out on
            creation, the database default applies, which is `true` - as on the web create
            form, where the box comes ticked.

    MemberUpdate:
      type: object
      title: MemberUpdate
      description: |
        The body of `PATCH /member/{cust}`: any subset of `MemberInput`'s fields. Nothing is
        required. A field left out keeps its value; a field sent as `null` is cleared. The
        definitions are `MemberInput`'s - see there for each rule.
      properties:
        name:
          $ref: '#/components/schemas/MemberInput/properties/name'
        type:
          $ref: '#/components/schemas/MemberInput/properties/type'
        shortname:
          $ref: '#/components/schemas/MemberInput/properties/shortname'
        abbreviatedName:
          $ref: '#/components/schemas/MemberInput/properties/abbreviatedName'
        corpwww:
          $ref: '#/components/schemas/MemberInput/properties/corpwww'
        datejoin:
          $ref: '#/components/schemas/MemberInput/properties/datejoin'
        dateleave:
          $ref: '#/components/schemas/MemberInput/properties/dateleave'
        status:
          $ref: '#/components/schemas/MemberInput/properties/status'
        MD5Support:
          $ref: '#/components/schemas/MemberInput/properties/MD5Support'
        autsys:
          $ref: '#/components/schemas/MemberInput/properties/autsys'
        maxprefixes:
          $ref: '#/components/schemas/MemberInput/properties/maxprefixes'
        maxprefixesv6:
          $ref: '#/components/schemas/MemberInput/properties/maxprefixesv6'
        peeringemail:
          $ref: '#/components/schemas/MemberInput/properties/peeringemail'
        peeringmacro:
          $ref: '#/components/schemas/MemberInput/properties/peeringmacro'
        peeringmacrov6:
          $ref: '#/components/schemas/MemberInput/properties/peeringmacrov6'
        peeringpolicy:
          $ref: '#/components/schemas/MemberInput/properties/peeringpolicy'
        irrdb:
          $ref: '#/components/schemas/MemberInput/properties/irrdb'
        activepeeringmatrix:
          $ref: '#/components/schemas/MemberInput/properties/activepeeringmatrix'
        nocphone:
          $ref: '#/components/schemas/MemberInput/properties/nocphone'
        noc24hphone:
          $ref: '#/components/schemas/MemberInput/properties/noc24hphone'
        nocemail:
          $ref: '#/components/schemas/MemberInput/properties/nocemail'
        nochours:
          $ref: '#/components/schemas/MemberInput/properties/nochours'
        nocwww:
          $ref: '#/components/schemas/MemberInput/properties/nocwww'
        isReseller:
          $ref: '#/components/schemas/MemberInput/properties/isReseller'
        isResold:
          $ref: '#/components/schemas/MemberInput/properties/isResold'
        reseller:
          $ref: '#/components/schemas/MemberInput/properties/reseller'
        peeringdb_oauth:
          $ref: '#/components/schemas/MemberInput/properties/peeringdb_oauth'

    MemberUpdateResult:
      type: object
      title: MemberUpdateResult
      required: [ member, changed ]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        changed:
          type: array
          items:
            type: string
          description: |
            The attributes which actually changed, under their column names - empty when the
            PATCH matched what was stored. `updated_at` and `lastupdatedby` are not listed.

    BillingRegistration:
      type: object
      title: BillingRegistration
      description: |
        A member's registered company and billing details - the explicit field lists of
        `IXP\Support\Provisioning\Presenters\BillingRegistrationPresenter`. Each part uses the
        names `PATCH /member/{cust}/billing-registration` takes.
      required: [ member_id, billing_managed_by_reseller, registration, billing ]
      properties:
        member_id:
          type: integer
          description: '`cust.id`.'
        billing_managed_by_reseller:
          type: boolean
          description: |
            Reseller mode is on and the member is resold: its billing is its reseller's
            business, and a PATCH which would change a billing field is refused with `409`.
        registration:
          oneOf:
            - $ref: '#/components/schemas/RegistrationDetails'
            - type: 'null'
          description: Null when the member has no registration record.
        billing:
          oneOf:
            - $ref: '#/components/schemas/BillingDetails'
            - type: 'null'
          description: Null when the member has no billing record.

    RegistrationDetails:
      type: object
      title: RegistrationDetails
      description: The member's `CompanyRegisteredDetail` record.
      required: [ registeredName, companyNumber, jurisdiction, address1, address2, address3,
                  townCity, postcode, country, notes, created_at, updated_at ]
      properties:
        registeredName:
          type: [ string, 'null' ]
          description: '`POST /member` sets it to the member''s name.'
        companyNumber:
          type: [ string, 'null' ]
        jurisdiction:
          type: [ string, 'null' ]
        address1:
          type: [ string, 'null' ]
        address2:
          type: [ string, 'null' ]
        address3:
          type: [ string, 'null' ]
        townCity:
          type: [ string, 'null' ]
        postcode:
          type: [ string, 'null' ]
        country:
          type: [ string, 'null' ]
          description: |
            ISO 3166 alpha-2 code. A row written by other means may hold anything; a PATCH
            which does not send this field neither validates nor clears such a value.
        notes:
          type: [ string, 'null' ]
          description: The registration record's notes - not the billing notes.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    BillingDetails:
      type: object
      title: BillingDetails
      description: The member's `CompanyBillingDetail` record.
      required: [ billingContactName, billingFrequency, billingAddress1, billingAddress2,
                  billingAddress3, billingTownCity, billingPostcode, billingCountry,
                  billingEmail, billingTelephone, purchaseOrderRequired, purchaseOrderNumber,
                  invoiceMethod, invoiceEmail, vatRate, vatNumber, billingNotes, created_at,
                  updated_at ]
      properties:
        billingContactName:
          type: [ string, 'null' ]
        billingFrequency:
          type: [ string, 'null' ]
          enum: [ MONTHLY, 2MONTHLY, QUARTERLY, HALFYEARLY, ANNUALLY, NOBILLING, null ]
        billingAddress1:
          type: [ string, 'null' ]
        billingAddress2:
          type: [ string, 'null' ]
        billingAddress3:
          type: [ string, 'null' ]
        billingTownCity:
          type: [ string, 'null' ]
        billingPostcode:
          type: [ string, 'null' ]
        billingCountry:
          type: [ string, 'null' ]
          description: |
            ISO 3166 alpha-2 code. A row written by other means may hold anything; a PATCH
            which does not send this field neither validates nor clears such a value.
        billingEmail:
          type: [ string, 'null' ]
        billingTelephone:
          type: [ string, 'null' ]
        purchaseOrderRequired:
          type: boolean
        purchaseOrderNumber:
          type: [ string, 'null' ]
        invoiceMethod:
          type: [ string, 'null' ]
          enum: [ EMAIL, POST, null ]
        invoiceEmail:
          type: [ string, 'null' ]
        vatRate:
          type: [ string, 'null' ]
          description: A string column, as the web form treats it.
        vatNumber:
          type: [ string, 'null' ]
        billingNotes:
          type: [ string, 'null' ]
          description: The billing record's `notes` column, under the web form's name.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    BillingRegistrationUpdate:
      type: object
      title: BillingRegistrationUpdate
      description: |
        The body of `PATCH /member/{cust}/billing-registration`: any subset of the web form's
        fields, flat. Nothing is required. A field left out keeps its value; a field sent as
        `null` is cleared (`purchaseOrderRequired` excepted - the column is NOT NULL). Fields
        not listed here are ignored.
      properties:
        registeredName:
          type: [ string, 'null' ]
          maxLength: 255
        companyNumber:
          type: [ string, 'null' ]
          maxLength: 255
        jurisdiction:
          type: [ string, 'null' ]
          maxLength: 255
        address1:
          type: [ string, 'null' ]
          maxLength: 255
        address2:
          type: [ string, 'null' ]
          maxLength: 255
        address3:
          type: [ string, 'null' ]
          maxLength: 255
        townCity:
          type: [ string, 'null' ]
          maxLength: 255
        postcode:
          type: [ string, 'null' ]
          maxLength: 255
        country:
          type: [ string, 'null' ]
          maxLength: 255
          description: ISO 3166 alpha-2 code, for example `DE`.
        notes:
          type: [ string, 'null' ]
          description: The registration record's notes.
        billingContactName:
          type: [ string, 'null' ]
          maxLength: 255
        billingFrequency:
          type: [ string, 'null' ]
          enum: [ MONTHLY, 2MONTHLY, QUARTERLY, HALFYEARLY, ANNUALLY, NOBILLING, null ]
        billingAddress1:
          type: [ string, 'null' ]
          maxLength: 255
        billingAddress2:
          type: [ string, 'null' ]
          maxLength: 255
        billingAddress3:
          type: [ string, 'null' ]
          maxLength: 255
        billingTownCity:
          type: [ string, 'null' ]
          maxLength: 255
        billingPostcode:
          type: [ string, 'null' ]
          maxLength: 255
        billingCountry:
          type: [ string, 'null' ]
          maxLength: 255
          description: ISO 3166 alpha-2 code, for example `DE`.
        billingEmail:
          type: [ string, 'null' ]
          format: email
          maxLength: 255
        billingTelephone:
          type: [ string, 'null' ]
          maxLength: 255
        purchaseOrderRequired:
          type: boolean
          description: |
            The API delta: the web form posts it, no web rule validates it. `true`, `false`,
            `1`, `0`, `"1"` or `"0"`; stored as 0/1.
        purchaseOrderNumber:
          type: [ string, 'null' ]
          maxLength: 50
        invoiceMethod:
          type: [ string, 'null' ]
          enum: [ EMAIL, POST, null ]
        invoiceEmail:
          type: [ string, 'null' ]
          maxLength: 255
          description: Not validated as an e-mail address - the web rule is a plain string.
        vatRate:
          type: [ string, 'null' ]
          maxLength: 255
        vatNumber:
          type: [ string, 'null' ]
          maxLength: 255
        billingNotes:
          type: [ string, 'null' ]
          description: The billing record's notes.

    BillingRegistrationUpdateResult:
      type: object
      title: BillingRegistrationUpdateResult
      required: [ billing_registration, changed ]
      properties:
        billing_registration:
          $ref: '#/components/schemas/BillingRegistration'
        changed:
          type: array
          items:
            type: string
          description: |
            The fields which actually changed, under the request's names - `billingNotes` for
            the billing record's notes - registration fields first. Empty when the PATCH matched
            what was stored. Timestamps are not listed.

    Contact:
      type: object
      title: Contact
      description: |
        A contact as this API reports it - the explicit field list of
        `ContactPresenter::toArray()`, not the model's `toArray()`. `creator` and
        `lastupdatedby` are bookkeeping and left out, as they are for members.

        `notes` is internal: the web UI shows it to superusers only, never to the member's own
        users. A calling system with a member portal should keep it that way.
      required: [ id, custid, name, position, email, phone, mobile, notes, roles, created_at, updated_at ]
      properties:
        id:
          type: integer
        custid:
          type: [ integer, 'null' ]
          description: The member (`cust.id`) the contact belongs to.
        name:
          type: string
        position:
          type: [ string, 'null' ]
        email:
          type: [ string, 'null' ]
        phone:
          type: [ string, 'null' ]
        mobile:
          type: [ string, 'null' ]
        notes:
          type: [ string, 'null' ]
        roles:
          type: array
          description: |
            Every contact group of the contact, of whatever type, ordered by name. The ids can
            be sent back unchanged as `roles` in a PATCH.
          items:
            $ref: '#/components/schemas/ContactRole'
        created_at:
          type: [ string, 'null' ]
          format: date-time
          description: ISO 8601. Null for contacts created before IXP Manager recorded it.
        updated_at:
          type: [ string, 'null' ]
          format: date-time
          description: |
            ISO 8601. Moves with every change made through this API, a change of roles alone
            included; changes of roles made in the web UI do not move it.

    ContactRole:
      type: object
      title: ContactRole
      description: A contact group as a contact's `roles` list shows it - `ContactGroupPresenter::summary()`.
      required: [ id, name, type ]
      properties:
        id:
          type: integer
          description: '`contact_group.id`.'
        name:
          type: string
        type:
          type: string
          description: The group type, a key of `contact_group.types` such as `ROLE`.

    ContactGroup:
      type: object
      title: ContactGroup
      description: A contact group as `GET /contact-group` lists it - `ContactGroupPresenter::toArray()`.
      required: [ id, name, description, type, active, limited_to, created_at, updated_at ]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Unique across all contact groups, for example `Billing`.
        description:
          type: string
        type:
          type: string
          description: A key of `contact_group.types` in `config/contact_group.php`, such as `ROLE`.
        active:
          type: boolean
          description: Only active groups can be given to a contact.
        limited_to:
          type: integer
          minimum: 0
          description: |
            The most contacts of one member the group may hold; `0` means unlimited. Checked
            before a contact is written.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    ContactGroupList:
      type: object
      title: ContactGroupList
      required: [ enabled, contact_groups ]
      properties:
        enabled:
          type: boolean
          description: |
            Whether contacts can be given contact groups at all: `config/contact_group.php`
            exists and defines the `ROLE` type - the switch the web contact pages use. When
            false, `contact_groups` is empty and any role sent with a contact is `422`.
        contact_groups:
          type: array
          items:
            $ref: '#/components/schemas/ContactGroup'

    ContactInput:
      type: object
      title: ContactInput
      description: |
        The body of `POST /member/{cust}/contact`.

        Validated by `StoreContact`: the rules of the web's inline
        `ContactController::checkForm()` for a superuser, reproduced, plus `roles`.
        `ContactParityTest` holds the copy to the original. Unknown fields are dropped.
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 255
        position:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            The web rule accepts up to 255 characters, but the `contact.position` column is
            `varchar(50)` and the database connection runs with strict mode off: on v7.4
            anything beyond 50 characters is **silently cut to 50**. Send at most 50.
        email:
          type: [ string, 'null' ]
          format: email
          description: |
            Validated without a length limit, as on the web; the column is `varchar(255)` and
            cuts anything longer.
        phone:
          type: [ string, 'null' ]
          maxLength: 50
        mobile:
          type: [ string, 'null' ]
          maxLength: 50
        notes:
          type: [ string, 'null' ]
          maxLength: 255
          description: Internal notes; see `Contact`.
        roles:
          type: [ array, 'null' ]
          uniqueItems: true
          description: |
            The contact's contact groups, as ids from `GET /contact-group` - the ROLE type and
            any other configured type alike, as the web form posts them in `roles[]`. Each must
            name an active group of a configured type with room for another contact of the
            member. Duplicates are `422`. Left out or `null`, the contact has no groups.
          items:
            type: integer
        custid:
          type: integer
          description: '**Ignored** at `POST`: the member comes from the route.'

    ContactUpdate:
      type: object
      title: ContactUpdate
      description: |
        The body of `PATCH /contact/{contact}`: any subset of `ContactInput`'s fields, plus
        `custid`. Nothing is required. A field left out keeps its value; a field sent as `null`
        is cleared, except `name`. The definitions are `ContactInput`'s.
      properties:
        name:
          $ref: '#/components/schemas/ContactInput/properties/name'
        position:
          $ref: '#/components/schemas/ContactInput/properties/position'
        email:
          $ref: '#/components/schemas/ContactInput/properties/email'
        phone:
          $ref: '#/components/schemas/ContactInput/properties/phone'
        mobile:
          $ref: '#/components/schemas/ContactInput/properties/mobile'
        notes:
          $ref: '#/components/schemas/ContactInput/properties/notes'
        roles:
          type: [ array, 'null' ]
          uniqueItems: true
          description: |
            The complete set of the contact's groups; only touched when sent. `[]` or `null`
            removes every group the API can give. Groups it cannot give - inactive, or of a type
            not configured - are kept, and may be included unchanged. A group added must be
            active, of a configured type, and have room for another contact of the member.
          items:
            type: integer
        custid:
          type: integer
          description: |
            Moves the contact to this member. Must exist (`422` otherwise), and every limited
            group the contact takes along must have room there (`422` under `custid` otherwise).

    ContactUpdateResult:
      type: object
      title: ContactUpdateResult
      required: [ contact, changed ]
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
        changed:
          type: array
          items:
            type: string
          description: |
            The columns which actually changed, in table order, and `roles` when the contact's
            groups changed - empty when the PATCH matched what was stored. `updated_at` and
            `lastupdatedby` are not listed.

    PortalUser:
      type: object
      title: PortalUser
      description: |
        A portal user as the person - `UserPresenter::toArray()`: who they are, and every member
        they can act for (`links`). An explicit field list: never the password hash, a
        remember-me token or anything about 2FA, and a column added to the schema does not
        appear on its own.

        There is deliberately no `privs` here: a user has one privilege per member, found in
        `links`.
      required:
        - id
        - username
        - name
        - email
        - authorisedMobile
        - enabled
        - custid
        - peeringdb_id
        - creator
        - created_at
        - updated_at
        - links
      properties:
        id:
          type: integer
          description: '`user.id` - the `{u}` of the user endpoints.'
        username:
          type: [ string, 'null' ]
        name:
          type: [ string, 'null' ]
          description: Legacy users often have none.
        email:
          type: [ string, 'null' ]
        authorisedMobile:
          type: [ string, 'null' ]
        enabled:
          type: boolean
          description: The inverse of the `disabled` column. A legacy `NULL` there counts as enabled, as at login.
        custid:
          type: [ integer, 'null' ]
          description: |
            The default member: the one the user acts for after logging in, and the link IXP
            Manager reads their privilege from.
        peeringdb_id:
          type: [ integer, 'null' ]
          description: Set when the account was created or linked by a PeeringDB login.
        creator:
          type: [ string, 'null' ]
          description: Username of whoever created the user - the key owner's for users created through this API.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
        links:
          type: array
          description: One per member the user can act for, oldest first.
          items:
            $ref: '#/components/schemas/MemberLink'

    MemberLink:
      type: object
      title: MemberLink
      description: |
        A link between a user and a member (`customer_to_users`) - `CustomerToUserPresenter::toArray()`.
        It is what gives the user access to the member, and with which privilege.
      required:
        - id
        - custid
        - user_id
        - privs
        - created_by
        - last_login_date
        - last_login_from
        - last_login_via
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: '`customer_to_users.id`.'
        custid:
          type: integer
          description: The member - `customer_id` in the database, `custid` everywhere in this API.
        user_id:
          type: integer
        privs:
          type: integer
          description: |
            `1` CUSTUSER, `2` CUSTADMIN, `3` SUPERUSER. Links made outside this API may also hold
            `0` (PUBLIC), which the web accepts and this API does not.
          enum: [ 0, 1, 2, 3 ]
        created_by:
          type: [ object, 'null' ]
          description: |
            Who made the link, from `extra_attributes.created_by`: `{type: api, user_id}` (the key
            owner) for links made through this API, `{type: user, user_id}` for the web UI (which
            records the linked user, not the actor), `{type: PeeringDB}` for PeeringDB logins,
            `{type: migration-script}` for links older than the table.
          properties:
            type:
              type: string
            user_id:
              type: integer
        last_login_date:
          type: [ string, 'null' ]
          format: date-time
          description: The user's last login to this member.
        last_login_from:
          type: [ string, 'null' ]
          description: Address of that login.
        last_login_via:
          type: [ string, 'null' ]
          description: |
            How: `Login`, `RememberMe` or `SwitchCustomer` (the user switched to this member while
            logged in). `null` on links older than the column.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
          description: Also moves on every login, which writes `last_login_*`.

    MemberUser:
      type: object
      title: MemberUser
      description: |
        A portal user as one member's user - `UserPresenter::forMember()`: the person fields of
        `PortalUser`, plus the privilege on and the link to *that* member. Other members do not
        appear. Every endpoint under `/member/{cust}/user` answers with it, `POST` included -
        a superset of the `id`, `name`, `username`, `email`, `custid`, `privs` and `enabled`
        that endpoint answered with before.
      required:
        - id
        - username
        - name
        - email
        - authorisedMobile
        - enabled
        - custid
        - peeringdb_id
        - creator
        - created_at
        - updated_at
        - privs
        - link
      properties:
        id:
          $ref: '#/components/schemas/PortalUser/properties/id'
        username:
          $ref: '#/components/schemas/PortalUser/properties/username'
        name:
          $ref: '#/components/schemas/PortalUser/properties/name'
        email:
          $ref: '#/components/schemas/PortalUser/properties/email'
        authorisedMobile:
          $ref: '#/components/schemas/PortalUser/properties/authorisedMobile'
        enabled:
          $ref: '#/components/schemas/PortalUser/properties/enabled'
        custid:
          $ref: '#/components/schemas/PortalUser/properties/custid'
        peeringdb_id:
          $ref: '#/components/schemas/PortalUser/properties/peeringdb_id'
        creator:
          $ref: '#/components/schemas/PortalUser/properties/creator'
        created_at:
          $ref: '#/components/schemas/PortalUser/properties/created_at'
        updated_at:
          $ref: '#/components/schemas/PortalUser/properties/updated_at'
        privs:
          type: integer
          enum: [ 0, 1, 2, 3 ]
          description: |
            The privilege on this member - the same as `link.privs`, at the top level because
            that is where `POST /member/{cust}/user` has always put it.
        link:
          $ref: '#/components/schemas/MemberLink'

    PortalUserList:
      type: object
      title: PortalUserList
      required: [ users, count, truncated ]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/PortalUser'
        count:
          type: integer
          description: The number of users in `users`.
        truncated:
          type: boolean
          description: True when more users matched than `limit` allowed. Narrow the filter; there are no pages.

    MemberOffboardInput:
      type: object
      title: MemberOffboardInput
      description: |
        The body of `POST /member/{cust}/offboard`, validated by `OffboardMember`. Every field is
        optional, and any other key is refused with `422` - a misspelt `dry_run` must not turn a
        preview into the real request.
      additionalProperties: false
      properties:
        dateleave:
          type: [ string, 'null' ]
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            The leave date, `Y-m-d`, a real calendar date (`date_format:Y-m-d`). Past, future and
            before `datejoin` are all accepted. Absent or null: today - unless the member already
            has a leave date of today or earlier, which is then kept. Today counts as left for
            logins and API keys at once.
          example: '2026-11-30'
        dry_run:
          type: [ boolean, 'null' ]
          default: false
          description: |
            `true`: answer what the request would do, and do nothing. `1`/`0` and the strings
            `"true"`/`"false"` (also `"yes"`/`"no"`, `"on"`/`"off"`) are accepted too; anything
            else is a `422`, never read as false.
          example: true
        reason:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Why. Written to the log line of the offboarding and stored nowhere else; control
            characters, line breaks included, become spaces.
          example: Contract 4711 terminated

    MemberOffboardResult:
      type: object
      title: MemberOffboardResult
      description: |
        What an offboarding did - or, with `dry_run`, would do: identical either way, short of
        `dry_run` and `member.updated_at`.
      required: [ member, changed, removed, warnings, dry_run ]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        changed:
          type: array
          items:
            type: string
            enum: [ dateleave, status ]
          description: |
            The member attributes which changed, in column order, as `PATCH /member/{cust}`
            reports them - empty when the leave date and the status already were what the
            request asks for. `updated_at` and `lastupdatedby` are not listed.
        removed:
          $ref: '#/components/schemas/MemberOffboardRemoved'
        warnings:
          type: array
          items:
            type: string
          description: |
            What the offboarding leaves behind, and what IXP Manager then does about it, one
            sentence or two each - for a person to read, not a stable identifier to match on. In
            this order, each only when it applies: reseller fanout links handled by the teardown;
            patch panel ports still allocated to the member (one each, naming the switch port it
            is patched to and whether this offboarding released it); colocated equipment;
            console server connections; the member's own route server filters; other members'
            route server filters naming it as peer; resold members which have not left (for a
            reseller); portal users with no active member besides this one - IXP Manager refuses
            their login from the leave date on; portal users with another active member whose
            default member this is - moved to an active member at their next login, their API
            keys refused until then; the member being the API key owner's default member with a
            leave date ahead;
            a Suspended member made Not Connected - active again - until a leave date ahead.
        dry_run:
          type: boolean
          description: Whether this was a preview, which changed nothing.

    MemberOffboardRemoved:
      type: object
      title: MemberOffboardRemoved
      description: |
        What the teardown removed, or would remove. Zeros and empty lists for a member without
        connections.
      required:
        - connections
        - physical_interfaces
        - vlan_interfaces
        - mac_addresses
        - discovered_mac_addresses
        - sflow_receivers
        - ip_addresses
      properties:
        connections:
          type: array
          description: |
            One per connection torn down, in id order, as `GET /member/{cust}/connection`
            presented it just before.
          items:
            $ref: '#/components/schemas/Connection'
        physical_interfaces:
          type: integer
          minimum: 0
        vlan_interfaces:
          type: integer
          minimum: 0
        mac_addresses:
          type: integer
          minimum: 0
          description: Configured MAC addresses (`l2address`) of the VLAN interfaces.
        discovered_mac_addresses:
          type: integer
          minimum: 0
          description: Discovered MAC addresses (`macaddress`) of the connections.
        sflow_receivers:
          type: integer
          minimum: 0
          description: Removed with the virtual interfaces by the foreign key's `ON DELETE CASCADE`.
        ip_addresses:
          type: array
          description: Every address released to its VLAN's pool. The pool entries themselves stay.
          items:
            $ref: '#/components/schemas/ReleasedAddress'

    ReleasedAddress:
      type: object
      title: ReleasedAddress
      description: An address a removed VLAN interface held, now free again.
      required: [ id, vlan, protocol, address ]
      properties:
        id:
          type: integer
          description: '`ipv4address.id` or `ipv6address.id` - the `id` of `GET /vlan/{vlan}/address`.'
          example: 10
        vlan:
          type: integer
          description: '`vlan.id`.'
          example: 1
        protocol:
          type: integer
          enum: [ 4, 6 ]
        address:
          type: string
          example: 10.1.0.10

    UserInput:
      type: object
      title: UserInput
      description: |
        The body of `POST /member/{cust}/user`, and the `user` section of `POST /onboarding`.

        Validated by `StoreUser`, which is `IXP\Http\Requests\User\Store` plus `enabled`.

        `custid` is **not** part of the payload: at the dedicated endpoint
        `prepareForValidation()` overwrites it from the route, and at the onboarding endpoint
        the rule is removed entirely because the member is created by the same request. An `id`
        in the body - and at onboarding a `cust` - is stripped before validation, from a JSON
        body as from a form: the inherited username rule would read it as the user being edited
        and exempt that user's username from the uniqueness check.
      required: [ name, username, email, privs ]
      properties:
        name:
          type: string
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 255
          pattern: '^[a-z0-9\-_\.]{3,255}$'
          description: Must be unique across `user.username`. Lowercased on write.
        email:
          type: string
          format: email
          maxLength: 255
          description: Lowercased on write. The welcome email goes here.
        authorisedMobile:
          type: [ string, 'null' ]
          maxLength: 50
          description: |
            The inherited rule accepts up to 50 characters, but the `user.authorisedMobile`
            column is `varchar(30)` and the database connection runs with strict mode off: on
            v7.4 anything beyond 30 characters is **silently cut to 30**. Send at most 30.
            (Upstream `main` limits the field to 25 characters and a phone number format.)
        privs:
          type: integer
          enum: [ 1, 2, 3 ]
          description: |
            `1` CUSTUSER, `2` CUSTADMIN, `3` SUPERUSER. **`3` is only accepted when the member is
            an internal customer** (`type: 3`); anywhere else it is `422`. That check is the only
            thing standing between an order and a full IXP Manager administrator whose
            password-reset link is mailed out automatically.
        enabled:
          type: boolean
          default: true
          description: |
            Written to the `disabled` column inverted. Defaults to enabled, which is the only
            sensible default when the very next thing that happens is a welcome email. The web
            form's `disabled` field is deliberately not reproduced.

    PortalUserUpdate:
      type: object
      title: PortalUserUpdate
      description: |
        The body of `PATCH /user/{u}`: any subset of the web edit form's fields. Nothing is
        required. A field left out keeps its value; a field sent as `null` is cleared, or refused
        where the web form requires it (`name`, `username`, `email`).
      properties:
        name:
          type: [ string, 'null' ]
          maxLength: 255
          description: Required by the web rule - `null` is refused.
        username:
          $ref: '#/components/schemas/UserInput/properties/username'
        email:
          type: [ string, 'null' ]
          format: email
          maxLength: 255
          description: Lowercased before it is stored. Required by the web rule - `null` is refused.
        authorisedMobile:
          $ref: '#/components/schemas/UserInput/properties/authorisedMobile'
        enabled:
          type: boolean
          description: |
            Written to the `disabled` column inverted - the web form's inverted `disabled` field
            is not reproduced. `false` ends the user's remember-me sessions.

    PortalUserUpdateResult:
      type: object
      title: PortalUserUpdateResult
      required: [ user, changed ]
      properties:
        user:
          $ref: '#/components/schemas/PortalUser'
        changed:
          type: array
          items:
            type: string
            enum: [ name, username, email, authorisedMobile, enabled ]
          description: |
            The fields which actually changed, under this API's names (`enabled`, not the
            `disabled` column) - empty when the PATCH matched what was stored.

    MemberLinkInput:
      type: object
      title: MemberLinkInput
      description: The body of `POST /member/{cust}/user/{u}`. The member and the user come from the route.
      required: [ privs ]
      properties:
        privs:
          type: integer
          enum: [ 1, 2, 3 ]
          description: |
            `1` CUSTUSER, `2` CUSTADMIN, `3` SUPERUSER - the last only on an internal member
            (`type: 3`). The web also accepts `0`; this API does not.

    MemberLinkUpdate:
      type: object
      title: MemberLinkUpdate
      description: The body of `PATCH /member/{cust}/user/{u}`. Without `privs`, the privilege is kept.
      properties:
        privs:
          $ref: '#/components/schemas/MemberLinkInput/properties/privs'

    MemberUserUpdateResult:
      type: object
      title: MemberUserUpdateResult
      required: [ user, changed ]
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        changed:
          type: array
          items:
            type: string
            enum: [ privs ]
          description: '`[privs]`, or empty when the privilege was already the one asked for.'

    WelcomeEmailResult:
      type: object
      title: WelcomeEmailResult
      required: [ sent, email, remaining ]
      properties:
        sent:
          type: boolean
          const: true
        email:
          type: string
          description: The address the mail went to.
        remaining:
          type: integer
          minimum: 0
          description: How many more sends to this user the hourly limit allows.

    Connection:
      type: object
      title: Connection
      description: |
        A member's connection — the virtual interface and everything hanging off it, as
        `POST /member/{cust}/connection` and `GET /member/{cust}/connection` return it, built by
        `ConnectionPresenter::summary()`. The shape is kept byte for byte, since callers parse
        it; `ConnectionDetail` is the fuller one of the connection endpoints.

        The VLAN interfaces carry only the fields this shape has always had. The others -
        `mcastenabled`, `rsmorespecifics`, `busyhost`, `canping`, `monitorrcbgp` and whether a
        BGP MD5 secret is set (`*_set`; the secret itself is never returned) - are reported by
        `GET /vlan-interface/{vli}`.
      required:
        - id
        - custid
        - name
        - trunk
        - lag_framing
        - channelgroup
        - physical_interfaces
        - vlan_interfaces
      properties:
        id:
          type: integer
          description: '`virtualinterface.id` — the id `DELETE /connection/{vi}` takes.'
        custid:
          type: integer
        name:
          type: [ string, 'null' ]
        trunk:
          type: boolean
        lag_framing:
          type: boolean
        channelgroup:
          type: [ integer, 'null' ]
          description: Assigned by `setBundleDetails()` when the interface is LAG framed.
        physical_interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionPhysicalInterface'
        vlan_interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionVlanInterface'

    ConnectionPhysicalInterface:
      type: object
      title: ConnectionPhysicalInterface
      description: One physical interface of a connection, with its switch port resolved.
      required:
        - id
        - status
        - speed
        - duplex
        - rate_limit
        - autoneg
        - switchport
        - switchport_name
        - switch
        - switch_name
      properties:
        id:
          type: integer
        status:
          type: [ integer, 'null' ]
          description: '`1` Connected, `2` Disabled, `3` Not Connected, `4` Awaiting X-Connect, `5` Quarantine.'
        speed:
          type: [ integer, 'null' ]
          description: Mbit/s — one of 10, 100, 1000, 10000, 25000, 40000, 100000, 400000.
        duplex:
          type: [ string, 'null' ]
          enum: [ full, half, null ]
        rate_limit:
          type: [ integer, 'null' ]
          description: Mbit/s, or null for unlimited.
        autoneg:
          type: boolean
        switchport:
          type: [ integer, 'null' ]
          description: '`switchport.id`, or null once the interface has been detached.'
        switchport_name:
          type: [ string, 'null' ]
        switch:
          type: [ integer, 'null' ]
        switch_name:
          type: [ string, 'null' ]

    ConnectionVlanInterface:
      type: object
      title: ConnectionVlanInterface
      description: |
        One VLAN interface of a connection. Addresses are reported as strings resolved from the
        pool; `null` means the family carries no address.
      required:
        - id
        - vlan
        - ipv4enabled
        - ipv4address
        - ipv4hostname
        - ipv6enabled
        - ipv6address
        - ipv6hostname
        - rsclient
        - irrdbfilter
        - as112client
        - maxbgpprefix
      properties:
        id:
          type: integer
        vlan:
          type: integer
          description: '`vlan.id`.'
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
        ipv4hostname:
          type: [ string, 'null' ]
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
        ipv6hostname:
          type: [ string, 'null' ]
        rsclient:
          type: boolean
        irrdbfilter:
          type: boolean
        as112client:
          type: boolean
        maxbgpprefix:
          type: object
          description: |
            Per-family prefix limits for the route server sessions. Both may be null, in which
            case the customer-level `maxprefixes` / `maxprefixesv6` apply.
          required: [ ipv4, ipv6 ]
          properties:
            ipv4:
              type: [ integer, 'null' ]
            ipv6:
              type: [ integer, 'null' ]

    ConnectionInput:
      type: object
      title: ConnectionInput
      description: |
        The body of `POST /member/{cust}/connection`, and the `connection` section of
        `POST /onboarding`.

        Validated by `StoreConnection`, which is `IXP\Http\Requests\StoreVirtualInterfaceWizard`
        plus a delta of `name`, `description`, `mtu`, `lag_framing`, `fastlacp` and `busyhost` —
        all fillable columns an unattended caller has no other way to set — with
        `ipv4address` / `ipv6address` replaced so that they also accept `"auto"`, and
        `ipv4hostname` / `ipv6hostname` replaced by the wizard's rule with `bail` in front.

        Only the address *type* is relaxed, never the requirement: a family which is enabled
        must still carry an address. Dropping that would create a VLAN interface with
        `ipv4enabled=1` and no address, which renders as `neighbor  as 65551;` in the route
        server configuration — a parse error invalidating the generated config for the whole
        VLAN, not merely that peer.

        `custid` is not part of the payload; it comes from the route (or, at onboarding, from
        the member being created). `status` defaults to `1` (connected) and `duplex` to `full`.
        At onboarding a `cust` or `id` key in the section is removed before validation.
      required: [ vlanid, switch, switchportid, speed ]
      properties:
        vlanid:
          type: integer
          description: '`vlan.id`. Must exist. At KleyReX the peering LAN (tag 900) is id 1.'
        switch:
          type: integer
          description: |
            `switch.id`. Must exist, must be active, and the switch port named below must belong
            to it — a mismatch is `422`.
        switchportid:
          type: integer
          description: |
            `switchport.id`. Must exist, must have no physical interface attached, and must be
            of type *unset* or *peering*. Set to *peering* once the connection is created.
        speed:
          type: integer
          enum: [ 10, 100, 1000, 10000, 25000, 40000, 100000, 400000 ]
          description: Mbit/s.
        status:
          type: integer
          enum: [ 1, 2, 3, 4, 5 ]
          default: 1
          description: |
            `1` Connected, `2` Disabled, `3` Not Connected, `4` Awaiting X-Connect,
            `5` Quarantine. Defaulted to `1` before validation when absent.
        duplex:
          type: string
          enum: [ full, half ]
          default: full
          description: Defaulted to `full` before validation when absent.
        rate_limit:
          type: [ integer, 'null' ]
          minimum: 0
          description: Mbit/s. Null or absent means unlimited.
        autoneg:
          type: boolean
        name:
          type: [ string, 'null' ]
          maxLength: 255
          description: Virtual interface name, for example `ae0`. Not offered by the web wizard.
        description:
          type: [ string, 'null' ]
          maxLength: 255
        mtu:
          type: [ integer, 'null' ]
          minimum: 0
        trunk:
          type: boolean
        lag_framing:
          type: boolean
          description: |
            LAG bookkeeping is applied here but not by the web wizard, whose form cannot request
            it; `setBundleDetails()` assigns the channel group.
        fastlacp:
          type: boolean
        busyhost:
          type: boolean
        mcastenabled:
          type: boolean
        rsclient:
          type: boolean
          description: |
            Route server client. Enabling this together with `irrdbfilter` while the member has
            no IRRDB source set makes the route servers block every prefix — the controller logs
            a warning but does not refuse.
        irrdbfilter:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            An IPv4 address, or the literal `"auto"` (case-insensitive, whitespace trimmed).

            **Required when `ipv4enabled` is true**, nullable otherwise. An explicit address must
            already exist in this VLAN's pool and be unassigned — unlike the web path, no address
            record is created on the fly.
          examples: [ auto, 193.189.82.101 ]
        ipv4hostname:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Validated with `IdnValidate`. **Required when `ipv4enabled` is true and
            `ixp_fe.vlaninterfaces.hostname_required` is set** — which it is by default. A value
            which is not a string is a `422`: the rule stops at `string` (`bail`) before
            `IdnValidate`, whose `idn_to_ascii()` would throw on it.
        ipv4bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            An IPv6 address, or the literal `"auto"`. **Required when `ipv6enabled` is true**,
            nullable otherwise. Same pool rules as `ipv4address`; an address written in a
            different but equivalent form (`2001:7f8:33::a101:2586:1` vs
            `2001:07f8:0033::a101:2586:0001`) is matched against both the given and the
            canonical form.
          examples: [ auto, '2001:7f8:33::a101:2586:1' ]
        ipv6hostname:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Validated with `IdnValidate`. **Required when `ipv6enabled` is true and
            `ixp_fe.vlaninterfaces.hostname_required` is set** — which it is by default. A value
            which is not a string is a `422`, as for `ipv4hostname`.
        ipv6bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean

    ConnectionDetail:
      title: ConnectionDetail
      description: |
        A connection as the connection/{vi} endpoints and the connection list represent it,
        built by `ConnectionPresenter::toArray()`: every field of `Connection` with the same
        value, plus what `PATCH /connection/{vi}` can change but `Connection` leaves out, and
        the physical interfaces in their fuller shape.
      allOf:
        - $ref: '#/components/schemas/Connection'
        - type: object
          required: [ description, mtu, fastlacp ]
          properties:
            description:
              type: [ string, 'null' ]
              maxLength: 255
            mtu:
              type: [ integer, 'null' ]
              description: The IP MTU configured on the interface; null for the default.
            fastlacp:
              type: boolean
            physical_interfaces:
              type: array
              items:
                $ref: '#/components/schemas/PhysicalInterface'

    PhysicalInterface:
      title: PhysicalInterface
      description: |
        A physical interface as the physical-interface endpoints and `GET /connection/{vi}`
        represent it, built by `PhysicalInterfacePresenter::toArray()`: the fields of
        `ConnectionPhysicalInterface`, with the same values, plus the connection, the type of
        the switch port and the notes.
      allOf:
        - $ref: '#/components/schemas/ConnectionPhysicalInterface'
        - type: object
          required: [ connection, switchport_type, notes ]
          properties:
            connection:
              type: [ integer, 'null' ]
              description: '`virtualinterface.id` - the connection this interface belongs to.'
            switchport_type:
              type: [ integer, 'null' ]
              description: |
                The switch port's type: `0` unset, `1` peering, `2` monitor, `3` core, `4` other,
                `5` management, `6` fanout, `7` reseller. Interfaces on core and fanout ports are
                not changed through this API. Null once the interface is detached.
            notes:
              type: [ string, 'null' ]
              description: Free text. A physical interface has no description.

    ConnectionList:
      title: ConnectionList
      type: object
      required: [ connections, count, total, limit, offset ]
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionDetail'
        count:
          type: integer
          description: Connections on this page.
        total:
          type: integer
          description: Connections matching the filters, on all pages.
        limit:
          type: integer
        offset:
          type: integer

    ConnectionUpdate:
      title: ConnectionUpdate
      type: object
      description: |
        Any subset of the connection's settings. Left out keeps, `null` clears. Other fields,
        `custid` among them, are ignored.
      minProperties: 1
      properties:
        name:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            The interface or bundle name. Surrounding double quotes are stripped, which is how
            a name keeps trailing whitespace. On a LAG without one, the vendor's bundle name is
            filled in.
        description:
          type: [ string, 'null' ]
          maxLength: 255
        mtu:
          type: [ integer, 'null' ]
          minimum: 1
          maximum: 64000
        trunk:
          type: boolean
          description: 802.1Q tagging.
        channelgroup:
          type: [ integer, 'null' ]
          description: |
            Must be unique on the connection's switch. Assigned automatically when LAG framing
            is switched on without one; cannot be removed while the connection has more than one
            physical interface.
        lag_framing:
          type: boolean
          description: Cannot be switched off while the connection has more than one physical interface.
        fastlacp:
          type: boolean

    ConnectionUpdateResult:
      title: ConnectionUpdateResult
      type: object
      required: [ connection, changed ]
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionDetail'
        changed:
          type: array
          items:
            type: string
          description: |
            The attributes which actually changed, under their column names - including those
            the LAG bookkeeping filled in. Empty when the PATCH matched what was stored.
            `updated_at` is not listed.

    PhysicalInterfaceInput:
      title: PhysicalInterfaceInput
      type: object
      description: A new physical interface. The connection comes from the path.
      required: [ switch, switchportid, speed ]
      properties:
        switch:
          type: integer
          description: '`switch.id`; the port must belong to it.'
        switchportid:
          type: integer
          description: |
            `switchport.id`: no physical interface, on an active switch, of type unset or
            peering, and on the switch of the connection's other ports.
        status:
          type: integer
          enum: [ 1, 2, 3, 4, 5 ]
          default: 1
        speed:
          type: integer
          enum: [ 10, 100, 1000, 10000, 25000, 40000, 100000, 400000 ]
          description: Mbit/s.
        duplex:
          type: string
          enum: [ full, half ]
          default: full
        rate_limit:
          type: [ integer, 'null' ]
          minimum: 0
          description: Mbit/s; null or 0 for none.
        autoneg:
          type: boolean
          default: true
        notes:
          type: [ string, 'null' ]

    PhysicalInterfaceUpdate:
      title: PhysicalInterfaceUpdate
      type: object
      description: |
        Any subset of these. Left out keeps, `null` clears. Other fields - the switch, the port
        and the connection among them - are ignored.
      minProperties: 1
      properties:
        status:
          type: integer
          enum: [ 1, 2, 3, 4, 5 ]
          description: '`1` Connected, `2` Disabled, `3` Not Connected, `4` Awaiting X-Connect, `5` Quarantine.'
        speed:
          type: integer
          enum: [ 10, 100, 1000, 10000, 25000, 40000, 100000, 400000 ]
        duplex:
          type: string
          enum: [ full, half ]
        rate_limit:
          type: [ integer, 'null' ]
          minimum: 0
          description: Mbit/s; null or 0 for none.
        autoneg:
          type: boolean
        notes:
          type: [ string, 'null' ]

    PhysicalInterfaceMove:
      title: PhysicalInterfaceMove
      description: The target port, and optionally any change `PATCH /physical-interface/{pi}` takes.
      allOf:
        - $ref: '#/components/schemas/PhysicalInterfaceUpdate'
        - type: object
          required: [ switch, switchportid ]
          properties:
            switch:
              type: integer
              description: '`switch.id`; the port must belong to it.'
            switchportid:
              type: integer
              description: |
                `switchport.id`: no physical interface, on an active switch, of type unset or
                peering. A LAG member's new port must be on the switch of the LAG's other
                members.

    PhysicalInterfaceUpdateResult:
      title: PhysicalInterfaceUpdateResult
      type: object
      required: [ physical_interface, changed ]
      properties:
        physical_interface:
          $ref: '#/components/schemas/PhysicalInterface'
        changed:
          type: array
          items:
            type: string
          description: |
            The attributes which actually changed, under their column names. Empty when nothing
            did. `updated_at` is not listed.

    VlanInterface:
      type: object
      title: VlanInterface
      description: |
        A connection's presence in one VLAN, as `VlanInterfacePresenter` builds it. Every field
        of the web edit form, under the names `PATCH` takes, except the MD5 secrets, which are
        reported as `*_set` booleans and never returned. Addresses are the address strings of
        the pool. Flags which are NULL in the database are reported as false.

        A strict superset of `ConnectionVlanInterface`: every field there is here, with the same
        name and type - `maxbgpprefix` included.
      required:
        - id
        - connection
        - custid
        - vlan
        - ipv4enabled
        - ipv4address
        - ipv4hostname
        - ipv4bgpmd5secret_set
        - ipv4canping
        - ipv4monitorrcbgp
        - ipv4maxbgpprefix
        - ipv6enabled
        - ipv6address
        - ipv6hostname
        - ipv6bgpmd5secret_set
        - ipv6canping
        - ipv6monitorrcbgp
        - ipv6maxbgpprefix
        - mcastenabled
        - irrdbfilter
        - rsclient
        - rsmorespecifics
        - as112client
        - busyhost
        - maxbgpprefix
        - mac_addresses
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: '`vlaninterface.id`.'
        connection:
          type: [ integer, 'null' ]
          description: '`virtualinterface.id` of the connection - the `{vi}` of the connection endpoints.'
        custid:
          type: [ integer, 'null' ]
          description: The member the connection belongs to.
        vlan:
          type: [ integer, 'null' ]
          description: '`vlan.id` - the `vlanid` of the request bodies.'
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
        ipv4hostname:
          type: [ string, 'null' ]
        ipv4bgpmd5secret_set:
          type: boolean
          description: Whether an IPv4 BGP MD5 secret is configured. The secret is write-only.
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
          description: |
            The prefix limit of the IPv4 route server sessions. Null (or 0) means the member's
            `maxprefixes` applies, read when the configuration is generated.
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
        ipv6hostname:
          type: [ string, 'null' ]
        ipv6bgpmd5secret_set:
          type: boolean
          description: Whether an IPv6 BGP MD5 secret is configured. The secret is write-only.
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
          description: As `ipv4maxbgpprefix`, falling back to the member's `maxprefixesv6`.
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean
        maxbgpprefix:
          type: object
          description: |
            The two prefix limits in the shape `ConnectionVlanInterface` has always used - the
            same numbers as `ipv4maxbgpprefix` / `ipv6maxbgpprefix`.
          required: [ ipv4, ipv6 ]
          properties:
            ipv4:
              type: [ integer, 'null' ]
            ipv6:
              type: [ integer, 'null' ]
        mac_addresses:
          type: array
          description: The configured MACs, oldest first.
          items:
            $ref: '#/components/schemas/MacAddress'
        created_at:
          type: [ string, 'null' ]
          format: date-time
          description: ISO 8601. Null for interfaces created before IXP Manager kept timestamps.
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    VlanInterfaceInput:
      type: object
      title: VlanInterfaceInput
      description: |
        The body of `POST /connection/{vi}/vlan-interface`. Validated by `StoreVlanInterface`:
        the web form's `IXP\Http\Requests\StoreVlanInterface` with an empty delta and four
        overrides - `ipv4address` / `ipv6address` also accept `"auto"`, and the hostname rules
        stop at their first failure (`bail`), which turns a 500 for a hostname that is not a
        string into a 422. `virtualinterfaceid` comes from the route; a value in the body is
        ignored.
      required: [ vlanid ]
      properties:
        vlanid:
          type: integer
          description: '`vlan.id`. Must exist. The connection must not have a VLAN interface in it already.'
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            An IPv4 address of the VLAN's pool which is free, or `"auto"`. **Required when
            `ipv4enabled` is true.**
          examples: [ auto, 10.2.0.77 ]
        ipv4hostname:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Validated with `IdnValidate`. Required when `ipv4enabled` is true and
            `ixp_fe.vlaninterfaces.hostname_required` is set - the default.
        ipv4bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
          description: Write-only. Generate it on the calling side; it is never returned.
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
          description: Left out or null, the member's limit applies when the configuration is generated.
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
          maxLength: 255
          description: As `ipv4address`, for IPv6; matched against the pool in any equivalent notation.
          examples: [ auto, '2001:db8:2::4d' ]
        ipv6hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
          description: Defaults to true when left out (the column default).
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean

    VlanInterfaceUpdate:
      type: object
      title: VlanInterfaceUpdate
      description: |
        The body of `PATCH /vlan-interface/{vli}`: any subset of the fields of
        `VlanInterfaceInput`. A field left out keeps its value, one sent as `null` is cleared;
        the flags cannot be null. Validated by `UpdateVlanInterface` against the record
        completed with the current values. Every other field is ignored, `virtualinterfaceid`
        included.
      properties:
        vlanid:
          type: integer
          description: |
            Moves the interface to another VLAN. Every family holding an address must then be
            sent a new one, `"auto"` or `null`; the interface's MACs must not be configured on
            another interface of the new VLAN.
        ipv4enabled:
          type: boolean
          description: Disabling keeps the address reserved; send `ipv4address` as `null` as well to release it.
        ipv4address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            The current address or `"auto"` (when the family has an address in this VLAN)
            changes nothing; another address of the pool renumbers; `null` releases it - refused
            while the family is enabled.
        ipv4hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv4bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean

    VlanInterfaceCreateResult:
      type: object
      title: VlanInterfaceCreateResult
      required: [ vlan_interface, warnings ]
      properties:
        vlan_interface:
          $ref: '#/components/schemas/VlanInterface'
        warnings:
          type: array
          description: |
            What the web UI would show without refusing - IRRDB filtering on a route server
            client whose member has no IRRDB source; a second VLAN on a connection without
            802.1q framing. Empty when there is nothing to say.
          items:
            type: string

    VlanInterfaceUpdateResult:
      type: object
      title: VlanInterfaceUpdateResult
      required: [ vlan_interface, changed, warnings ]
      properties:
        vlan_interface:
          $ref: '#/components/schemas/VlanInterface'
        changed:
          type: array
          description: |
            The fields whose value changed, in the order of the edit form, under the request's
            names (`ipv4address`, not `ipv4addressid`). Empty when the PATCH matched what was
            stored.
          items:
            type: string
        warnings:
          type: array
          description: As for a create; the 802.1q warning only arises there.
          items:
            type: string

    MacAddress:
      type: object
      title: MacAddress
      description: |
        A configured MAC address (`Layer2Address`), as `MacAddressPresenter` builds it, with who
        holds it - under the names the address pool listing uses for who holds an address.
      required: [ id, mac, mac_colon, vlan_interface, connection, vlan, custid, member_name, created_at ]
      properties:
        id:
          type: integer
          description: '`l2address.id` - the `{l2a}` of `DELETE /mac/{l2a}`.'
        mac:
          type: [ string, 'null' ]
          pattern: '^[0-9a-f]{12}$'
          description: Twelve lowercase hex digits, as stored.
        mac_colon:
          type: [ string, 'null' ]
          description: The colon-separated form switch configuration uses.
          examples: [ '00:1a:2b:3c:4d:5e' ]
        vlan_interface:
          type: integer
        connection:
          type: [ integer, 'null' ]
        vlan:
          type: [ integer, 'null' ]
        custid:
          type: [ integer, 'null' ]
        member_name:
          type: [ string, 'null' ]
        created_at:
          type: [ string, 'null' ]
          format: date-time

    MacAddressInput:
      type: object
      title: MacAddressInput
      required: [ mac ]
      properties:
        mac:
          type: string
          description: |
            A MAC address in any usual notation - `00:1A:2B:3C:4D:5E`, `001a.2b3c.4d5e`,
            `00-1a-2b-3c-4d-5e`, `001A2B3C4D5E`. Everything but hex digits is dropped; twelve
            must remain.

    MacAddressList:
      type: object
      title: MacAddressList
      required: [ mac_addresses ]
      properties:
        mac_addresses:
          type: array
          items:
            $ref: '#/components/schemas/MacAddress'

    Pong:
      type: object
      title: Pong
      required: [ pong, user, version ]
      properties:
        pong:
          type: boolean
          const: true
        user:
          type: string
          description: Username of the API key's owner, as resolved by `apiauth`.
        version:
          type: string
          description: The `APPLICATION_VERSION` constant of this IXP Manager installation.

    Switch:
      type: object
      title: Switch
      description: |
        A switch. Built by `SwitchPresenter`. The first four fields are the original ones;
        `active`, `rack`, `facility` and `vendor` were added next to them. `snmppasswd` is never
        included.
      required: [ id, name, infrastructure, hostname, active, rack, facility, vendor ]
      properties:
        id:
          type: integer
          description: '`switch.id` - the value the `switch` field of a connection expects.'
        name:
          type: [ string, 'null' ]
          description: Short name, for example `vc513`.
        infrastructure:
          type: [ integer, 'null' ]
          description: '`infrastructure.id` this switch belongs to.'
        hostname:
          type: [ string, 'null' ]
        active:
          type: boolean
          description: |
            Whether the switch is in service. `NULL` in the column is reported as `false`. Only
            active switches are polled and offered for orders.
        rack:
          type: [ integer, 'null' ]
          description: '`cabinet.id` of the rack the switch stands in - see `GET /rack/{cabinet}`.'
        facility:
          type: [ integer, 'null' ]
          description: '`location.id` of that rack''s facility - see `GET /facility/{location}`.'
        vendor:
          type: [ integer, 'null' ]
          description: '`vendor.id` - see `GET /vendor`.'
      examples:
        - id: 13
          name: vc513
          infrastructure: 1
          hostname: vc513.kleyrex.net
          active: true
          rack: 7
          facility: 4
          vendor: 12

    Infrastructure:
      type: object
      title: Infrastructure
      description: |
        An infrastructure and the VLANs attached to it. Built by `InfrastructurePresenter`.
        `country`, `ixf_ix_id`, `peeringdb_ix_id` and `exclude_from_ixf_export` were added next
        to the original fields.
      required: [ id, name, shortname, isPrimary, vlans, country, ixf_ix_id, peeringdb_ix_id, exclude_from_ixf_export ]
      properties:
        id:
          type: integer
        name:
          type: [ string, 'null' ]
        shortname:
          type: [ string, 'null' ]
        isPrimary:
          type: boolean
        vlans:
          type: array
          description: In id order.
          items:
            $ref: '#/components/schemas/Vlan'
        country:
          type: [ string, 'null' ]
          description: ISO 3166-1 alpha-2 country code.
        ixf_ix_id:
          type: [ integer, 'null' ]
          description: The exchange's id in the IX-F database.
        peeringdb_ix_id:
          type: [ integer, 'null' ]
          description: The exchange's id at PeeringDB.
        exclude_from_ixf_export:
          type: boolean

    Port:
      type: object
      title: Port
      description: |
        A switch port which is free to be assigned to a member: no physical interface attached,
        type *unset* or *peering*, on an active switch.
      required: [ switchport, name, type, switch, switch_name, infrastructure ]
      properties:
        switchport:
          type: integer
          description: '`switchport.id` — the value the `switchportid` field of a connection expects.'
        name:
          type: [ string, 'null' ]
          description: Port name as configured on the switch, for example `xe-0/0/9`.
        type:
          type: integer
          description: |
            `0` = unset, `1` = peering. No other type is ever returned by this endpoint;
            `2` monitor, `3` core, `4` other, `5` management, `6` fanout and `7` reseller are
            infrastructure and are filtered out.
          enum: [ 0, 1 ]
        switch:
          type: integer
          description: '`switch.id` — pass this as `switch` when creating the connection.'
        switch_name:
          type: [ string, 'null' ]
        infrastructure:
          type: [ integer, 'null' ]
      examples:
        - switchport: 412
          name: xe-0/0/9
          type: 0
          switch: 13
          switch_name: vc513
          infrastructure: 1

    Vlan:
      type: object
      title: Vlan
      description: |
        A VLAN, as every endpoint reports it - `GET /vlan`, the VLANs nested in
        `GET /infrastructure`, the header of `GET /vlan/{vlan}/address`. Built by
        `VlanPresenter`. `id`, `name` and `number` are the original fields; the flags were added
        next to them.
      required: [ id, name, number, infrastructure, private, config_name, export_to_ixf, peering_matrix, peering_manager ]
      properties:
        id:
          type: integer
          description: '`vlan.id` - the value the `vlanid` field of a connection expects.'
        name:
          type: [ string, 'null' ]
        number:
          type: [ integer, 'null' ]
          description: The 802.1Q tag. At KleyReX, 900 for the peering LAN.
        infrastructure:
          type: integer
          description: '`infrastructure.id` the VLAN belongs to.'
        private:
          type: boolean
          description: A private VLAN between members, not a peering LAN.
        config_name:
          type: [ string, 'null' ]
          description: The name switch automation knows the VLAN by.
        export_to_ixf:
          type: boolean
          description: |
            Whether the VLAN is part of the IX-F export - false for a quarantine VLAN, for
            example.
        peering_matrix:
          type: boolean
        peering_manager:
          type: boolean
      examples:
        - id: 1
          name: Peering LAN
          number: 900
          infrastructure: 1
          private: false
          config_name: peering
          export_to_ixf: true
          peering_matrix: true
          peering_manager: true

    VlanDetail:
      title: VlanDetail
      description: A VLAN with its network information per protocol - `GET /vlan/{vlan}`.
      allOf:
        - $ref: '#/components/schemas/Vlan'
        - type: object
          required: [ network_info ]
          properties:
            network_info:
              type: object
              description: Both keys are always present; `null` where the protocol has no network information.
              required: [ ipv4, ipv6 ]
              properties:
                ipv4:
                  oneOf:
                    - $ref: '#/components/schemas/NetworkInfo'
                    - type: 'null'
                ipv6:
                  oneOf:
                    - $ref: '#/components/schemas/NetworkInfo'
                    - type: 'null'

    NetworkInfo:
      type: object
      title: NetworkInfo
      description: |
        The subnet of a VLAN for one protocol. Built by `NetworkInfoPresenter`. The legacy
        columns `rs1address`, `rs2address` and `dnsfile` are not reported.
      required: [ id, protocol, network, masklen ]
      properties:
        id:
          type: integer
          description: '`networkinfo.id`.'
        protocol:
          type: integer
          enum: [ 4, 6 ]
        network:
          type: [ string, 'null' ]
          description: The network address, for example `193.189.82.0`.
        masklen:
          type: [ integer, 'null' ]
          description: The prefix length, for example `23`.

    Address:
      type: object
      title: Address
      description: |
        One address from a VLAN's pool. Built by `IpAddressPresenter`. Pools are filled ahead of
        time, in the web UI; this API never mints an address, it only claims an existing,
        unclaimed one.
      required: [ id, address, free, assigned_to ]
      properties:
        id:
          type: integer
          description: '`ipv4address.id` or `ipv6address.id`.'
        address:
          type: string
          description: The address exactly as stored.
        free:
          type: boolean
          description: True when no VLAN interface points at this address.
        assigned_to:
          description: Who holds the address; `null` exactly when `free` is true.
          oneOf:
            - $ref: '#/components/schemas/AddressHolder'
            - type: 'null'
      examples:
        - id: 341
          address: 193.189.82.101
          free: true
          assigned_to: null
        - id: 342
          address: 193.189.82.102
          free: false
          assigned_to:
            custid: 97
            member_name: Example Networks GmbH
            connection: 501
            vlan_interface: 733
            hostname: example.peering.kleyrex.net

    AddressHolder:
      type: object
      title: AddressHolder
      description: |
        The VLAN interface an address is assigned to, and the member and connection behind it -
        the columns the web address list shows next to each address.
      required: [ custid, member_name, connection, vlan_interface, hostname ]
      properties:
        custid:
          type: [ integer, 'null' ]
          description: '`cust.id` of the member - see `GET /member/{cust}`.'
        member_name:
          type: [ string, 'null' ]
        connection:
          type: [ integer, 'null' ]
          description: '`virtualinterface.id` - the id `DELETE /connection/{vi}` takes.'
        vlan_interface:
          type: integer
          description: '`vlaninterface.id`.'
        hostname:
          type: [ string, 'null' ]
          description: The VLAN interface's hostname for this address family.

    AddressList:
      type: object
      title: AddressList
      description: The addresses of one protocol family within a VLAN.
      required: [ addresses, total, truncated ]
      properties:
        addresses:
          type: array
          description: Ordered numerically, not lexically, so `.10` does not precede `.9`.
          items:
            $ref: '#/components/schemas/Address'
        total:
          type: integer
          description: Size of the whole matching set, before `limit` was applied.
        truncated:
          type: boolean
          description: True when `limit` cut the list short.

    VlanAddressListing:
      type: object
      title: VlanAddressListing
      description: |
        The response of `GET /vlan/{vlan}/address`. `ipv4` is omitted when `protocol=6` was
        asked for or `network` is an IPv6 network, `ipv6` when `protocol=4` was or `network`
        is an IPv4 network.
      required: [ vlan ]
      properties:
        vlan:
          $ref: '#/components/schemas/Vlan'
        ipv4:
          $ref: '#/components/schemas/AddressList'
        ipv6:
          $ref: '#/components/schemas/AddressList'

    IrrdbSource:
      type: object
      title: IrrdbSource
      description: |
        An IRRDB source: the whois host and the source list bgpq3/bgpq4 query for a member's
        prefixes. Built by `IrrdbSourcePresenter`.
      required: [ id, host, source, notes, member_count, created_at, updated_at ]
      properties:
        id:
          type: integer
          description: '`irrdbconfig.id` - the value of a member''s `irrdb`.'
        host:
          type: [ string, 'null' ]
          description: The whois host, for example `whois.radb.net`.
        source:
          type: [ string, 'null' ]
          description: The source list, comma-separated in order of preference, for example `RADB,RIPE`.
        notes:
          type: [ string, 'null' ]
        member_count:
          type: integer
          description: |
            Members referring to the source, departed members included - the count the web UI
            checks before it lets a source be deleted.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    IrrdbSourceInput:
      type: object
      title: IrrdbSourceInput
      description: |
        `host` and `source` as the web form validates them; `notes` is validated here although
        the web form does not. Any other field is ignored.
      required: [ host, source ]
      properties:
        host:
          type: string
          maxLength: 255
          description: A host name (international names allowed), checked by `IdnValidate`.
        source:
          type: string
          maxLength: 255
        notes:
          type: [ string, 'null' ]
          description: Stored on creation only - not applied to a source which exists already.

    IrrdbSourceResult:
      type: object
      title: IrrdbSourceResult
      description: The response of `POST /irrdb-source`, `201` and `200` alike.
      required: [ irrdb_source, created ]
      properties:
        irrdb_source:
          $ref: '#/components/schemas/IrrdbSource'
        created:
          type: boolean
          description: True with `201`, when the source was created; false with `200`, when it existed.

    Facility:
      type: object
      title: Facility
      description: |
        A facility (data centre); `location` in the schema. Built by `FacilityPresenter`, with
        the fields of the web view.
      required:
        - id
        - name
        - shortname
        - tag
        - address
        - city
        - country
        - pdb_facility_id
        - nocphone
        - nocfax
        - nocemail
        - officephone
        - officefax
        - officeemail
        - notes
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: '`location.id`.'
        name:
          type: [ string, 'null' ]
        shortname:
          type: [ string, 'null' ]
        tag:
          type: [ string, 'null' ]
        address:
          type: [ string, 'null' ]
        city:
          type: [ string, 'null' ]
        country:
          type: [ string, 'null' ]
          description: ISO 3166-1 alpha-2 country code.
        pdb_facility_id:
          type: [ integer, 'null' ]
          description: The facility's id at PeeringDB.
        nocphone:
          type: [ string, 'null' ]
        nocfax:
          type: [ string, 'null' ]
        nocemail:
          type: [ string, 'null' ]
        officephone:
          type: [ string, 'null' ]
        officefax:
          type: [ string, 'null' ]
        officeemail:
          type: [ string, 'null' ]
        notes:
          type: [ string, 'null' ]
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    Rack:
      type: object
      title: Rack
      description: |
        A rack; `cabinet` in the schema. Built by `RackPresenter`, with the fields of the web
        view.
      required: [ id, name, facility, colocation, height, type, u_counts_from, notes, created_at, updated_at ]
      properties:
        id:
          type: integer
          description: '`cabinet.id` - what a switch names as its `rack`.'
        name:
          type: [ string, 'null' ]
        facility:
          type: [ integer, 'null' ]
          description: '`location.id` of the facility the rack stands in.'
        colocation:
          type: [ string, 'null' ]
          description: The colocation provider's reference for the rack.
        height:
          type: [ integer, 'null' ]
          description: Height in rack units.
        type:
          type: [ string, 'null' ]
        u_counts_from:
          type: [ integer, 'null' ]
          enum: [ 1, 2, null ]
          description: '`1` when the units count from the top, `2` from the bottom.'
        notes:
          type: [ string, 'null' ]
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    Vendor:
      type: object
      title: Vendor
      description: An equipment vendor. Built by `VendorPresenter`.
      required: [ id, name, shortname, bundle_name, created_at, updated_at ]
      properties:
        id:
          type: integer
          description: '`vendor.id` - what a switch names as its `vendor`.'
        name:
          type: [ string, 'null' ]
        shortname:
          type: [ string, 'null' ]
        bundle_name:
          type: [ string, 'null' ]
          description: The vendor's name for a link aggregation interface, for example `ae` or `Port-Channel`.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    OnboardingInput:
      type: object
      title: OnboardingInput
      description: |
        A composite order. Sections are nested rather than flattened so that field names cannot
        collide — `name` means something different for a member, a user and a virtual interface.

        A `cust` or `id` key in any section is removed before validation. The section rules come
        from the dedicated endpoints' requests, whose inherited web rules read `$this->cust` and
        `$this->id` as the record being edited; such a key ended in a `500` (`member.cust`) or
        exempted an existing username from the uniqueness check (`user.id`).
      required: [ member ]
      properties:
        reference:
          type: [ string, 'null' ]
          maxLength: 191
          description: |
            The caller's own order identifier. Supplying it makes the request idempotent: a
            repeat returns `200` with the original member instead of creating a second one.
            Omitting it means a retry after a timeout creates a duplicate member.
          examples: [ ORD-2026-04711 ]
        member:
          $ref: '#/components/schemas/MemberInput'
        user:
          oneOf:
            - $ref: '#/components/schemas/UserInput'
            - type: 'null'
          description: Optional. Omit the key entirely to create no user.
        connection:
          oneOf:
            - $ref: '#/components/schemas/ConnectionInput'
            - type: 'null'
          description: Optional. Omit the key entirely to create no connection.

    OnboardingMemberRef:
      type: object
      title: OnboardingMemberRef
      description: |
        The onboarding responses report only the id and shortname of what they created — not the
        full `Member` object. Read `GET /member/{cust}` for the rest.
      required: [ id, shortname ]
      properties:
        id:
          type: integer
        shortname:
          type: string

    OnboardingResult:
      type: object
      title: OnboardingResult
      description: The `201` response — the whole order landed.
      required: [ created, reference, member, user, connection ]
      properties:
        created:
          type: boolean
          const: true
        reference:
          type: [ string, 'null' ]
          description: Echoed back, or null when none was supplied.
        member:
          $ref: '#/components/schemas/OnboardingMemberRef'
        user:
          type: [ object, 'null' ]
          description: Null when no `user` section was supplied.
          required: [ id, username ]
          properties:
            id:
              type: integer
            username:
              type: string
        connection:
          type: [ object, 'null' ]
          description: Null when no `connection` section was supplied.
          required: [ id ]
          properties:
            id:
              type: integer
              description: '`virtualinterface.id`.'

    OnboardingReplay:
      type: object
      title: OnboardingReplay
      description: |
        The `200` response — this reference was seen before and nothing was created.

        `user` and `connection` are **absent**, never null, when there is nothing to report:
        the original call did not create one, it has since been deleted, or the reference was
        recorded by an earlier version of this API, which kept the member only.
      required: [ created, reference, member ]
      properties:
        created:
          type: boolean
          const: false
        reference:
          type: string
        member:
          $ref: '#/components/schemas/OnboardingMemberRef'
        user:
          type: object
          description: The user the original call created, if it did and the user still exists.
          required: [ id, username ]
          properties:
            id:
              type: integer
            username:
              type: string
        connection:
          type: object
          description: The connection the original call created, if it did and it still exists.
          required: [ id ]
          properties:
            id:
              type: integer
              description: '`virtualinterface.id`.'
