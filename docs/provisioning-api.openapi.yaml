        `CompanyRegisteredDetail` and `CompanyBillingDetail`, which hang off the member and are
        created empty by `POST /member`. Each part uses the web form's field names - the names
        `PATCH` takes - so a caller can merge the two parts, change what it needs and send them
        back. The one rename is the billing record's `notes` column, `billingNotes` here, as on
        the web form.

        A part is `null` when the member has no such record - possible for members written to
