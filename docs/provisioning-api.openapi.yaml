                  id: 501
                  custid: 97
                  name: ae
                  description: Example Networks GmbH primary
                  mtu: null
                  trunk: false
                  lag_framing: true
                  fastlacp: true
                  channelgroup: 4
                  physical_interfaces:
                    - id: 733
                      status: 1
                      speed: 10000
                      duplex: full
                      rate_limit: null
                      autoneg: true
                      switchport: 412
                      switchport_name: xe-0/0/9
                      switch: 13
                      switch_name: vc513
                      connection: 501
                      switchport_type: 1
                      notes: null
                  vlan_interfaces:
                    - id: 688
                      vlan: 1
                      ipv4enabled: true
                      ipv4address: 193.189.82.101
                      ipv4hostname: examplenet.kleyrex.net
                      ipv6enabled: false
                      ipv6address: null
                      ipv6hostname: null
                      rsclient: true
                      irrdbfilter: true
