              example:
                connections:
                  - id: 501
                    custid: 97
                    name: null
                    trunk: false
                    lag_framing: false
                    channelgroup: null
                    physical_interfaces:
                      - id: 733
                        status: 1
                        speed: 10000
                        duplex: full
                        rate_limit: null
                        autoneg: true
                        switchport: 412
                        switchport_name: xe-0/0/9
                        switch: 13
                        switch_name: vc513
                    vlan_interfaces:
                      - id: 688
                        vlan: 1
                        ipv4enabled: true
                        ipv4address: 193.189.82.101
                        ipv4hostname: examplenet.kleyrex.net
                        ipv6enabled: true
                        ipv6address: '2001:7f8:33::a101:2586:1'
                        ipv6hostname: examplenet.kleyrex.net
                        rsclient: true
                        irrdbfilter: true
                        as112client: false
                        maxbgpprefix:
                          ipv4: 500
                          ipv6: 500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Connections ]
      operationId: createMemberConnection
      summary: Create a connection for a member
      description: |
        Creates the virtual interface, the physical interface on a switch port, the VLAN
        interface and its addresses — the equivalent of the web UI's "add a port" wizard, minus
        the redirects and flash messages a machine caller cannot use.

        **Everything happens in one transaction, including the address allocation**: the row
        lock `IpAllocator` takes is only meaningful until commit. The transaction is attempted
        up to three times on deadlock. Two orders provisioned at the same moment cannot both
        keep the same switch port or address: where the checks race, the unique indexes on
        `physicalinterface.switchportid` and `vlaninterface.ipv4addressid` / `ipv6addressid`
        refuse the loser, which is answered with `409` and nothing written.

        Differences from the web wizard, all deliberate:

        - `ipv4address` / `ipv6address` may be the literal `"auto"`.
        - An explicit address must **already exist** in the VLAN's pool and be unassigned.
          `setIp()` would happily create one on the fly; `IpAllocator::claim()` is consulted
          first and rejects anything not in the pool.
        - LAG bookkeeping (`setBundleDetails()`, and hence `assignChannelGroup()`) is applied.
          The wizard omits it, which is harmless there because its form cannot request LAG
          framing.
        - `status` defaults to *connected* (`1`) and `duplex` to `full`, so a caller does not
          have to restate what is true of every member port.

        The switch port is checked **before anything is written**. It is rejected with `422`
        when it does not exist, belongs to a different switch than `switch` names, already has a
        physical interface, sits on an inactive switch, or is not of type *unset* or *peering*.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
            examples:
              autoDualStack:
                summary: Dual stack with automatic addressing on KleyReX VLAN 900
                value:
                  vlanid: 1
                  switch: 13
                  switchportid: 412
                  speed: 10000
                  ipv4enabled: true
                  ipv4address: auto
                  ipv4hostname: examplenet.kleyrex.net
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet.kleyrex.net
                  rsclient: true
                  irrdbfilter: true
                  ipv4maxbgpprefix: 500
                  ipv6maxbgpprefix: 500
              explicitAddresses:
                summary: Explicit addresses, rate limited, with a LAG-framed interface
                value:
                  vlanid: 1
                  switch: 14
                  switchportid: 501
                  speed: 10000
                  rate_limit: 1000
                  status: 1
                  duplex: full
                  autoneg: true
                  name: ae0
                  description: Example Networks GmbH primary
                  mtu: 9000
                  lag_framing: true
                  fastlacp: false
                  ipv4enabled: true
                  ipv4address: 193.189.82.101
                  ipv4hostname: examplenet.kleyrex.net
                  ipv6enabled: true
                  ipv6address: '2001:7f8:33::a101:2586:1'
                  ipv6hostname: examplenet.kleyrex.net
                  rsclient: true
                  irrdbfilter: true
                  as112client: false
              ipv6Only:
                summary: IPv6 only — the v4 family stays disabled and unaddressed
                value:
                  vlanid: 1
                  switch: 13
                  switchportid: 413
                  speed: 1000
                  ipv4enabled: false
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet-v6.kleyrex.net
                  rsclient: true
      responses:
        '201':
          description: The connection was created.
          content:
            application/json:
              schema:
                type: object
                required: [ connection ]
                properties:
                  connection:
                    $ref: '#/components/schemas/Connection'
              example:
                connection:
                  id: 501
                  custid: 97
                  name: null
                  trunk: false
                  lag_framing: false
                  channelgroup: null
                  physical_interfaces:
                    - id: 733
                      status: 1
                      speed: 10000
                      duplex: full
                      rate_limit: null
                      autoneg: true
                      switchport: 412
                      switchport_name: xe-0/0/9
                      switch: 13
                      switch_name: vc513
                  vlan_interfaces:
                    - id: 688
                      vlan: 1
                      ipv4enabled: true
                      ipv4address: 193.189.82.101
                      ipv4hostname: examplenet.kleyrex.net
                      ipv6enabled: true
                      ipv6address: '2001:7f8:33::a101:2586:1'
                      ipv6hostname: examplenet.kleyrex.net
                      rsclient: true
                      irrdbfilter: true
                      as112client: false
                      maxbgpprefix:
                        ipv4: 500
                        ipv6: 500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request took the switch port or one of the addresses between the checks and
            the insert, and a unique index refused this one. **Nothing was created** — the
            transaction was rolled back. The port check and `IpAllocator` run before anything is
            written, so this only happens when two orders race; retrying will normally produce a
            `422` naming the resource that is now taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  Another request took the switch port or an address of this connection while it
                  was being created. Nothing was created. Check the port and the addresses and
                  retry.
        '422':
          description: |
            Either the payload failed validation (`message` **and** `errors`), or the switch
            port or an address could not be used (`message` only — these are raised by the
            controller and by `IpAllocator`, not by the validator). Nothing was written in
            either case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                enabledFamilyWithoutAddress:
                  summary: ipv4enabled with no address — validation
                  value:
                    message: The ipv4address field is required.
                    errors:
                      ipv4address:
                        - The ipv4address field is required.
                malformedAddress:
                  summary: neither an address nor "auto" — validation
                  value:
                    message: The ipv4address must be a valid ipv4 address or "auto".
                    errors:
                      ipv4address:
                        - The ipv4address must be a valid ipv4 address or "auto".
                portTaken:
                  summary: switch port already assigned
                  value:
                    message: Switch port xe-0/0/9 is already assigned to another connection.
                portOnOtherSwitch:
                  summary: switch port does not belong to the switch named
                  value:
                    message: Switch port xe-0/0/9 does not belong to the switch given.
                portNotMemberPort:
                  summary: switch port is infrastructure, not a member port
                  value:
                    message: Switch port xe-0/0/9 is not a member port (type 3).
                switchInactive:
                  summary: switch taken out of service between listing and ordering
                  value:
                    message: Switch port xe-0/0/9 is on a switch which is not active.
                addressNotInPool:
                  summary: explicit address which is not in this VLAN's pool
                  value:
                    message: IPv4 address 193.189.82.101 is not in the address pool of VLAN Peering LAN (id 1).
                addressTaken:
                  summary: explicit address already on another VLAN interface
                  value:
                    message: IPv4 address 193.189.82.101 is already assigned to another VLAN interface.
                poolExhausted:
                  summary: '"auto" with nothing left to allocate'
                  value:
                    message: No free IPv6 address left in VLAN Peering LAN (id 1).
                raced:
                  summary: an address was taken between the check and the write
                  value:
                    message: An address became unavailable while the connection was being created. Please retry.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /connection:
    get:
      tags: [ Connections ]
      operationId: listConnections
      summary: List connections across members
      description: |
        Connections a page at a time, in id order, in the representation of
        `GET /connection/{vi}`. What an external system needs to reconcile its copy: every
        connection, or those of one member, on one switch, in one VLAN, or with a physical
        interface in one status. Filters are optional and combine.

        A filter naming something which does not exist is a `422`, as on `port/free`, rather
        than an empty page which looks like an answer. Core bundle connections are listed too;
        their ports have `switchport_type` 3. Relations are eager loaded, so a page is a fixed
        number of queries.
      parameters:
        - name: member
          in: query
          required: false
          description: Only the connections of this member (`cust.id`).
          schema:
            type: integer
            minimum: 1
          example: 97
        - name: switch
          in: query
          required: false
          description: Only connections with a physical interface on a port of this switch.
          schema:
            type: integer
            minimum: 1
          example: 13
        - name: vlan
          in: query
          required: false
          description: Only connections with a VLAN interface in this VLAN (`vlan.id`, not the tag).
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: status
          in: query
          required: false
          description: |
            Only connections with a physical interface in this status: `1` Connected,
            `2` Disabled, `3` Not Connected, `4` Awaiting X-Connect, `5` Quarantine.
          schema:
            type: integer
            enum: [ 1, 2, 3, 4, 5 ]
          example: 4
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Connections to skip, in id order.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of connections.
          content:
            application/json:
              schema:
