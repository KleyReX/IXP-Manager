# Wave 1 fragment: portal users and their member links (customer_to_users).
#
# To be merged into docs/provisioning-api.openapi.yaml:
#   - `paths` add new paths, except `/member/{cust}/user`, which exists already (POST): merge the
#     `get` operation below into it; its path-level `parameters` are the same.
#   - `components.schemas` adds new schemas only; none of these names exists yet.
#   - The operations use a new tag `Users`. Suggested entry for the top-level `tags` list:
#       - name: Users
#         description: Finding, changing and deleting portal users, and the links which give
#           them access to members.
#   - References to existing components: responses Unauthorized, Forbidden, NotFound,
#     TooManyRequests; parameters CustomerId; schemas Error, ValidationError, UserInput.

paths:

  /user:
    get:
      tags: [ Users ]
      operationId: listUsers
      summary: Find portal users
      description: |
        Above all the lookup by email. IXP Manager does not require a unique address, and
        `POST /member/{cust}/user` does not look for an existing account, so before creating a
        user ask whether the person has one already - and if so, link that user to the member
        with `POST /member/{cust}/user/{u}` instead. This is the "check email" step of the web
        UI's create wizard (`UserController::createCheckEmail()`).

        All filters are optional and combined with AND. A filter which is present but empty is
        `422`, not ignored: `?email=` must not answer a duplicate check with a list of everybody.

        Ordered by username. Each user carries all of their member links.
      parameters:
        - name: email
          in: query
          required: false
          description: |
            Exact address, case-insensitive - the web edit stores an address as typed, so the
            same person's may be cased either way. Validated as the web's check-email step
            validates it (`email|max:255`).
          schema:
            type: string
            format: email
            maxLength: 255
          example: noc@example.net
        - name: username
          in: query
          required: false
          description: Exact username.
          schema:
            type: string
            maxLength: 255
          example: examplenet-noc
        - name: q
          in: query
          required: false
          description: |
            Substring of the username, the name or the email. `%` and `_` are matched literally,
            not as wildcards.
          schema:
            type: string
            minLength: 2
            maxLength: 255
          example: mustermann
        - name: member
          in: query
          required: false
          description: Only users linked to this member (`cust.id`). An unknown id finds nobody.
          schema:
            type: integer
            minimum: 1
          example: 97
        - name: privs
          in: query
          required: false
          description: |
            Only users with a link of this privilege. Together with `member` it applies to the
            link to that member: `?member=97&privs=2` is "the custadmins of member 97", not
            "users of member 97 who are custadmin somewhere".
          schema:
            type: integer
            enum: [ 0, 1, 2, 3 ]
          example: 2
        - name: enabled
          in: query
          required: false
          description: '`1` for enabled users, `0` for disabled ones. A legacy `NULL` in `disabled` counts as enabled.'
          schema:
            type: integer
            enum: [ 0, 1 ]
          example: 1
        - name: limit
          in: query
          required: false
          description: Cap the number of users returned.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 50
      responses:
        '200':
          description: The matching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUserList'
              example:
                users:
                  - id: 314
                    username: examplenet-noc
                    name: Erika Mustermann
                    email: noc@example.net
                    authorisedMobile: null
                    enabled: true
                    custid: 97
                    peeringdb_id: null
                    creator: provisioning
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                    links:
                      - id: 1201
                        custid: 97
                        user_id: 314
                        privs: 2
                        created_by:
                          type: api
                          user_id: 1
                        last_login_date: '2026-11-20T08:14:03+01:00'
                        last_login_from: 192.0.2.10
                        last_login_via: Login
                        created_at: '2026-08-01T10:00:00+02:00'
                        updated_at: '2026-11-20T08:14:03+01:00'
                count: 1
                truncated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: A filter is malformed, or present but empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The email field must have a value.
                errors:
                  email:
                    - The email field must have a value.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/{u}:
    parameters:
      - name: u
        in: path
        required: true
        description: |
          The user's `user.id`. Resolved by route model binding, so an unknown id is `404`. Named
          `u` because the inherited web rules read the user as `$this->u`; a body or query key
          `u` is removed before validation so that it cannot stand in for it.
        schema:
          type: integer
          minimum: 1
        example: 314
    get:
      tags: [ Users ]
      operationId: showUser
      summary: Read a portal user, with all of their member links
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/PortalUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Users ]
      operationId: updateUser
      summary: Change a portal user
      description: |
        Mirrors the superuser path of `UserController@update`. Takes any subset of the web edit
        form's fields; a field left out keeps its value, a field sent as `null` is cleared - or
        refused where the web form requires it. `UpdateUser` completes the request with the
        user's current values and validates it with the web rules (`User\Update`) plus
        `enabled`, held to them by `UserRulesParityTest`.

        - A field which is empty today and not sent is not part of the change: its rules are
          dropped, so a legacy user without a `name` can still be disabled.
        - A stored value is validated in full: a username from before the current rule makes
          every PATCH a `422` until the same PATCH sends a valid one - as in the web form.
        - A sent `email` is lowercased, as on creation; one merely carried along is not.
        - Disabling ends the user's remember-me sessions, as the web edit does. API keys and
          app passwords stay; IXP Manager refuses the keys of a disabled user.
        - A PATCH which matches what is stored writes nothing, not even `lastupdatedby`.

        Fields outside the form (`custid`, `creator`, `password`, the web's `disabled`, `privs`)
        are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUserUpdate'
            examples:
              disable:
                summary: disable the user
                value:
                  enabled: false
              rename:
                summary: change the name and the address
                value:
                  name: Erika Musterfrau
                  email: erika@example.net
      responses:
        '200':
          description: The user after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUserUpdateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, nothing written:

            - the user owns the API key making the request, and the change would disable it
              (every key of a disabled user is refused with `401`) or rename it (the API's
              actions are logged and recorded under its username);
            - another request took the username between validation and write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user owns the API key making this request. Disabling it would lock the
                  provisioning API out: ApiAuthenticate refuses every key of a disabled user.
                  Disable it in the web UI, or with another superuser's key.
        '422':
          description: The completed record failed validation. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The username has already been taken.
                errors:
                  username:
                    - The username has already been taken.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Users ]
      operationId: deleteUser
      summary: Delete a portal user, everywhere
      description: |
        Mirrors `UserController@delete`, in one transaction. Removed with the user: their member
        links and the login history of each, API keys, app passwords (their login records
        cascade), remember-me tokens and 2FA enrolment. The log rows the user wrote are copied
        into the application log and removed, as the web does, because `log.user_id` has a
        foreign key without `ON DELETE`.

        The web also deletes app password login records itself, by the wrong column
        (`UserController.php:480`), which can hit another password's record. Not reproduced.

        To end one member's access only, use `DELETE /member/{cust}/user/{u}`. Not idempotent:
        a second call is `404`.
      responses:
        '200':
          description: The user was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user owns the API key making the request; the key would be deleted with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user owns the API key making this request, and the key would be deleted
                  with it. Delete the user in the web UI, or with another superuser's key.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/{u}/welcome-email:
    parameters:
      - name: u
        in: path
        required: true
        description: The user's `user.id`. Resolved by route model binding, so an unknown id is `404`.
        schema:
          type: integer
          minimum: 1
        example: 314
    post:
      tags: [ Users ]
      operationId: sendWelcomeEmail
      summary: Send the welcome email again
      description: |
        Sends the mail user creation sends (`UserCreated`), in its "resent" wording, with a fresh
        link to set a password - as the web UI's resend button does
        (`UserController::resendWelcomeEmail()`). Welcome links expire after 7 days. Building
        the mail issues a new password reset token, so the link of any earlier welcome email
        stops working.

        Every call mails a third party, so it is limited to **5 sends per user per hour**,
        counting only mails which actually went out. No request body.
      responses:
        '200':
          description: The mail was handed to the mail server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeEmailResult'
              example:
                sent: true
                email: noc@example.net
                remaining: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, nothing sent: the user is disabled (the link would lead to an account which
            cannot log in), or has no email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This user is disabled, so the link in the welcome email would lead to an
                  account which cannot log in. Enable the user first.
        '429':
          description: |
            Either the per-user limit of this endpoint - 5 sends per user per hour, with
            `Retry-After` in seconds - or the global rate limit of the API (see
            `TooManyRequests`).
          headers:
            Retry-After:
              description: Seconds until another send is allowed.
              schema:
                type: integer
              example: 2841
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  The welcome email has been sent to this user 5 times within the last hour
                  already. Try again in 2841 seconds.
        '503':
          description: |
            The mail server refused the mail. Nothing was sent - but the token had been issued
            already, so the link of any earlier welcome email no longer works. Retry later; the
            failure does not count against the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /member/{cust}/user:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [ Users ]
      operationId: listMemberUsers
      summary: List a member's users
      description: |
        Every user linked to the member, ordered by username, each with its privilege on and
        link to this member - the list to reconcile against. Other members of the same users
        do not appear; `GET /user/{u}` shows those.
      responses:
        '200':
          description: The member's users. Empty when it has none.
          content:
            application/json:
              schema:
                type: object
                required: [ users ]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberUser'
              example:
                users:
                  - id: 314
                    username: examplenet-noc
                    name: Erika Mustermann
                    email: noc@example.net
                    authorisedMobile: null
                    enabled: true
                    custid: 97
                    peeringdb_id: null
                    creator: provisioning
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                    privs: 2
                    link:
                      id: 1201
                      custid: 97
                      user_id: 314
                      privs: 2
                      created_by:
                        type: api
                        user_id: 1
                      last_login_date: '2026-11-20T08:14:03+01:00'
                      last_login_from: 192.0.2.10
                      last_login_via: Login
                      created_at: '2026-08-01T10:00:00+02:00'
                      updated_at: '2026-11-20T08:14:03+01:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /member/{cust}/user/{u}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: u
        in: path
        required: true
        description: |
          The user's `user.id`. Resolved by route model binding, so an unknown id is `404` - and
          so is a user which exists but is not linked to the member, except for `POST`, which
          creates that link.
        schema:
          type: integer
          minimum: 1
        example: 314
    get:
      tags: [ Users ]
      operationId: showMemberUser
      summary: Read one of a member's users
      responses:
        '200':
          description: The user, with its privilege on and link to this member.
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/MemberUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such member or user, or the user is not linked to this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This user is not linked to this customer.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Users ]
      operationId: linkMemberUser
      summary: Give an existing user access to a member
      description: |
        Mirrors `CustomerToUserController@store`. Validated with the web request's rules
        (`User\CustomerToUser\Store`, which is final, so the API delegates to it rather than
        extending it), with `privs` narrowed to 1-3 as a declared override: the web also accepts
        0 (PUBLIC), a link which grants nothing. Superuser privileges (`3`) only on an internal
        member (`type: 3`).

        The member and the user come from the route; ids in the body are ignored. The link
        records the key owner as its creator (`created_by: {type: api, user_id}`); the user's
        default member stays what it was.

        **Mails the user**: the `UserAddedToCustomer` event tells them they can now act for this
        member, as the web does. Fired only once the link exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberLinkInput'
            example:
              privs: 1
      responses:
        '201':
          description: The link was created and the user notified.
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/MemberUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The user is linked to this member already - found up front, or by the unique index on
            `(customer_id, user_id)` when another request made the link in the meantime. Change
            the privilege with `PATCH` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This user is already linked to this customer. Change the privilege with PATCH instead.
        '422':
          description: The privilege is missing, unknown, or superuser on a member which is not internal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: You are not allowed to set super user privileges for non-internal (IXP) customer types.
                errors:
                  privs:
                    - You are not allowed to set super user privileges for non-internal (IXP) customer types.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Users ]
      operationId: updateMemberUser
      summary: Change a user's privilege on a member
      description: |
        Mirrors `CustomerToUserController@updatePrivs`, which validates inline and answers HTTP
        200 with `success: false` when it refuses. `UpdateCustomerToUser` reproduces its checks -
        a privilege of 1 to 3, superuser only on an internal member - and answers `422`;
        `UserRulesParityTest` sends the same values to both and compares what each refuses.

        A body without `privs` keeps the privilege, so `{}` is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberLinkUpdate'
            example:
              privs: 2
      responses:
        '200':
          description: The user after the change, and whether the privilege actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberUserUpdateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such member or user, or the user is not linked to this member - answered before the body is validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This user is not linked to this customer.
        '409':
          description: |
            The change would lock the API out, so nothing was written:

            - it lowers the privilege of the key owner's link to its default member, from which
              IXP Manager reads the owner's privilege - anything below superuser makes every
              further request `403`;
            - it demotes the key owner on another member while the owner is the last active user
              with that privilege there - the guard the web applies to everybody's own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The privilege is null, unknown, or superuser on a member which is not internal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Users ]
      operationId: unlinkMemberUser
      summary: Remove a user's access to a member
      description: |
        Mirrors `CustomerToUserController@delete`, in a transaction: the link and its login
        history go, and if the member was the user's default, the default moves to the user's
        oldest remaining link.

        **A user's last link is not removed** (`409`). A user without a member cannot log in and
        has no privilege; the web UI never offers this and crashes when it is done anyway, after
        the link is gone. To remove the person, `DELETE /user/{u}`. The count is taken under a
        lock on the user's links, so two requests cannot each remove one of the last two.
      responses:
        '200':
          description: The link was removed.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such member or user, or the user is not linked to this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Refused, nothing removed: it is the user's last link, or the link of the key owner to
            its default member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  This is the user's only customer, and a user without one cannot log in.
                  Delete the user instead (DELETE user/314).
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:

  schemas:

    PortalUser:
      type: object
      title: PortalUser
      description: |
        A portal user as the person - `UserPresenter::toArray()`: who they are, and every member
        they can act for (`links`). An explicit field list: never the password hash, a
        remember-me token or anything about 2FA, and a column added to the schema does not
        appear on its own.

        There is deliberately no `privs` here: a user has one privilege per member, found in
        `links`.
      required:
        - id
        - username
        - name
        - email
        - authorisedMobile
        - enabled
        - custid
        - peeringdb_id
        - creator
        - created_at
        - updated_at
        - links
      properties:
        id:
          type: integer
          description: '`user.id` - the `{u}` of the user endpoints.'
        username:
          type: [ string, 'null' ]
        name:
          type: [ string, 'null' ]
          description: Legacy users often have none.
        email:
          type: [ string, 'null' ]
        authorisedMobile:
          type: [ string, 'null' ]
        enabled:
          type: boolean
          description: The inverse of the `disabled` column. A legacy `NULL` there counts as enabled, as at login.
        custid:
          type: [ integer, 'null' ]
          description: |
            The default member: the one the user acts for after logging in, and the link IXP
            Manager reads their privilege from.
        peeringdb_id:
          type: [ integer, 'null' ]
          description: Set when the account was created or linked by a PeeringDB login.
        creator:
          type: [ string, 'null' ]
          description: Username of whoever created the user - the key owner's for users created through this API.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
        links:
          type: array
          description: One per member the user can act for, oldest first.
          items:
            $ref: '#/components/schemas/MemberLink'

    MemberLink:
      type: object
      title: MemberLink
      description: |
        A link between a user and a member (`customer_to_users`) - `CustomerToUserPresenter::toArray()`.
        It is what gives the user access to the member, and with which privilege.
      required:
        - id
        - custid
        - user_id
        - privs
        - created_by
        - last_login_date
        - last_login_from
        - last_login_via
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: '`customer_to_users.id`.'
        custid:
          type: integer
          description: The member - `customer_id` in the database, `custid` everywhere in this API.
        user_id:
          type: integer
        privs:
          type: integer
          description: |
            `1` CUSTUSER, `2` CUSTADMIN, `3` SUPERUSER. Links made outside this API may also hold
            `0` (PUBLIC), which the web accepts and this API does not.
          enum: [ 0, 1, 2, 3 ]
        created_by:
          type: [ object, 'null' ]
          description: |
            Who made the link, from `extra_attributes.created_by`: `{type: api, user_id}` (the key
            owner) for links made through this API, `{type: user, user_id}` for the web UI (which
            records the linked user, not the actor), `{type: PeeringDB}` for PeeringDB logins,
            `{type: migration-script}` for links older than the table.
          properties:
            type:
              type: string
            user_id:
              type: integer
        last_login_date:
          type: [ string, 'null' ]
          format: date-time
          description: The user's last login to this member.
        last_login_from:
          type: [ string, 'null' ]
          description: Address of that login.
        last_login_via:
          type: [ string, 'null' ]
          description: |
            How: `Login`, `RememberMe` or `SwitchCustomer` (the user switched to this member while
            logged in). `null` on links older than the column.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
          description: Also moves on every login, which writes `last_login_*`.

    MemberUser:
      type: object
      title: MemberUser
      description: |
        A portal user as one member's user - `UserPresenter::forMember()`: the person fields of
        `PortalUser`, plus the privilege on and the link to *that* member. Other members do not
        appear. A superset of what `POST /member/{cust}/user` answers (`User`).
      required:
        - id
        - username
        - name
        - email
        - authorisedMobile
        - enabled
        - custid
        - peeringdb_id
        - creator
        - created_at
        - updated_at
        - privs
        - link
      properties:
        id:
          $ref: '#/components/schemas/PortalUser/properties/id'
        username:
          $ref: '#/components/schemas/PortalUser/properties/username'
        name:
          $ref: '#/components/schemas/PortalUser/properties/name'
        email:
          $ref: '#/components/schemas/PortalUser/properties/email'
        authorisedMobile:
          $ref: '#/components/schemas/PortalUser/properties/authorisedMobile'
        enabled:
          $ref: '#/components/schemas/PortalUser/properties/enabled'
        custid:
          $ref: '#/components/schemas/PortalUser/properties/custid'
        peeringdb_id:
          $ref: '#/components/schemas/PortalUser/properties/peeringdb_id'
        creator:
          $ref: '#/components/schemas/PortalUser/properties/creator'
        created_at:
          $ref: '#/components/schemas/PortalUser/properties/created_at'
        updated_at:
          $ref: '#/components/schemas/PortalUser/properties/updated_at'
        privs:
          type: integer
          enum: [ 0, 1, 2, 3 ]
          description: |
            The privilege on this member - the same as `link.privs`, at the top level because
            that is where `POST /member/{cust}/user` has always put it.
        link:
          $ref: '#/components/schemas/MemberLink'

    PortalUserList:
      type: object
      title: PortalUserList
      required: [ users, count, truncated ]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/PortalUser'
        count:
          type: integer
          description: The number of users in `users`.
        truncated:
          type: boolean
          description: True when more users matched than `limit` allowed. Narrow the filter; there are no pages.

    PortalUserUpdate:
      type: object
      title: PortalUserUpdate
      description: |
        The body of `PATCH /user/{u}`: any subset of the web edit form's fields. Nothing is
        required. A field left out keeps its value; a field sent as `null` is cleared, or refused
        where the web form requires it (`name`, `username`, `email`).
      properties:
        name:
          type: [ string, 'null' ]
          maxLength: 255
          description: Required by the web rule - `null` is refused.
        username:
          $ref: '#/components/schemas/UserInput/properties/username'
        email:
          type: [ string, 'null' ]
          format: email
          maxLength: 255
          description: Lowercased before it is stored. Required by the web rule - `null` is refused.
        authorisedMobile:
          $ref: '#/components/schemas/UserInput/properties/authorisedMobile'
        enabled:
          type: boolean
          description: |
            Written to the `disabled` column inverted - the web form's inverted `disabled` field
            is not reproduced. `false` ends the user's remember-me sessions.

    PortalUserUpdateResult:
      type: object
      title: PortalUserUpdateResult
      required: [ user, changed ]
      properties:
        user:
          $ref: '#/components/schemas/PortalUser'
        changed:
          type: array
          items:
            type: string
            enum: [ name, username, email, authorisedMobile, enabled ]
          description: |
            The fields which actually changed, under this API's names (`enabled`, not the
            `disabled` column) - empty when the PATCH matched what was stored.

    MemberLinkInput:
      type: object
      title: MemberLinkInput
      description: The body of `POST /member/{cust}/user/{u}`. The member and the user come from the route.
      required: [ privs ]
      properties:
        privs:
          type: integer
          enum: [ 1, 2, 3 ]
          description: |
            `1` CUSTUSER, `2` CUSTADMIN, `3` SUPERUSER - the last only on an internal member
            (`type: 3`). The web also accepts `0`; this API does not.

    MemberLinkUpdate:
      type: object
      title: MemberLinkUpdate
      description: The body of `PATCH /member/{cust}/user/{u}`. Without `privs`, the privilege is kept.
      properties:
        privs:
          $ref: '#/components/schemas/MemberLinkInput/properties/privs'

    MemberUserUpdateResult:
      type: object
      title: MemberUserUpdateResult
      required: [ user, changed ]
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        changed:
          type: array
          items:
            type: string
            enum: [ privs ]
          description: '`[privs]`, or empty when the privilege was already the one asked for.'

    WelcomeEmailResult:
      type: object
      title: WelcomeEmailResult
      required: [ sent, email, remaining ]
      properties:
        sent:
          type: boolean
          const: true
        email:
          type: string
          description: The address the mail went to.
        remaining:
          type: integer
          minimum: 0
          description: How many more sends to this user the hourly limit allows.
