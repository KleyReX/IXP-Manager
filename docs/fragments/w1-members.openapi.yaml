# Fragment of docs/provisioning-api.openapi.yaml from the wave 1 "members" work package.
#
# Merge notes:
#   - paths./member gains a `get` operation; its existing `post` operation stays as it is.
#   - paths./member/{cust}/billing-registration is new.
#   - components.schemas.Member, MemberInput and MemberUpdate REPLACE the existing definitions
#     (new fields in Member, peeringdb_oauth in MemberInput); all other schemas here are new.
#   - The response examples of POST /member, GET /member/{cust} and PATCH /member/{cust} in the
#     main file predate the new Member fields, and the POST example shows peeringdb_oauth: false
#     for a request which did not send it - the response is the stored row now, which says true.
#   - info.description says representations come from the controllers' `*AsArray()` methods;
#     for members they come from IXP\Support\Provisioning\Presenters\MemberPresenter and
#     BillingRegistrationPresenter now.
#
# References to existing components: parameters/CustomerId, responses/Unauthorized, Forbidden,
# NotFound, TooManyRequests, schemas/Error, ValidationError.

paths:

  /member:
    get:
      tags: [ Members ]
      operationId: listMembers
      summary: List members
      description: |
        Every member matching the filters, ordered by `id`, in the representation
        `GET /member/{cust}` returns. `total` counts every match, not just the page.

        The filters are the admin member list's - status, type, current only, tag - plus the
        lookups an external system needs to map its records: AS number, shortname, a name
        search, reseller and `updated_since`. Validated by `ListCustomers`; the web list reads
        its filters unvalidated and ignores what it does not recognise, which an unattended
        caller cannot notice. Here an unknown id, a value outside the allowed set and **any
        parameter not listed below** are `422` - a misspelt `shortname` would otherwise return
        the first page of all members, and its first entry would look like the match.

        **`updated_since` is a convenience, not a change feed.** It compares with
        `cust.updated_at`, inclusively; an offset in the value is honoured. Writes which bypass
        Eloquent do not touch `updated_at` - the daily `ixp-manager:update-in-manrs` and
        `ixp-manager:update-in-peeringdb` jobs reset the flags of every member that way, so a
        member dropping out of MANRS or PeeringDB is never reported, while every current member
        listed there is reported after every run (the jobs set the flag again through the
        model). A NULL `updated_at` never matches, and changes to the billing and registration
        details do not touch `cust.updated_at`.
      parameters:
        - name: status
          in: query
          required: false
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
          schema:
            type: integer
            enum: [ 1, 2, 3 ]
          example: 3
        - name: type
          in: query
          required: false
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
          schema:
            type: integer
            enum: [ 1, 2, 3, 4 ]
          example: 1
        - name: current
          in: query
          required: false
          description: |
            `1` or `true`: members whose `is_current` is true - `Customer::SQL_CUST_CURRENT`,
            current through the leave date itself. `0` or `false`: every other member, one
            without a join date included. The two partition the members.
          schema:
            type: string
            enum: [ '1', '0', 'true', 'false' ]
          example: '1'
        - name: autsys
          in: query
          required: false
          description: AS number.
          schema:
            type: integer
            minimum: 1
          example: 12586
        - name: shortname
          in: query
          required: false
          description: |
            Exact shortname - not a substring. The column's collation compares
            case-insensitively, and shortnames are unique in that sense.
          schema:
            type: string
            maxLength: 255
          example: examplenet
        - name: q
          in: query
          required: false
          description: |
            A substring of the name or the shortname, case-insensitive. `%` and `_` are taken
            literally.
          schema:
            type: string
            maxLength: 255
          example: example
        - name: reseller
          in: query
          required: false
          description: Members resold by this member. Must exist in `cust.id`.
          schema:
            type: integer
            minimum: 1
          example: 42
        - name: tag
          in: query
          required: false
          description: Members carrying this tag. Must exist in `cust_tag.id`.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: updated_since
          in: query
          required: false
          description: |
            Members whose `updated_at` is at or after this point in time. Anything Laravel's
            `date` rule accepts; ISO 8601 with an offset is the sane choice. Feed back the
            greatest `updated_at` seen and expect those members again. See the operation's
            description for what this does not see.
          schema:
            type: string
            format: date-time
          example: '2026-11-01T00:00:00Z'
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 500
        - name: offset
          in: query
          required: false
          description: Members to skip, in `id` order.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 500
      responses:
        '200':
          description: The page of matching members, and how many match in all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
              example:
                members:
                  - id: 97
                    name: Example Networks GmbH
                    shortname: examplenet
                    abbreviatedName: EXAMPLE
                    type: 1
                    status: 1
                    autsys: 12586
                    maxprefixes: 500
                    maxprefixesv6: 500
                    peeringemail: peering@example.net
                    peeringmacro: AS-EXAMPLE
                    peeringmacrov6: null
                    peeringpolicy: open
                    irrdb: 1
                    datejoin: '2026-08-01'
                    dateleave: null
                    reseller: null
                    isReseller: false
                    corpwww: https://www.example.net
                    nocphone: '+49 69 1234567'
                    noc24hphone: null
                    nocemail: noc@example.net
                    nochours: 24x7
                    nocwww: null
                    MD5Support: 'YES'
                    activepeeringmatrix: true
                    peeringdb_oauth: true
                    in_manrs: false
                    in_peeringdb: true
                    is_current: true
                    has_left: false
                    creator: '3'
                    lastupdatedby: 3
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
                total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            A parameter failed validation - a value outside its set, a `limit` outside
            1..1000, a `reseller` or `tag` which does not exist, an unparseable
            `updated_since` - or the request carries a parameter this endpoint does not know.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                unknownParameter:
                  summary: a misspelt filter
                  value:
                    message: "Unknown parameter 'short_name'. This endpoint accepts: status, type, current, autsys, shortname, q, reseller, tag, updated_since, limit, offset."
                    errors:
                      short_name:
                        - "Unknown parameter 'short_name'. This endpoint accepts: status, type, current, autsys, shortname, q, reseller, tag, updated_since, limit, offset."
                unknownTag:
                  summary: a tag which does not exist
                  value:
                    message: The selected tag is invalid.
                    errors:
                      tag:
                        - The selected tag is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /member/{cust}/billing-registration:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [ Members ]
      operationId: showMemberBillingRegistration
      summary: Read a member's registered company and billing details
      description: |
        The two records behind the web's "Billing / Registration Details" form:
        `CompanyRegisteredDetail` and `CompanyBillingDetail`, which hang off the member and are
        created empty by `POST /member`. Each part uses the web form's field names - the names
        `PATCH` takes - so a caller can merge the two parts, change what it needs and send them
        back. The one rename is the billing record's `notes` column, `billingNotes` here, as on
        the web form.

        A part is `null` when the member has no such record - possible for members written to
        the database by other means.
      responses:
        '200':
          description: The member's registered company and billing details.
          content:
            application/json:
              schema:
                type: object
                required: [ billing_registration ]
                properties:
                  billing_registration:
                    $ref: '#/components/schemas/BillingRegistration'
              example:
                billing_registration:
                  member_id: 97
                  billing_managed_by_reseller: false
                  registration:
                    registeredName: Example Networks GmbH
                    companyNumber: HRB 12345
                    jurisdiction: Frankfurt am Main
                    address1: Hanauer Landstrasse 1
                    address2: null
                    address3: null
                    townCity: Frankfurt
                    postcode: '60314'
                    country: DE
                    notes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
                  billing:
                    billingContactName: Accounts Payable
                    billingFrequency: QUARTERLY
                    billingAddress1: Postfach 100
                    billingAddress2: null
                    billingAddress3: null
                    billingTownCity: Offenbach
                    billingPostcode: '63065'
                    billingCountry: DE
                    billingEmail: billing@example.net
                    billingTelephone: '+49 69 1234567'
                    purchaseOrderRequired: false
                    purchaseOrderNumber: null
                    invoiceMethod: EMAIL
                    invoiceEmail: invoices@example.net
                    vatRate: '19'
                    vatNumber: DE123456789
                    billingNotes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Members ]
      operationId: updateMemberBillingRegistration
      summary: Change a member's registered company and billing details
      description: |
        Mirrors `CustomerController::storeBillingAndRegDetails()`. Validation uses
        `UpdateBillingRegistration`, which extends the web form request
        `IXP\Http\Requests\Customer\BillingInformation` with a delta of `purchaseOrderRequired`
        (boolean) - the web form posts it but no web rule validates it. `MemberRulesParityTest`
        holds the rest to the web rules.

        PATCH semantics as for `PATCH /member/{cust}`: a field left out keeps its value, a field
        sent as `null` is cleared, and the request is completed with the stored values so that it
        is validated like the web form, which always posts everything. A field empty today and
        not sent stays absent. Two refinements, both following the web form: a stored `country`
        / `billingCountry` which is not an ISO 3166 code is neither validated nor cleared unless
        it is sent (the form shows it empty), and the billing fields of a member whose billing
        its reseller manages are not filled in at all (the form has no billing section for it).
        Any other stored value is validated in full.

        Both records change in one transaction. A record the member lacks is created first, as
        `POST /member` would have created it, when the request has something to store in it.

        Departures from the web, all deliberate: only validated fields are written (the web
        passes `$r->all()`); `IXP\Events\Customer\BillingDetailsChanged` fires only when the
        billing record actually changed, after the commit (the web fires it on every save, and
        its listener mails `ixp_fe.customer.billing_updates_notify` each time - never for a
        resold member); and a billing change for a member whose billing its reseller manages is
        refused with `409` instead of being skipped in silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingRegistrationUpdate'
            examples:
              billingContact:
                summary: change the billing e-mail and the VAT number
                value:
                  billingEmail: billing@example.net
                  vatNumber: DE123456789
              registration:
                summary: fill in the registered company details
                value:
                  registeredName: Example Networks GmbH
                  companyNumber: HRB 12345
                  jurisdiction: Frankfurt am Main
                  address1: Hanauer Landstrasse 1
                  townCity: Frankfurt
                  postcode: '60314'
                  country: DE
              clear:
                summary: clear a field
                value:
                  purchaseOrderNumber: null
      responses:
        '200':
          description: The details after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRegistrationUpdateResult'
              example:
                billing_registration:
                  member_id: 97
                  billing_managed_by_reseller: false
                  registration:
                    registeredName: Example Networks GmbH
                    companyNumber: HRB 12345
                    jurisdiction: Frankfurt am Main
                    address1: Hanauer Landstrasse 1
                    address2: null
                    address3: null
                    townCity: Frankfurt
                    postcode: '60314'
                    country: DE
                    notes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-08-01T10:00:00+02:00'
                  billing:
                    billingContactName: Accounts Payable
                    billingFrequency: QUARTERLY
                    billingAddress1: Postfach 100
                    billingAddress2: null
                    billingAddress3: null
                    billingTownCity: Offenbach
                    billingPostcode: '63065'
                    billingCountry: DE
                    billingEmail: billing@example.net
                    billingTelephone: '+49 69 1234567'
                    purchaseOrderRequired: false
                    purchaseOrderNumber: null
                    invoiceMethod: EMAIL
                    invoiceEmail: invoices@example.net
                    vatRate: '19'
                    vatNumber: DE123456789
                    billingNotes: null
                    created_at: '2026-08-01T10:00:00+02:00'
                    updated_at: '2026-11-24T21:03:34+01:00'
                changed: [ billingEmail, vatNumber ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Reseller mode is on (`IXP_RESELLER_ENABLED`), the member is resold, and the request
            would change a billing field. The member's billing is its reseller's business; the
            web form does not offer it either. Nothing was written - registration fields in the
            same request included. Billing fields sent with the values already stored are no
            change and do not cause this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  The billing details of this customer are managed by its reseller: reseller
                  mode is enabled and the customer is resold, so IXP Manager does not change
                  them - its own form does not offer them either. Nothing was changed. Fields
                  which would have changed: billingEmail, vatNumber.
        '422':
          description: |
            The completed record failed validation - a value the web form would refuse, such as
            a country outside the ISO 3166 list, an invalid `billingEmail` (sent, or already
            stored and not corrected in the same request), an unknown `billingFrequency` or
            `invoiceMethod`, or a `purchaseOrderRequired` which is not a boolean. Nothing is
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected billing country is invalid.
                errors:
                  billingCountry:
                    - The selected billing country is invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:

  schemas:

    Member:
      type: object
      title: Member
      description: |
        A member as this API reports it - the explicit field list of
        `IXP\Support\Provisioning\Presenters\MemberPresenter`, not the model's `toArray()`.
        Every member endpoint returns it: create, read, change and list. Every field
        `PATCH /member/{cust}` can change is included, so that a change can be read back.

        `is_current` and `has_left` are computed and disagree for a member whose leave date is
        today or in the future: it has left in the sense of `has_left` and is still current.
      required:
        - id
        - name
        - shortname
        - abbreviatedName
        - type
        - status
        - autsys
        - maxprefixes
        - maxprefixesv6
        - peeringemail
        - peeringmacro
        - peeringmacrov6
        - peeringpolicy
        - irrdb
        - datejoin
        - dateleave
        - reseller
        - isReseller
        - corpwww
        - nocphone
        - noc24hphone
        - nocemail
        - nochours
        - nocwww
        - MD5Support
        - activepeeringmatrix
        - peeringdb_oauth
        - in_manrs
        - in_peeringdb
        - is_current
        - has_left
        - creator
        - lastupdatedby
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        shortname:
          type: string
        abbreviatedName:
          type: [ string, 'null' ]
        type:
          type: integer
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
          enum: [ 1, 2, 3, 4 ]
        status:
          type: integer
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
          enum: [ 1, 2, 3 ]
        autsys:
          type: [ integer, 'null' ]
        maxprefixes:
          type: [ integer, 'null' ]
        maxprefixesv6:
          type: [ integer, 'null' ]
        peeringemail:
          type: [ string, 'null' ]
        peeringmacro:
          type: [ string, 'null' ]
        peeringmacrov6:
          type: [ string, 'null' ]
        peeringpolicy:
          type: [ string, 'null' ]
          enum: [ open, selective, mandatory, closed, null ]
        irrdb:
          type: [ integer, 'null' ]
          description: '`irrdbconfig.id`.'
        datejoin:
          type: [ string, 'null' ]
          format: date
          description: Normalised to `Y-m-d`.
        dateleave:
          type: [ string, 'null' ]
          format: date
          description: Normalised to `Y-m-d`. Note the column is `dateleave`, not `dateleft`.
        reseller:
          type: [ integer, 'null' ]
          description: '`cust.id` of the reseller, or null when the member is not resold.'
        isReseller:
          type: boolean
        corpwww:
          type: [ string, 'null' ]
        nocphone:
          type: [ string, 'null' ]
        noc24hphone:
          type: [ string, 'null' ]
        nocemail:
          type: [ string, 'null' ]
        nochours:
          type: [ string, 'null' ]
          enum: [ 24x7, 8x5, 8x7, 12x5, 12x7, null ]
        nocwww:
          type: [ string, 'null' ]
        MD5Support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
        activepeeringmatrix:
          type: boolean
        peeringdb_oauth:
          type: boolean
          description: Whether the member's users may log in with their PeeringDB account.
        in_manrs:
          type: boolean
          description: |
            Listed in MANRS, as the daily `ixp-manager:update-in-manrs` job last found.
            Read-only.
        in_peeringdb:
          type: boolean
          description: |
            Has a PeeringDB record, as the daily `ixp-manager:update-in-peeringdb` job last
            found. Read-only.
        is_current:
          type: boolean
          description: |
            `Customer::SQL_CUST_CURRENT`, the definition the switch, route server, IRRDB and
            IX-F exports use: joined on or before today, and the leave date, if any, not yet
            passed - **true through the leave date itself**. Evaluated by MySQL with
            `CURRENT_DATE()`, as the exports evaluate it. False without a join date.
        has_left:
          type: boolean
          description: |
            `Customer::hasLeft()`: true as soon as any leave date is set, a future one
            included. PeeringDB OAuth logins, for one, are refused on that basis.
        creator:
          type: [ string, 'null' ]
          description: |
            Who created the member. The column is a string: the creating user's id for members
            created through the web UI or this API, a username on older rows.
        lastupdatedby:
          type: [ integer, 'null' ]
          description: |
            User id of the last change through the web edit form or `PATCH /member/{cust}`;
            null when there was none.
        created_at:
          type: [ string, 'null' ]
          format: date-time
          description: When the member was created - ISO 8601.
        updated_at:
          type: [ string, 'null' ]
          format: date-time
          description: |
            When the member was last changed through Eloquent - ISO 8601. Writes which bypass
            Eloquent, such as the bulk reset of the MANRS and PeeringDB jobs, do not touch it.

    MemberList:
      type: object
      title: MemberList
      required: [ members, total ]
      properties:
        members:
          type: array
          description: The page of matching members, ordered by `id`.
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          description: How many members match in all - not just this page.

    MemberInput:
      type: object
      title: MemberInput
      description: |
        The body of `POST /member`, and the `member` section of `POST /onboarding`.

        Validated by `StoreCustomer`, which is `IXP\Http\Requests\Customer\Store` plus a delta
        of `dateleave`, `MD5Support`, `isReseller`, `isResold`, `activepeeringmatrix` and
        `peeringdb_oauth`.

        **When `type` is `2` (Associate) only the common fields below are validated at all** -
        `autsys` through `reseller` have no rules in that case and are passed straight to
        `Customer::create()`, where only fillable columns survive.

        Unknown fields are dropped: the controller passes `$r->validated()`, never `$r->all()`.
        A `cust` or `id` key is removed before validation - the inherited rules read the member
        being edited as `$this->cust`, which such a key would otherwise replace.
      required: [ name, type, shortname, datejoin, status, abbreviatedName ]
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Also written verbatim to the `CompanyRegisteredDetail.registeredName` created
            alongside the member.
        type:
          type: integer
          enum: [ 1, 2, 3, 4 ]
          description: '`1` Full, `2` Associate, `3` Internal, `4` Pro-bono.'
        shortname:
          type: string
          maxLength: 30
          pattern: '[a-z0-9]+'
          description: Must be unique across `cust.shortname`; a clash is `422`.
        status:
          type: integer
          enum: [ 1, 2, 3 ]
          description: '`1` Normal, `2` Not Connected, `3` Suspended.'
        abbreviatedName:
          type: string
          maxLength: 30
        datejoin:
          type: string
          format: date
          description: Any string Laravel's `date` rule accepts; `Y-m-d` is the sane choice.
        dateleave:
          type: [ string, 'null' ]
          format: date
          description: |
            The column the schema actually has. Validated by the API delta and persisted.
        dateleft:
          type: [ string, 'null' ]
          format: date
          description: |
            **Accepted but ignored.** The upstream web rules use this spelling, which matches no
            column and is not fillable. Use `dateleave`. Documented only so a caller which has
            been sending it knows it has never had an effect.
          deprecated: true
        corpwww:
          type: [ string, 'null' ]
          format: uri
          maxLength: 255
        MD5Support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
          description: The correctly-cased column name. Validated by the API delta and persisted.
        md5support:
          type: [ string, 'null' ]
          enum: [ UNKNOWN, 'YES', MANDATORY, PREFERRED, 'NO', null ]
          description: |
            **Accepted but ignored** - the upstream spelling, which is not a fillable column.
            Use `MD5Support`.
          deprecated: true
        autsys:
          type: integer
          minimum: 1
          description: 'AS number. Not validated when `type` is `2`.'
        maxprefixes:
          type: [ integer, 'null' ]
          minimum: 0
        maxprefixesv6:
          type: [ integer, 'null' ]
          minimum: 0
        peeringemail:
          type: string
          format: email
        peeringmacro:
          type: [ string, 'null' ]
          maxLength: 255
          pattern: '^(AS-[A-Z0-9]+(?:-[A-Z0-9]+)*|AS[1-9]\d*(?::AS-[A-Z0-9]+(?:-[A-Z0-9]+)*)?)$'
          description: 'Case-insensitive, for example `AS-EXAMPLE` or `AS12586:AS-CUSTOMERS`.'
        peeringmacrov6:
          type: [ string, 'null' ]
          maxLength: 255
          pattern: '^(AS-[A-Z0-9]+(?:-[A-Z0-9]+)*|AS[1-9]\d*(?::AS-[A-Z0-9]+(?:-[A-Z0-9]+)*)?)$'
        peeringpolicy:
          type: string
          enum: [ open, selective, mandatory, closed ]
        irrdb:
          type: [ integer, 'null' ]
          description: '`irrdbconfig.id`. Must exist.'
        nocphone:
          type: [ string, 'null' ]
          maxLength: 255
        noc24hphone:
          type: [ string, 'null' ]
          maxLength: 255
        nocemail:
          type: string
          format: email
          maxLength: 255
        nochours:
          type: [ string, 'null' ]
          enum: [ 24x7, 8x5, 8x7, 12x5, 12x7, null ]
        nocwww:
          type: [ string, 'null' ]
          format: uri
          maxLength: 255
        reseller:
          type: [ integer, 'null' ]
          description: '`cust.id` of the reseller. Must exist. Only written when `isResold` is true.'
        isResold:
          type: boolean
          description: |
            Not a column. When true, `reseller` is written to the member and must name an
            existing customer, else `422`. When false or absent, `reseller` is forced to null.
        isReseller:
          type: boolean
          description: Whether this member is itself a reseller.
        activepeeringmatrix:
          type: boolean
        peeringdb_oauth:
          type: boolean
          description: |
            Whether the member's users may log in with their PeeringDB account. Left out on
            creation, the database default applies, which is `true` - as on the web create
            form, where the box comes ticked.

    MemberUpdate:
      type: object
      title: MemberUpdate
      description: |
        The body of `PATCH /member/{cust}`: any subset of `MemberInput`'s fields. Nothing is
        required. A field left out keeps its value; a field sent as `null` is cleared. The
        definitions are `MemberInput`'s - see there for each rule.
      properties:
        name:
          $ref: '#/components/schemas/MemberInput/properties/name'
        type:
          $ref: '#/components/schemas/MemberInput/properties/type'
        shortname:
          $ref: '#/components/schemas/MemberInput/properties/shortname'
        abbreviatedName:
          $ref: '#/components/schemas/MemberInput/properties/abbreviatedName'
        corpwww:
          $ref: '#/components/schemas/MemberInput/properties/corpwww'
        datejoin:
          $ref: '#/components/schemas/MemberInput/properties/datejoin'
        dateleave:
          $ref: '#/components/schemas/MemberInput/properties/dateleave'
        status:
          $ref: '#/components/schemas/MemberInput/properties/status'
        MD5Support:
          $ref: '#/components/schemas/MemberInput/properties/MD5Support'
        autsys:
          $ref: '#/components/schemas/MemberInput/properties/autsys'
        maxprefixes:
          $ref: '#/components/schemas/MemberInput/properties/maxprefixes'
        maxprefixesv6:
          $ref: '#/components/schemas/MemberInput/properties/maxprefixesv6'
        peeringemail:
          $ref: '#/components/schemas/MemberInput/properties/peeringemail'
        peeringmacro:
          $ref: '#/components/schemas/MemberInput/properties/peeringmacro'
        peeringmacrov6:
          $ref: '#/components/schemas/MemberInput/properties/peeringmacrov6'
        peeringpolicy:
          $ref: '#/components/schemas/MemberInput/properties/peeringpolicy'
        irrdb:
          $ref: '#/components/schemas/MemberInput/properties/irrdb'
        activepeeringmatrix:
          $ref: '#/components/schemas/MemberInput/properties/activepeeringmatrix'
        nocphone:
          $ref: '#/components/schemas/MemberInput/properties/nocphone'
        noc24hphone:
          $ref: '#/components/schemas/MemberInput/properties/noc24hphone'
        nocemail:
          $ref: '#/components/schemas/MemberInput/properties/nocemail'
        nochours:
          $ref: '#/components/schemas/MemberInput/properties/nochours'
        nocwww:
          $ref: '#/components/schemas/MemberInput/properties/nocwww'
        isReseller:
          $ref: '#/components/schemas/MemberInput/properties/isReseller'
        isResold:
          $ref: '#/components/schemas/MemberInput/properties/isResold'
        reseller:
          $ref: '#/components/schemas/MemberInput/properties/reseller'
        peeringdb_oauth:
          $ref: '#/components/schemas/MemberInput/properties/peeringdb_oauth'

    BillingRegistration:
      type: object
      title: BillingRegistration
      description: |
        A member's registered company and billing details - the explicit field lists of
        `IXP\Support\Provisioning\Presenters\BillingRegistrationPresenter`. Each part uses the
        names `PATCH /member/{cust}/billing-registration` takes.
      required: [ member_id, billing_managed_by_reseller, registration, billing ]
      properties:
        member_id:
          type: integer
          description: '`cust.id`.'
        billing_managed_by_reseller:
          type: boolean
          description: |
            Reseller mode is on and the member is resold: its billing is its reseller's
            business, and a PATCH which would change a billing field is refused with `409`.
        registration:
          oneOf:
            - $ref: '#/components/schemas/RegistrationDetails'
            - type: 'null'
          description: Null when the member has no registration record.
        billing:
          oneOf:
            - $ref: '#/components/schemas/BillingDetails'
            - type: 'null'
          description: Null when the member has no billing record.

    RegistrationDetails:
      type: object
      title: RegistrationDetails
      description: The member's `CompanyRegisteredDetail` record.
      required: [ registeredName, companyNumber, jurisdiction, address1, address2, address3,
                  townCity, postcode, country, notes, created_at, updated_at ]
      properties:
        registeredName:
          type: [ string, 'null' ]
          description: '`POST /member` sets it to the member''s name.'
        companyNumber:
          type: [ string, 'null' ]
        jurisdiction:
          type: [ string, 'null' ]
        address1:
          type: [ string, 'null' ]
        address2:
          type: [ string, 'null' ]
        address3:
          type: [ string, 'null' ]
        townCity:
          type: [ string, 'null' ]
        postcode:
          type: [ string, 'null' ]
        country:
          type: [ string, 'null' ]
          description: |
            ISO 3166 alpha-2 code. A row written by other means may hold anything; a PATCH
            which does not send this field neither validates nor clears such a value.
        notes:
          type: [ string, 'null' ]
          description: The registration record's notes - not the billing notes.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    BillingDetails:
      type: object
      title: BillingDetails
      description: The member's `CompanyBillingDetail` record.
      required: [ billingContactName, billingFrequency, billingAddress1, billingAddress2,
                  billingAddress3, billingTownCity, billingPostcode, billingCountry,
                  billingEmail, billingTelephone, purchaseOrderRequired, purchaseOrderNumber,
                  invoiceMethod, invoiceEmail, vatRate, vatNumber, billingNotes, created_at,
                  updated_at ]
      properties:
        billingContactName:
          type: [ string, 'null' ]
        billingFrequency:
          type: [ string, 'null' ]
          enum: [ MONTHLY, 2MONTHLY, QUARTERLY, HALFYEARLY, ANNUALLY, NOBILLING, null ]
        billingAddress1:
          type: [ string, 'null' ]
        billingAddress2:
          type: [ string, 'null' ]
        billingAddress3:
          type: [ string, 'null' ]
        billingTownCity:
          type: [ string, 'null' ]
        billingPostcode:
          type: [ string, 'null' ]
        billingCountry:
          type: [ string, 'null' ]
          description: |
            ISO 3166 alpha-2 code. A row written by other means may hold anything; a PATCH
            which does not send this field neither validates nor clears such a value.
        billingEmail:
          type: [ string, 'null' ]
        billingTelephone:
          type: [ string, 'null' ]
        purchaseOrderRequired:
          type: boolean
        purchaseOrderNumber:
          type: [ string, 'null' ]
        invoiceMethod:
          type: [ string, 'null' ]
          enum: [ EMAIL, POST, null ]
        invoiceEmail:
          type: [ string, 'null' ]
        vatRate:
          type: [ string, 'null' ]
          description: A string column, as the web form treats it.
        vatNumber:
          type: [ string, 'null' ]
        billingNotes:
          type: [ string, 'null' ]
          description: The billing record's `notes` column, under the web form's name.
        created_at:
          type: [ string, 'null' ]
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    BillingRegistrationUpdate:
      type: object
      title: BillingRegistrationUpdate
      description: |
        The body of `PATCH /member/{cust}/billing-registration`: any subset of the web form's
        fields, flat. Nothing is required. A field left out keeps its value; a field sent as
        `null` is cleared (`purchaseOrderRequired` excepted - the column is NOT NULL). Fields
        not listed here are ignored.
      properties:
        registeredName:
          type: [ string, 'null' ]
          maxLength: 255
        companyNumber:
          type: [ string, 'null' ]
          maxLength: 255
        jurisdiction:
          type: [ string, 'null' ]
          maxLength: 255
        address1:
          type: [ string, 'null' ]
          maxLength: 255
        address2:
          type: [ string, 'null' ]
          maxLength: 255
        address3:
          type: [ string, 'null' ]
          maxLength: 255
        townCity:
          type: [ string, 'null' ]
          maxLength: 255
        postcode:
          type: [ string, 'null' ]
          maxLength: 255
        country:
          type: [ string, 'null' ]
          maxLength: 255
          description: ISO 3166 alpha-2 code, for example `DE`.
        notes:
          type: [ string, 'null' ]
          description: The registration record's notes.
        billingContactName:
          type: [ string, 'null' ]
          maxLength: 255
        billingFrequency:
          type: [ string, 'null' ]
          enum: [ MONTHLY, 2MONTHLY, QUARTERLY, HALFYEARLY, ANNUALLY, NOBILLING, null ]
        billingAddress1:
          type: [ string, 'null' ]
          maxLength: 255
        billingAddress2:
          type: [ string, 'null' ]
          maxLength: 255
        billingAddress3:
          type: [ string, 'null' ]
          maxLength: 255
        billingTownCity:
          type: [ string, 'null' ]
          maxLength: 255
        billingPostcode:
          type: [ string, 'null' ]
          maxLength: 255
        billingCountry:
          type: [ string, 'null' ]
          maxLength: 255
          description: ISO 3166 alpha-2 code, for example `DE`.
        billingEmail:
          type: [ string, 'null' ]
          format: email
          maxLength: 255
        billingTelephone:
          type: [ string, 'null' ]
          maxLength: 255
        purchaseOrderRequired:
          type: boolean
          description: |
            The API delta: the web form posts it, no web rule validates it. `true`, `false`,
            `1`, `0`, `"1"` or `"0"`; stored as 0/1.
        purchaseOrderNumber:
          type: [ string, 'null' ]
          maxLength: 50
        invoiceMethod:
          type: [ string, 'null' ]
          enum: [ EMAIL, POST, null ]
        invoiceEmail:
          type: [ string, 'null' ]
          maxLength: 255
          description: Not validated as an e-mail address - the web rule is a plain string.
        vatRate:
          type: [ string, 'null' ]
          maxLength: 255
        vatNumber:
          type: [ string, 'null' ]
          maxLength: 255
        billingNotes:
          type: [ string, 'null' ]
          description: The billing record's notes.

    BillingRegistrationUpdateResult:
      type: object
      title: BillingRegistrationUpdateResult
      required: [ billing_registration, changed ]
      properties:
        billing_registration:
          $ref: '#/components/schemas/BillingRegistration'
        changed:
          type: array
          items:
            type: string
          description: |
            The fields which actually changed, under the request's names - `billingNotes` for
            the billing record's notes - registration fields first. Empty when the PATCH matched
            what was stored. Timestamps are not listed.
