# Fragment of docs/provisioning-api.openapi.yaml, work package "offboarding" (wave 1b).
#
# Merge notes:
#   - paths./member/{cust}/offboard is new.
#   - components.schemas MemberOffboardInput, MemberOffboardResult, MemberOffboardRemoved and
#     ReleasedAddress are new; no existing name is replaced.
#   - The operation uses the existing `Members` tag.
#   - The `409` list in the description of the main document gains POST /member/{cust}/offboard.
#
# References to existing components: parameters/CustomerId; responses/Unauthorized, Forbidden,
# NotFound, TooManyRequests; schemas/Error, ValidationError, Member (as the members fragment
# extends it) and Connection (the member-scoped connection shape, ConnectionPresenter::summary()).

paths:

  /member/{cust}/offboard:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [ Members ]
      operationId: offboardMember
      summary: Take a member off the exchange - tear down its connections and close it
      description: |
        In one transaction:

        - **every connection of the member is torn down**, each exactly as
          `DELETE /connection/{vi}` removes one - the same code (`TearsDownConnections`): the
          physical interfaces through the inherited, fanout-aware `deletePi()`, the VLAN
          interfaces with their configured MACs, the discovered MACs, the sflow receivers and
          the virtual interface. Switch ports, IP addresses and MAC addresses become free; the
          address records stay in their VLAN's pool;
        - **the member is closed**: `dateleave` (given, or today) and `status` 2, Not Connected,
          with `lastupdatedby`, as `PATCH /member/{cust}` writes them;
        - **the member, its portal users and its contacts stay**, as history. Nothing else is
          changed; what stays behind is listed in `warnings`.

        IXP Manager has no such action: the web closes a member by setting the leave date, which
        releases nothing. `PATCH /member/{cust}` plus `DELETE /connection/{vi}` per connection
        reach the same end, but not atomically.

        **The leave date.** `Customer::scopeNotDeleted()` - which decides logins and API keys -
        compares it with the current date and time, so **a leave date of today already counts
        as left**. `Customer::SQL_CUST_CURRENT` - the configuration exports, `is_current` - keeps
        the member current through the leave date itself. A future leave date postpones nothing:
        the connections go now. Not given, the leave date is today - unless the member already
        has one of today or earlier, which is kept, so that a retry on a later day does not move
        it; one in the future is brought forward to today.

        **Idempotent.** A member without connections whose leave date and status already are
        what the request asks for is not written: `200`, nothing removed, `changed` empty.

        **Dry run.** `dry_run: true` performs every step inside the transaction and rolls it all
        back: the answer - including a `409` - is what the real request would give, short of
        `dry_run` and the member's `updated_at`. Nothing is written, logged or uncached.

        Logged when not a dry run and something changed: one line per removed connection, worded
        as `DELETE /connection/{vi}` words it and marked "(offboarding)", and one line for the
        member naming what changed and the `reason`.

        Not done: nothing on switches or route servers (they follow at their next configuration
        pull); no `Layer2Address\Deleted` event per MAC (bulk delete, as
        `DELETE /connection/{vi}`); nothing stops a new connection being ordered for the member
        afterwards.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberOffboardInput'
            examples:
              defaults:
                summary: today, for real
                value: {}
              preview:
                summary: preview an offboarding with a given leave date
                value:
                  dateleave: '2026-11-30'
                  dry_run: true
                  reason: Contract 4711 terminated
      responses:
        '200':
          description: |
            The member was offboarded - or, with `dry_run`, would be, exactly so. Also the answer
            for a member which had nothing left to offboard: `changed` empty, nothing removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOffboardResult'
              example:
                member:
                  id: 2
                  name: HEAnet
                  shortname: heanet
                  abbreviatedName: HEAnet
                  type: 1
                  status: 2
                  autsys: 1213
                  maxprefixes: 1000
                  maxprefixesv6: 200
                  peeringemail: peering@example.com
                  peeringmacro: AS-HEANET
                  peeringmacrov6: null
                  peeringpolicy: open
                  irrdb: 1
                  datejoin: '2014-01-06'
                  dateleave: '2026-11-24'
                  reseller: null
                  isReseller: false
                  corpwww: http://www.example.com/
                  nocphone: null
                  noc24hphone: null
                  nocemail: noc@example.com
                  nochours: '0'
                  nocwww: null
                  MD5Support: UNKNOWN
                  activepeeringmatrix: true
                  peeringdb_oauth: true
                  in_manrs: false
                  in_peeringdb: false
                  is_current: true
                  has_left: true
                  creator: travis
                  lastupdatedby: 1
                  created_at: '2014-01-06T00:00:00+00:00'
                  updated_at: '2026-11-24T21:42:17+00:00'
                changed: [ dateleave, status ]
                removed:
                  connections:
                    - id: 1
                      custid: 2
                      name: Port-Channel
                      trunk: false
                      lag_framing: true
                      channelgroup: 1
                      physical_interfaces:
                        - id: 1
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 3
                          switchport_name: GigabitEthernet3
                          switch: 1
                          switch_name: switch1
                        - id: 2
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 4
                          switchport_name: GigabitEthernet4
                          switch: 1
                          switch_name: switch1
                      vlan_interfaces:
                        - id: 1
                          vlan: 1
                          ipv4enabled: true
                          ipv4address: 10.1.0.10
                          ipv4hostname: a.heanet.ie
                          ipv6enabled: true
                          ipv6address: '2001:db8:1::10'
                          ipv6hostname: a.heanet.ie
                          rsclient: true
                          irrdbfilter: true
                          as112client: true
                          maxbgpprefix: { ipv4: 900, ipv6: null }
                    - id: 2
                      custid: 2
                      name: Port-Channel
                      trunk: true
                      lag_framing: true
                      channelgroup: 2
                      physical_interfaces:
                        - id: 3
                          status: 1
                          speed: 1000
                          duplex: full
                          rate_limit: null
                          autoneg: true
                          switchport: 25
                          switchport_name: GigabitEthernet1
                          switch: 2
                          switch_name: switch2
                      vlan_interfaces:
                        - id: 2
                          vlan: 2
                          ipv4enabled: true
                          ipv4address: 10.2.0.11
                          ipv4hostname: b.heanet.ie
                          ipv6enabled: true
                          ipv6address: '2001:db8:2::11'
                          ipv6hostname: b.heanet.ie
                          rsclient: true
                          irrdbfilter: true
                          as112client: true
                          maxbgpprefix: { ipv4: null, ipv6: 300 }
                  physical_interfaces: 3
                  vlan_interfaces: 2
                  mac_addresses: 0
                  discovered_mac_addresses: 0
                  sflow_receivers: 0
                  ip_addresses:
                    - { id: 10, vlan: 1, protocol: 4, address: 10.1.0.10 }
                    - { id: 16, vlan: 1, protocol: 6, address: '2001:db8:1::10' }
                    - { id: 137, vlan: 2, protocol: 4, address: 10.2.0.11 }
                    - { id: 417, vlan: 2, protocol: 6, address: '2001:db8:2::11' }
                warnings:
                  - 'This member has 6 staged and 6 production route server filter rule(s). They stay: with no route server session left they have no effect, and IXP Manager removes them only with the member itself.'
                  - '1 portal user(s) have no active member besides this one: hecustadmin (id 5). They are neither disabled nor deleted, but from 2026-11-24 on IXP Manager refuses their login ("Your user account is not associated with any active members."), ends a session of theirs at its next request and refuses their API keys. DELETE user/{u} removes a user for good.'
                  - '1 portal user(s) have this member as their default member but belong to another active member as well: hecustuser (id 4). From 2026-11-24 on IXP Manager ends a session of theirs at its next request and makes an active member the default at their next login; until then it refuses their API keys.'
                dry_run: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, and nothing was changed - a dry run answers the same:

            - a connection of the member belongs to a core bundle, which
              `DELETE /connection/{vi}` refuses as well;
            - the member is the default member of the API key's own user and the offboarding
              would deactivate it - a leave date of today or earlier - after which
              `ApiAuthenticate` would refuse the key. Refused exactly as `PATCH /member/{cust}`
              refuses it; a later leave date passes, with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coreBundle:
                  summary: a connection in a core bundle
                  value:
                    message: "Connection(s) 8, 9 of this member belong to a core bundle - the exchange's own backbone, which DELETE connection/{vi} refuses as well. Remove the core bundle in the web interface first. Nothing was changed."
                selfLockout:
                  summary: the API key owner's default member
                  value:
                    message: "Offboarding this member would deactivate the default member of the API key's own user, after which IXP Manager refuses the key. Nothing was changed. Offboard it with a key whose user has another default member."
        '422':
          description: |
            The body failed validation: a `dateleave` which is not a `Y-m-d` calendar date, a
            `dry_run` which is not a boolean, a `reason` which is not a string of at most 255
            characters - or a key this endpoint does not know. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The dateleave does not match the format Y-m-d. (and 1 more error)
                errors:
                  dateleave:
                    - The dateleave does not match the format Y-m-d.
                  dryrun:
                    - "Unknown parameter 'dryrun'. This endpoint accepts: dateleave, dry_run, reason. Nothing was changed."
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:

  schemas:

    MemberOffboardInput:
      type: object
      title: MemberOffboardInput
      description: |
        The body of `POST /member/{cust}/offboard`, validated by `OffboardMember`. Every field is
        optional, and any other key is refused with `422` - a misspelt `dry_run` must not turn a
        preview into the real request.
      additionalProperties: false
      properties:
        dateleave:
          type: [ string, 'null' ]
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            The leave date, `Y-m-d`, a real calendar date (`date_format:Y-m-d`). Past, future and
            before `datejoin` are all accepted. Absent or null: today - unless the member already
            has a leave date of today or earlier, which is then kept. Today counts as left for
            logins and API keys at once.
          example: '2026-11-30'
        dry_run:
          type: [ boolean, 'null' ]
          default: false
          description: |
            `true`: answer what the request would do, and do nothing. `1`/`0` and the strings
            `"true"`/`"false"` (also `"yes"`/`"no"`, `"on"`/`"off"`) are accepted too; anything
            else is a `422`, never read as false.
          example: true
        reason:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Why. Written to the log line of the offboarding and stored nowhere else; control
            characters, line breaks included, become spaces.
          example: Contract 4711 terminated

    MemberOffboardResult:
      type: object
      title: MemberOffboardResult
      description: |
        What an offboarding did - or, with `dry_run`, would do: identical either way, short of
        `dry_run` and `member.updated_at`.
      required: [ member, changed, removed, warnings, dry_run ]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        changed:
          type: array
          items:
            type: string
            enum: [ dateleave, status ]
          description: |
            The member attributes which changed, in column order, as `PATCH /member/{cust}`
            reports them - empty when the leave date and the status already were what the
            request asks for. `updated_at` and `lastupdatedby` are not listed.
        removed:
          $ref: '#/components/schemas/MemberOffboardRemoved'
        warnings:
          type: array
          items:
            type: string
          description: |
            What the offboarding leaves behind, and what IXP Manager then does about it, one
            sentence or two each - for a person to read, not a stable identifier to match on. In
            this order, each only when it applies: reseller fanout links handled by the teardown;
            patch panel ports still allocated to the member (one each, naming the switch port it
            is patched to and whether this offboarding released it); colocated equipment;
            console server connections; the member's own route server filters; other members'
            route server filters naming it as peer; resold members which have not left (for a
            reseller); portal users with no active member besides this one - IXP Manager refuses
            their login from the leave date on; portal users with another active member whose
            default member this is - moved to an active member at their next login, their API
            keys refused until then; the member being the API key owner's default member with a
            leave date ahead;
            a Suspended member made Not Connected - active again - until a leave date ahead.
        dry_run:
          type: boolean
          description: Whether this was a preview, which changed nothing.

    MemberOffboardRemoved:
      type: object
      title: MemberOffboardRemoved
      description: |
        What the teardown removed, or would remove. Zeros and empty lists for a member without
        connections.
      required:
        - connections
        - physical_interfaces
        - vlan_interfaces
        - mac_addresses
        - discovered_mac_addresses
        - sflow_receivers
        - ip_addresses
      properties:
        connections:
          type: array
          description: |
            One per connection torn down, in id order, as `GET /member/{cust}/connection`
            presented it just before.
          items:
            $ref: '#/components/schemas/Connection'
        physical_interfaces:
          type: integer
          minimum: 0
        vlan_interfaces:
          type: integer
          minimum: 0
        mac_addresses:
          type: integer
          minimum: 0
          description: Configured MAC addresses (`l2address`) of the VLAN interfaces.
        discovered_mac_addresses:
          type: integer
          minimum: 0
          description: Discovered MAC addresses (`macaddress`) of the connections.
        sflow_receivers:
          type: integer
          minimum: 0
          description: Removed with the virtual interfaces by the foreign key's `ON DELETE CASCADE`.
        ip_addresses:
          type: array
          description: Every address released to its VLAN's pool. The pool entries themselves stay.
          items:
            $ref: '#/components/schemas/ReleasedAddress'

    ReleasedAddress:
      type: object
      title: ReleasedAddress
      description: An address a removed VLAN interface held, now free again.
      required: [ id, vlan, protocol, address ]
      properties:
        id:
          type: integer
          description: '`ipv4address.id` or `ipv6address.id` - the `id` of `GET /vlan/{vlan}/address`.'
          example: 10
        vlan:
          type: integer
          description: '`vlan.id`.'
          example: 1
        protocol:
          type: integer
          enum: [ 4, 6 ]
        address:
          type: string
          example: 10.1.0.10
