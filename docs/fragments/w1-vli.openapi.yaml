# Fragment of docs/provisioning-api.openapi.yaml - wave 1, work package "VLAN interfaces and MAC
# addresses". Merge `paths` and `components.schemas` into the specification. References to
# components which exist there already (responses, Error, ValidationError, VirtualInterfaceId) are
# used as they are; the path parameters of this package are declared inline so that the fragment
# adds nothing outside `paths` and `components.schemas`. The operations carry the existing
# `Connections` tag; dedicated tags can be declared when merging.

paths:

  /connection/{vi}/vlan-interface:
    parameters:
      - $ref: '#/components/parameters/VirtualInterfaceId'
    post:
      tags: [ Connections ]
      operationId: createVlanInterface
      summary: Add a VLAN to an existing connection
      description: |
        Creates a VLAN interface on the connection - the member joins one more VLAN on the same
        port. The equivalent of the web UI's "add VLAN interface" form.

        Addresses are handled as by `POST /member/{cust}/connection`, inside one transaction:
        `"auto"` takes the numerically next free address of the VLAN's pool under a row lock, an
        explicit address must already be in the pool and be free, and an enabled family must
        have an address. Fields left out take what that endpoint gives them: the column defaults
        (IRRDB filtering on, the other flags off) and `busyhost` false.

        **Max prefixes are not copied from the member**, although the web form pre-fills them.
        Left out they stay null, and the router configuration falls back to the member's
        `maxprefixes` / `maxprefixesv6` when it is generated - so the limits follow later
        changes to the member instead of being frozen on the interface.

        Stricter than the web: **a connection has one VLAN interface per VLAN.** The `422` names
        the interface which exists, so that a create retried after a timeout can be reconciled.
        A connection which belongs to a core bundle is refused with `409`.

        `warnings` carries what the web UI would have shown without refusing: IRRDB filtering
        on a route server client whose member has no IRRDB source, and a second VLAN on a
        connection without 802.1q framing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VlanInterfaceInput'
            examples:
              secondVlan:
                summary: Dual stack in a second VLAN, automatic addressing
                value:
                  vlanid: 2
                  ipv4enabled: true
                  ipv4address: auto
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret: s3cret-handed-to-the-member
                  ipv6bgpmd5secret: s3cret-handed-to-the-member
                  rsclient: true
                  irrdbfilter: true
              explicitIpv4Only:
                summary: IPv4 only, an explicit address, a frozen prefix limit
                value:
                  vlanid: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4maxbgpprefix: 500
                  ipv6enabled: false
                  rsclient: true
      responses:
        '201':
          description: The VLAN interface was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlanInterfaceCreateResult'
              example:
                vlan_interface:
                  id: 812
                  connection: 501
                  custid: 97
                  vlan: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret_set: true
                  ipv4canping: false
                  ipv4monitorrcbgp: false
                  ipv4maxbgpprefix: null
                  ipv6enabled: true
                  ipv6address: '2001:db8:2::4d'
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv6bgpmd5secret_set: true
                  ipv6canping: false
                  ipv6monitorrcbgp: false
                  ipv6maxbgpprefix: null
                  mcastenabled: false
                  irrdbfilter: true
                  rsclient: true
                  rsmorespecifics: false
                  as112client: false
                  busyhost: false
                  maxbgpprefix:
                    ipv4: null
                    ipv6: null
                  mac_addresses: []
                  created_at: '2026-11-24T20:03:34+00:00'
                  updated_at: '2026-11-24T20:03:34+00:00'
                warnings:
                  - 802.1q framing is not set on connection 501 but it has more than one VLAN interface. Without it the port can carry one VLAN only.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The connection belongs to a core bundle; or another request won a race - it added a
            VLAN interface in the same VLAN to this connection, or took an address of this one,
            between the checks and the insert. **Nothing was created.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coreBundle:
                  summary: a core bundle's virtual interface
                  value:
                    message: Connection 9 belongs to a core bundle. VLAN interfaces belong on member connections.
                addressRaced:
                  summary: an address taken by a concurrent request
                  value:
                    message: >-
                      Another request took an address of this VLAN interface while it was being
                      created. Nothing was created. Check the addresses and retry.
        '422':
          description: |
            Either the payload failed validation (`message` **and** `errors`) - the web form's
            rules, an address which is neither an address nor `"auto"`, a second VLAN interface
            in the same VLAN - or an address could not be used (`message` only, raised by
            `IpAllocator`). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                sameVlanTwice:
                  summary: the connection is in this VLAN already - validation
                  value:
                    message: >-
                      Connection 501 already has a VLAN interface in VLAN Peering LAN 1 (id 1):
                      VLAN interface 688. A connection has one VLAN interface per VLAN.
                    errors:
                      vlanid:
                        - >-
                          Connection 501 already has a VLAN interface in VLAN Peering LAN 1 (id 1):
                          VLAN interface 688. A connection has one VLAN interface per VLAN.
                enabledFamilyWithoutAddress:
                  summary: ipv6enabled with no address - validation
                  value:
                    message: The ipv6address field is required.
                    errors:
                      ipv6address:
                        - The ipv6address field is required.
                addressNotInPool:
                  summary: explicit address which is not in this VLAN's pool
                  value:
                    message: IPv4 address 203.0.113.251 is not in the address pool of VLAN Peering LAN 2 (id 2).
                poolExhausted:
                  summary: '"auto" with nothing left to allocate'
                  value:
                    message: No free IPv4 address left in VLAN Quarantine LAN 1 (id 3).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /vlan-interface/{vli}:
    parameters:
      - name: vli
        in: path
        required: true
        description: |
          The VLAN interface's `vlaninterface.id` - `vlan_interfaces[].id` of a connection.
          Resolved by route model binding, so an unknown id is `404`.
        schema:
          type: integer
          minimum: 1
        example: 812
    get:
      tags: [ Connections ]
      operationId: showVlanInterface
      summary: Read a VLAN interface
      description: |
        Every field the web edit form can change, under the names `PATCH` takes, plus the
        configured MACs. **MD5 secrets are never returned** - `ipv4bgpmd5secret_set` /
        `ipv6bgpmd5secret_set` say whether one is configured.

        A strict superset of the VLAN interfaces `GET /member/{cust}/connection` embeds: every
        field there is here, with the same name and type.
      responses:
        '200':
          description: The VLAN interface.
          content:
            application/json:
              schema:
                type: object
                required: [ vlan_interface ]
                properties:
                  vlan_interface:
                    $ref: '#/components/schemas/VlanInterface'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [ Connections ]
      operationId: updateVlanInterface
      summary: Change a VLAN interface
      description: |
        Changes any subset of the edit form's fields. A field left out keeps its value; a field
        sent as `null` is cleared (the flags are true or false - null is refused).

        The change is validated as the web edit form validates it: `UpdateVlanInterface`
        completes the request with the interface's current values and runs the whole record
        through the rules, so that `{"ipv4address": null}` on an interface with IPv4 enabled,
        or `{"ipv6enabled": true}` without an address, is refused - an enabled family keeps an
        address. Only the fields sent are written, onto the interface as it stands under a row
        lock.

        Addresses: the current address, or `"auto"` for a family which has one, changes nothing;
        another explicit address renumbers and returns the old one to the pool. Disabling a
        family keeps its address reserved, as the web does - send the address as `null` as well
        to release it.

        Moving to another VLAN (`vlanid`): every family holding an address must be sent a new
        one, `"auto"` or `null`; the interface's MACs must not be configured on another
        interface of the new VLAN; the connection must not have an interface there already.
        `virtualinterfaceid` cannot change and is ignored, like every field outside the form.

        `changed` lists the fields whose value changed, under the request's names
        (`ipv4address`, not the column `ipv4addressid`), never with a value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VlanInterfaceUpdate'
            examples:
              rotateSecrets:
                summary: rotate the MD5 secrets
                value:
                  ipv4bgpmd5secret: n3w-s3cret
                  ipv6bgpmd5secret: n3w-s3cret
              enableIpv6:
                summary: enable IPv6 with an automatic address
                value:
                  ipv6enabled: true
                  ipv6address: auto
                  ipv6hostname: examplenet.kleyrex.net
              leaveQuarantine:
                summary: move from the quarantine VLAN to the peering LAN
                value:
                  vlanid: 1
                  ipv4address: auto
                  ipv6address: auto
      responses:
        '200':
          description: The VLAN interface after the change, and the fields which actually changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlanInterfaceUpdateResult'
              example:
                vlan_interface:
                  id: 812
                  connection: 501
                  custid: 97
                  vlan: 2
                  ipv4enabled: true
                  ipv4address: 10.2.0.77
                  ipv4hostname: examplenet.lan2.kleyrex.net
                  ipv4bgpmd5secret_set: true
                  ipv4canping: false
                  ipv4monitorrcbgp: false
                  ipv4maxbgpprefix: null
                  ipv6enabled: true
                  ipv6address: '2001:db8:2::4d'
                  ipv6hostname: examplenet.lan2.kleyrex.net
                  ipv6bgpmd5secret_set: true
                  ipv6canping: false
                  ipv6monitorrcbgp: false
                  ipv6maxbgpprefix: null
                  mcastenabled: false
                  irrdbfilter: true
                  rsclient: true
                  rsmorespecifics: false
                  as112client: false
                  busyhost: false
                  maxbgpprefix:
                    ipv4: null
                    ipv6: null
                  mac_addresses: []
                  created_at: '2026-11-24T20:03:34+00:00'
                  updated_at: '2026-11-24T21:15:02+00:00'
                changed: [ ipv4bgpmd5secret, ipv6bgpmd5secret ]
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request changed the interface, or took an address this change asked for,
            between the validation and the write, so that the change would now break an
            invariant (an enabled family without an address, an address outside the interface's
            VLAN, a duplicate MAC in the VLAN, two interfaces of the connection in one VLAN).
            **Nothing was changed.** Read the interface again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  VLAN interface 812 was changed by another request while this one was being
                  processed, and this change would now leave it with IPv6 enabled but no address,
                  or with an address outside its VLAN. Nothing was changed. Read the interface
                  again and retry.
        '422':
          description: |
            The completed record failed validation (`message` and `errors`), or an address could
            not be used (`message` only). Nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                clearingAnEnabledFamilysAddress:
                  summary: '{"ipv4address": null} with IPv4 enabled - validation'
                  value:
                    message: The ipv4address field is required.
                    errors:
                      ipv4address:
                        - The ipv4address field is required.
                moveWithoutNewAddress:
                  summary: vlanid changed, the old VLAN's address left in place - validation
                  value:
                    message: >-
                      VLAN interface 812 moves to VLAN Peering LAN 1 (id 1), and its IPv4 address
                      10.3.0.5 belongs to VLAN Quarantine LAN 1 (id 3). Send ipv4address as well:
                      an address of the new VLAN, "auto", or null.
                    errors:
                      ipv4address:
                        - >-
                          VLAN interface 812 moves to VLAN Peering LAN 1 (id 1), and its IPv4
                          address 10.3.0.5 belongs to VLAN Quarantine LAN 1 (id 3). Send
                          ipv4address as well: an address of the new VLAN, "auto", or null.
                addressTaken:
                  summary: an explicit address of another interface
                  value:
                    message: IPv4 address 10.2.0.12 is already assigned to another VLAN interface.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [ Connections ]
      operationId: deleteVlanInterface
      summary: Remove a VLAN interface
      description: |
        Removes the interface and the MACs configured for it, in one transaction; its addresses
        return to the VLAN's pool (the address records stay). Every MAC removed raises the
        `Layer2Address\Deleted` event once the deletion has committed, as `DELETE /mac/{l2a}`
        does - the web's own delete removes them in bulk without one.

        **Not the last VLAN interface of a connection**: that is `409`, because a connection
        without one is a port in no VLAN which the switch configuration silently drops. Remove
        the whole connection with `DELETE /connection/{vi}` instead.

        Deleting twice gives `200`, then `404`.
      responses:
        '200':
          description: The VLAN interface was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The interface is the connection's only one. Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  VLAN interface 688 is the only VLAN interface of connection 501. A connection
                  needs at least one; to take the member off this port altogether, delete the
                  connection (DELETE connection/501).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /vlan-interface/{vli}/mac:
    parameters:
      - name: vli
        in: path
        required: true
        description: The VLAN interface's `vlaninterface.id`. Unknown is `404`.
        schema:
          type: integer
          minimum: 1
        example: 812
    get:
      tags: [ Connections ]
      operationId: listVlanInterfaceMacs
      summary: List the configured MAC addresses of a VLAN interface
      responses:
        '200':
          description: The configured MACs, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacAddressList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [ Connections ]
      operationId: addVlanInterfaceMac
      summary: Add a configured MAC address to a VLAN interface
      description: |
        The checks of the web controller (`Api\V4\Layer2AddressController::store()`), as
        validation rules - `MacAddressRulesParityTest` holds the two to the same verdicts:

        - any usual notation is accepted - case, colons, dashes, dots - and the MAC is stored
          as twelve lowercase hex digits;
        - the MAC must not be configured on any VLAN interface of the same VLAN, this one
          included. The same MAC in another VLAN is accepted.

        Raises `Layer2Address\Added` once the MAC has committed, which sends the change
        notification e-mail when `ixp_fe.layer2-addresses.email_on_superuser_change` is set.
        The customer limits on the number of MACs apply to members editing their own, not to
        superusers, and so not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacAddressInput'
            example:
              mac: '00:1A:2B:3C:4D:5E'
      responses:
        '201':
          description: The MAC was added.
          content:
            application/json:
              schema:
                type: object
                required: [ mac_address ]
                properties:
                  mac_address:
                    $ref: '#/components/schemas/MacAddress'
              example:
                mac_address:
                  id: 4711
                  mac: '001a2b3c4d5e'
                  mac_colon: '00:1a:2b:3c:4d:5e'
                  vlan_interface: 812
                  connection: 501
                  vlan: 2
                  custid: 97
                  member_name: Example Networks GmbH
                  created_at: '2026-11-24T20:03:34+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request added the same MAC to the VLAN, or deleted the VLAN interface,
            between the validation and the insert. Nothing was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  Another request added this MAC address while this one was being processed.
                  MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2 (id 2),
                  on VLAN interface 790. A MAC address is unique within a VLAN.
        '422':
          description: |
            Not a MAC address, or configured in this VLAN already - the message names the VLAN
            interface which has it, so that a caller whose earlier attempt timed out can tell its
            own MAC from somebody else's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                malformed:
                  summary: not twelve hex digits
                  value:
                    message: 'The mac must be a MAC address: 12 hexadecimal digits, with or without separators.'
                    errors:
                      mac:
                        - 'The mac must be a MAC address: 12 hexadecimal digits, with or without separators.'
                taken:
                  summary: configured on an interface of the same VLAN
                  value:
                    message: >-
                      MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2
                      (id 2), on VLAN interface 790. A MAC address is unique within a VLAN.
                    errors:
                      mac:
                        - >-
                          MAC address 00:1a:2b:3c:4d:5e is already configured in VLAN Peering LAN 2
                          (id 2), on VLAN interface 790. A MAC address is unique within a VLAN.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /mac:
    get:
      tags: [ Connections ]
      operationId: lookupMacs
      summary: Find configured MAC addresses - which member owns a MAC
      description: |
        The filters are combined with AND and each is optional. Without any, every configured
        MAC is listed: the whole set a reconciliation compares against, in one request. An
        unknown member or VLAN is an empty list, not a `404`.
      parameters:
        - name: mac
          in: query
          required: false
          description: A MAC address in any usual notation, normalised as on the way in.
          schema:
            type: string
          example: '0011.2233.4455'
        - name: member
          in: query
          required: false
          description: A member's `cust.id`.
          schema:
            type: integer
          example: 97
        - name: vlan
          in: query
          required: false
          description: A VLAN's `vlan.id`.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: The matching MACs, ordered by MAC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacAddressList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: A `mac` which is not twelve hex digits, or a `member` / `vlan` which is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /mac/{l2a}:
    parameters:
      - name: l2a
        in: path
        required: true
        description: The configured MAC's `l2address.id` - `mac_address.id`. Unknown is `404`.
        schema:
          type: integer
          minimum: 1
        example: 4711
    delete:
      tags: [ Connections ]
      operationId: deleteMac
      summary: Remove a configured MAC address
      description: |
        Raises `Layer2Address\Deleted`, as the web does. The customer limit on the minimum number
        of MACs does not apply to superusers, and so not here.
      responses:
        '200':
          description: The MAC was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ deleted ]
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:

  schemas:

    VlanInterface:
      type: object
      title: VlanInterface
      description: |
        A connection's presence in one VLAN, as `VlanInterfacePresenter` builds it. Every field
        of the web edit form, under the names `PATCH` takes, except the MD5 secrets, which are
        reported as `*_set` booleans and never returned. Addresses are the address strings of
        the pool. Flags which are NULL in the database are reported as false.

        A strict superset of `ConnectionVlanInterface`: every field there is here, with the same
        name and type - `maxbgpprefix` included.
      required:
        - id
        - connection
        - custid
        - vlan
        - ipv4enabled
        - ipv4address
        - ipv4hostname
        - ipv4bgpmd5secret_set
        - ipv4canping
        - ipv4monitorrcbgp
        - ipv4maxbgpprefix
        - ipv6enabled
        - ipv6address
        - ipv6hostname
        - ipv6bgpmd5secret_set
        - ipv6canping
        - ipv6monitorrcbgp
        - ipv6maxbgpprefix
        - mcastenabled
        - irrdbfilter
        - rsclient
        - rsmorespecifics
        - as112client
        - busyhost
        - maxbgpprefix
        - mac_addresses
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: '`vlaninterface.id`.'
        connection:
          type: [ integer, 'null' ]
          description: '`virtualinterface.id` of the connection - the `{vi}` of the connection endpoints.'
        custid:
          type: [ integer, 'null' ]
          description: The member the connection belongs to.
        vlan:
          type: [ integer, 'null' ]
          description: '`vlan.id` - the `vlanid` of the request bodies.'
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
        ipv4hostname:
          type: [ string, 'null' ]
        ipv4bgpmd5secret_set:
          type: boolean
          description: Whether an IPv4 BGP MD5 secret is configured. The secret is write-only.
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
          description: |
            The prefix limit of the IPv4 route server sessions. Null (or 0) means the member's
            `maxprefixes` applies, read when the configuration is generated.
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
        ipv6hostname:
          type: [ string, 'null' ]
        ipv6bgpmd5secret_set:
          type: boolean
          description: Whether an IPv6 BGP MD5 secret is configured. The secret is write-only.
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
          description: As `ipv4maxbgpprefix`, falling back to the member's `maxprefixesv6`.
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean
        maxbgpprefix:
          type: object
          description: |
            The two prefix limits in the shape `ConnectionVlanInterface` has always used - the
            same numbers as `ipv4maxbgpprefix` / `ipv6maxbgpprefix`.
          required: [ ipv4, ipv6 ]
          properties:
            ipv4:
              type: [ integer, 'null' ]
            ipv6:
              type: [ integer, 'null' ]
        mac_addresses:
          type: array
          description: The configured MACs, oldest first.
          items:
            $ref: '#/components/schemas/MacAddress'
        created_at:
          type: [ string, 'null' ]
          format: date-time
          description: ISO 8601. Null for interfaces created before IXP Manager kept timestamps.
        updated_at:
          type: [ string, 'null' ]
          format: date-time

    VlanInterfaceInput:
      type: object
      title: VlanInterfaceInput
      description: |
        The body of `POST /connection/{vi}/vlan-interface`. Validated by `StoreVlanInterface`:
        the web form's `IXP\Http\Requests\StoreVlanInterface` with an empty delta and four
        overrides - `ipv4address` / `ipv6address` also accept `"auto"`, and the hostname rules
        stop at their first failure (`bail`), which turns a 500 for a hostname that is not a
        string into a 422. `virtualinterfaceid` comes from the route; a value in the body is
        ignored.
      required: [ vlanid ]
      properties:
        vlanid:
          type: integer
          description: '`vlan.id`. Must exist. The connection must not have a VLAN interface in it already.'
        ipv4enabled:
          type: boolean
        ipv4address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            An IPv4 address of the VLAN's pool which is free, or `"auto"`. **Required when
            `ipv4enabled` is true.**
          examples: [ auto, 10.2.0.77 ]
        ipv4hostname:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            Validated with `IdnValidate`. Required when `ipv4enabled` is true and
            `ixp_fe.vlaninterfaces.hostname_required` is set - the default.
        ipv4bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
          description: Write-only. Generate it on the calling side; it is never returned.
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
          description: Left out or null, the member's limit applies when the configuration is generated.
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
          maxLength: 255
          description: As `ipv4address`, for IPv6; matched against the pool in any equivalent notation.
          examples: [ auto, '2001:db8:2::4d' ]
        ipv6hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
          description: Defaults to true when left out (the column default).
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean

    VlanInterfaceUpdate:
      type: object
      title: VlanInterfaceUpdate
      description: |
        The body of `PATCH /vlan-interface/{vli}`: any subset of the fields of
        `VlanInterfaceInput`. A field left out keeps its value, one sent as `null` is cleared;
        the flags cannot be null. Validated by `UpdateVlanInterface` against the record
        completed with the current values. Every other field is ignored, `virtualinterfaceid`
        included.
      properties:
        vlanid:
          type: integer
          description: |
            Moves the interface to another VLAN. Every family holding an address must then be
            sent a new one, `"auto"` or `null`; the interface's MACs must not be configured on
            another interface of the new VLAN.
        ipv4enabled:
          type: boolean
          description: Disabling keeps the address reserved; send `ipv4address` as `null` as well to release it.
        ipv4address:
          type: [ string, 'null' ]
          maxLength: 255
          description: |
            The current address or `"auto"` (when the family has an address in this VLAN)
            changes nothing; another address of the pool renumbers; `null` releases it - refused
            while the family is enabled.
        ipv4hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv4bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv4canping:
          type: boolean
        ipv4monitorrcbgp:
          type: boolean
        ipv4maxbgpprefix:
          type: [ integer, 'null' ]
        ipv6enabled:
          type: boolean
        ipv6address:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6hostname:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6bgpmd5secret:
          type: [ string, 'null' ]
          maxLength: 255
        ipv6canping:
          type: boolean
        ipv6monitorrcbgp:
          type: boolean
        ipv6maxbgpprefix:
          type: [ integer, 'null' ]
        mcastenabled:
          type: boolean
        irrdbfilter:
          type: boolean
        rsclient:
          type: boolean
        rsmorespecifics:
          type: boolean
        as112client:
          type: boolean
        busyhost:
          type: boolean

    VlanInterfaceCreateResult:
      type: object
      title: VlanInterfaceCreateResult
      required: [ vlan_interface, warnings ]
      properties:
        vlan_interface:
          $ref: '#/components/schemas/VlanInterface'
        warnings:
          type: array
          description: |
            What the web UI would show without refusing - IRRDB filtering on a route server
            client whose member has no IRRDB source; a second VLAN on a connection without
            802.1q framing. Empty when there is nothing to say.
          items:
            type: string

    VlanInterfaceUpdateResult:
      type: object
      title: VlanInterfaceUpdateResult
      required: [ vlan_interface, changed, warnings ]
      properties:
        vlan_interface:
          $ref: '#/components/schemas/VlanInterface'
        changed:
          type: array
          description: |
            The fields whose value changed, in the order of the edit form, under the request's
            names (`ipv4address`, not `ipv4addressid`). Empty when the PATCH matched what was
            stored.
          items:
            type: string
        warnings:
          type: array
          description: As for a create; the 802.1q warning only arises there.
          items:
            type: string

    MacAddress:
      type: object
      title: MacAddress
      description: |
        A configured MAC address (`Layer2Address`), as `MacAddressPresenter` builds it, with who
        holds it - under the names the address pool listing uses for who holds an address.
      required: [ id, mac, mac_colon, vlan_interface, connection, vlan, custid, member_name, created_at ]
      properties:
        id:
          type: integer
          description: '`l2address.id` - the `{l2a}` of `DELETE /mac/{l2a}`.'
        mac:
          type: [ string, 'null' ]
          pattern: '^[0-9a-f]{12}$'
          description: Twelve lowercase hex digits, as stored.
        mac_colon:
          type: [ string, 'null' ]
          description: The colon-separated form switch configuration uses.
          examples: [ '00:1a:2b:3c:4d:5e' ]
        vlan_interface:
          type: integer
        connection:
          type: [ integer, 'null' ]
        vlan:
          type: [ integer, 'null' ]
        custid:
          type: [ integer, 'null' ]
        member_name:
          type: [ string, 'null' ]
        created_at:
          type: [ string, 'null' ]
          format: date-time

    MacAddressInput:
      type: object
      title: MacAddressInput
      required: [ mac ]
      properties:
        mac:
          type: string
          description: |
            A MAC address in any usual notation - `00:1A:2B:3C:4D:5E`, `001a.2b3c.4d5e`,
            `00-1a-2b-3c-4d-5e`, `001A2B3C4D5E`. Everything but hex digits is dropped; twelve
            must remain.

    MacAddressList:
      type: object
      title: MacAddressList
      required: [ mac_addresses ]
      properties:
        mac_addresses:
          type: array
          items:
            $ref: '#/components/schemas/MacAddress'
