# Fragment of docs/provisioning-api.openapi.yaml - wave 1b, work package "hooks" (outgoing webhooks).
#
# No path was added. Every provisioning endpoint gains one optional request header,
# X-Correlation-Id, which RecordWebhookOrigin validates, echoes and stamps on the webhook events
# the request causes.
#
# To merge:
#   - add `components.parameters.CorrelationId`, `components.headers.CorrelationId` and
#     `components.responses.InvalidCorrelationId` below to the main specification;
#   - reference the parameter from every operation (or from every path item, which applies it to
#     all of the path's operations):
#         parameters:
#           - $ref: '#/components/parameters/CorrelationId'
#   - add the response header to the responses of every operation, and `422` with
#     `$ref: '#/components/responses/InvalidCorrelationId'` where an operation has no 422 yet
#     (the GET endpoints - the header is checked on every method);
#   - append the paragraph under `info.description` below to the main description.
#
# #/components/schemas/ValidationError points into the main specification.

info:
  description: |
    **Correlation ids.** Every endpoint accepts an optional `X-Correlation-Id` header. It is
    echoed in the response and stamped, as `origin.correlation_id`, on every outgoing webhook
    event the request causes - side effects on other resources included - next to
    `origin.channel: provisioning_api` and `origin.api_key_id`. A caller which also receives the
    webhooks recognises the echo of its own commands by it. See the webhook documentation.

components:

  parameters:

    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        The caller's identifier for the command this request belongs to - a fresh value per
        command, recorded by the caller before it calls. 1 to 100 characters from
        `A-Z a-z 0-9 . _ : -`; a UUID fits. Anything else, including an over-long value, is
        answered with `422` before the request is processed, whether webhooks are enabled or not:
        a value that was silently dropped would leave the caller unable to recognise its change.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]{1,100}$'
      example: api5-cmd-88f1

  headers:

    CorrelationId:
      description: The request's `X-Correlation-Id`, unchanged; absent when the request had none.
      schema:
        type: string
      example: api5-cmd-88f1

  responses:

    InvalidCorrelationId:
      description: |
        The `X-Correlation-Id` header is not 1 to 100 characters from `A-Z a-z 0-9 . _ : -`.
        Nothing was processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: 'The X-Correlation-Id header must be 1 to 100 characters from A-Z, a-z, 0-9, ".", "_", ":" and "-". Nothing was changed.'
            errors:
              X-Correlation-Id:
                - 'The X-Correlation-Id header must be 1 to 100 characters from A-Z, a-z, 0-9, ".", "_", ":" and "-". Nothing was changed.'
